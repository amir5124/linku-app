<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Jadwal DLU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="bg-slate-50 font-sans antialiased" x-data="shipDluApp()">

    <div
        class="fixed top-0 inset-x-0 bg-[#0194f3] text-white p-4 z-50 shadow-md flex items-center gap-3 max-w-md mx-auto">
        <button x-show="stage === 'results' || stage === 'passenger_form' || stage === 'issued_success'"
            @click="goBack()" class="p-1 hover:bg-blue-700 rounded-full transition-colors">
            <i data-lucide="arrow-left" class="w-6 h-6"></i>
        </button>
        <i x-show="stage === 'search'" data-lucide="ship" class="w-6 h-6"></i>
        <h2 class="font-bold text-sm uppercase tracking-tight"
            x-text="stage === 'results' ? 'Pilih Jadwal Kapal' : (stage === 'passenger_form' ? 'Isi Data Penumpang' : (stage === 'issued_success' ? 'Booking Berhasil' : 'Pemesanan Kapal DLU'))">
        </h2>
    </div>

    <div x-show="loading"
        class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex items-center justify-center max-w-md mx-auto"
        x-cloak>
        <div class="text-center">
            <div
                class="w-12 h-12 border-4 border-[#0194f3] border-t-transparent rounded-full animate-spin mx-auto mb-4">
            </div>
            <p class="text-xs font-bold text-slate-600 uppercase tracking-widest" x-text="loadingText"></p>
        </div>
    </div>

    <div class="max-w-md mx-auto min-h-screen bg-white pt-20 px-4 pb-10 shadow-xl">

        <template x-if="stage === 'search'">
            <div class="space-y-6">
                <div class="bg-slate-50 p-5 rounded-3xl border border-slate-100 space-y-4">
                    <div class="flex items-center gap-2 mb-2">
                        <i data-lucide="map-pin" class="w-4 h-4 text-[#0194f3]"></i>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Rute
                            Perjalanan</span>
                    </div>
                    <select x-model="search.originPort"
                        class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#0194f3] appearance-none">
                        <option value="">Pilih Pelabuhan Asal</option>
                        <template x-for="port in routes.origins" :key="port.originPort">
                            <option :value="port.originPort" x-text="port.originName"></option>
                        </template>
                    </select>

                    <select x-model="search.destinationPort"
                        class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#0194f3] appearance-none">
                        <option value="">Pilih Pelabuhan Tujuan</option>
                        <template x-for="port in routes.destinations" :key="port.destinationPort">
                            <option :value="port.destinationPort" x-text="port.destinationName"></option>
                        </template>
                    </select>
                </div>

                <div class="bg-slate-50 p-5 rounded-3xl border border-slate-100 space-y-4">
                    <div class="flex items-center gap-2 mb-2">
                        <i data-lucide="settings-2" class="w-4 h-4 text-[#0194f3]"></i>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Konfigurasi
                            Layanan</span>
                    </div>

                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1 ml-1">Jenis Tiket</label>
                        <select x-model="search.ticketTypeID"
                            class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#0194f3] appearance-none">
                            <option value="">Pilih Jenis Tiket</option>

                            <template x-for="tkt in ticketTypes" :key="tkt.id">
                                <option :value="tkt.id" x-text="tkt.name"></option>
                            </template>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div :class="search.classID === '1' ? 'col-span-1' : 'col-span-2'">
                            <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1 ml-1">
                                Kategori Kelas
                            </label>
                            <select x-model="search.classID" @change="search.roomClassID = '0'"
                                class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#0194f3] appearance-none transition-all">

                                <option value="0">Semua Kelas</option>

                                <template x-for="cls in classTypes" :key="cls.id">
                                    <option :value="cls.id" x-text="cls.name"></option>
                                </template>
                            </select>
                        </div>

                        <div x-show="search.classID === '1'" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
                            x-cloak>
                            <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1 ml-1">Detail Kamar
                                VIP</label>
                            <select x-model="search.roomClassID"
                                class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#0194f3] appearance-none">
                                <template x-for="rm in roomClasses" :key="rm.id">
                                    <template x-if="rm.id === '0' || rm.name.includes('VIP')">
                                        <option :value="rm.id" x-text="rm.name"></option>
                                    </template>
                                </template>
                            </select>
                        </div>
                    </div>

                    <div x-show="search.ticketTypeID !== '1'" x-transition>
                        <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1 ml-1">Tipe
                            Kendaraan</label>
                        <select x-model="search.vehicleID"
                            class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#0194f3] appearance-none">
                            <template x-for="vhc in vehicleTypes" :key="vhc.id">
                                <option :value="vhc.id" x-text="vhc.name"></option>
                            </template>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1 ml-1">Tanggal
                            Keberangkatan</label>
                        <input type="date" x-model="search.departDate"
                            class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#0194f3]">
                        <p class="text-[8px] text-blue-500 mt-1 ml-1 font-bold italic">*Mencari jadwal untuk 3 hari ke
                            depan</p>
                    </div>
                </div>

                <button @click="getSchedules"
                    :disabled="!search.originPort || !search.destinationPort || !search.departDate"
                    class="w-full bg-[#ff5e1f] text-white py-4 rounded-2xl font-black uppercase text-sm italic shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="search" class="w-4 h-4"></i> Cari Jadwal DLU
                </button>
            </div>
        </template>

        <template x-if="stage === 'results'">
            <div class="space-y-4">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest"
                        x-text="formatDateShort(search.departDate) + ' +3 Hari'"></span>
                </div>

                <template x-for="item in scheduleList" :key="item.shipNumber + item.departDateTime">
                    <div
                        class="border border-slate-100 rounded-3xl shadow-sm space-y-4 hover:border-[#0194f3] transition-colors relative group overflow-hidden">
                        <div class="p-5 bg-slate-50 border-b border-slate-100">
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="p-2 bg-blue-100 text-[#0194f3] rounded-xl">
                                        <i data-lucide="ship" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-black text-slate-800 text-sm uppercase italic"
                                            x-text="item.shipName"></h3>
                                        <p class="text-[9px] font-bold text-slate-400 uppercase"
                                            x-text="'No: ' + item.shipNumber"></p>
                                    </div>
                                </div>
                                <span class="bg-blue-100 text-[#0194f3] text-[9px] font-black px-2 py-1 rounded-md uppercase"
                                    x-text="item.routeInfo"></span>
                            </div>

                            <div class="grid grid-cols-2 gap-4 relative py-2">
                                <div>
                                    <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Berangkat
                                    </p>
                                    <p class="text-sm font-black text-slate-800"
                                        x-text="formatTime(item.departDateTime)"></p>
                                    <p class="text-[9px] font-bold text-slate-500"
                                        x-text="formatDateShort(item.departDateTime)"></p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Tiba</p>
                                    <p class="text-sm font-black text-slate-800"
                                        x-text="formatTime(item.arrivalDateTime)"></p>
                                    <p class="text-[9px] font-bold text-slate-500"
                                        x-text="formatDateShort(item.arrivalDateTime)"></p>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 space-y-3">
                            <template x-for="fare in item.Fares" :key="fare.Data">
                                <div
                                    class="flex items-center justify-between p-3 rounded-2xl border border-slate-100 bg-white">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2">
                                            <span class="text-xs font-black text-slate-700"
                                                x-text="fare.Classes"></span>
                                            <template x-if="fare.Availability > 0">
                                                <span
                                                    class="text-[8px] px-1.5 py-0.5 bg-green-100 text-green-600 rounded-md font-bold"
                                                    x-text="'Sisa: ' + fare.Availability"></span>
                                            </template>
                                        </div>
                                        <p class="text-[10px] text-slate-400 font-bold" x-text="fare.PaxType"></p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm font-black text-[#ff5e1f]"
                                            x-text="formatCurrency(fare.Price)"></p>
                                        <template x-if="fare.Availability > 0">
                                            <button @click="selectFare(item, fare)"
                                                class="mt-1 text-[9px] font-black text-[#0194f3] uppercase tracking-widest hover:underline transition-all active:scale-95">Pilih</button>
                                        </template>
                                        <template x-if="fare.Availability <= 0">
                                            <span
                                                class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Habis</span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <template x-if="stage === 'passenger_form'">
            <div class="space-y-6">
                <div class="bg-blue-600 p-5 rounded-3xl text-white shadow-lg">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] font-bold uppercase tracking-widest opacity-80">Total Pembayaran</span>
                        <i data-lucide="info" class="w-4 h-4"></i>
                    </div>
                    <p class="text-3xl font-black" x-text="formatCurrency(bookingResponse.totalPrice)"></p>
                    <template x-if="bookingResponse.listRoom">
                        <p class="text-[10px] mt-2 italic opacity-90 border-t border-white/20 pt-2"
                            x-text="bookingResponse.listRoom[0].info"></p>
                    </template>
                </div>

                <template x-for="(pax, index) in getPaxList()" :key="index">
                    <div class="bg-slate-50 p-5 rounded-3xl border border-slate-100 space-y-4">
                        <div class="flex items-center gap-2 border-b border-slate-200 pb-2">
                            <i data-lucide="user" class="w-4 h-4 text-[#0194f3]"></i>
                            <span class="text-[10px] font-black text-slate-800 uppercase"
                                x-text="'Penumpang ' + (index + 1)"></span>
                        </div>

                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Nama
                                Lengkap</label>
                            <input type="text" x-model="pax.name" placeholder="Sesuai Identitas"
                                class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#0194f3]">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Jenis
                                    Kelamin</label>
                                <select x-model="pax.gender"
                                    class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none">
                                    <option value="">Pilih</option>
                                    <option value="0">Laki-laki</option>
                                    <option value="1">Perempuan</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Tgl
                                    Lahir</label>
                                <input type="date" x-model="pax.dob"
                                    class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">No. Identitas
                                (NIK)</label>
                            <input type="text" x-model="pax.id" placeholder="16 Digit NIK"
                                class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Kota
                                    (Domisili)</label>
                                <input type="text" x-model="pax.city" placeholder="Contoh: Jakarta"
                                    class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Keterangan
                                    (Opsional)</label>
                                <input type="text" x-model="pax.note" placeholder="Catatan"
                                    class="w-full p-4 bg-white border border-slate-200 rounded-2xl text-sm font-bold outline-none">
                            </div>
                        </div>
                    </div>
                </template>

                <div class="bg-white p-5 rounded-3xl border-2 border-dashed border-slate-200 space-y-4"
                    x-init="initBooker()">
                    <div class="flex items-center gap-2">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-400"></i>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Informasi
                            Kontak</span>
                    </div>
                    <input type="text" x-model="bookingResponse.bookerData.name" placeholder="Nama Pemesan"
                        class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none border border-slate-100">
                    <input type="tel" x-model="bookingResponse.bookerData.phone" placeholder="Nomor WhatsApp"
                        class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none border border-slate-100">
                    <input type="email" x-model="bookingResponse.bookerData.email" placeholder="Alamat Email"
                        class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none border border-slate-100">
                </div>

                <button @click="confirmBookingAndIssued()"
                    class="w-full bg-[#0194f3] text-white py-4 rounded-2xl font-black uppercase text-sm shadow-lg active:scale-95 transition-all">
                    Booking & Issued Tiket
                </button>
            </div>
        </template>

        <template x-if="stage === 'issued_success'">
            <div class="space-y-6">
                <div class="text-center py-6">
                    <div
                        class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                        <i data-lucide="check-circle" class="w-12 h-12"></i>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 uppercase tracking-tight">Pembayaran Berhasil</h3>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest"
                        x-text="'No. Booking: ' + issuedResponse.bookingNumber"></p>
                </div>

                <div class="bg-white border-2 border-slate-100 rounded-3xl overflow-hidden shadow-sm">
                    <div class="p-5 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Kapal</p>
                            <p class="text-sm font-black text-[#0194f3]" x-text="issuedResponse.shipName"></p>
                        </div>
                        <div class="text-right">
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">No Reff</p>
                            <p class="text-sm font-black text-slate-800" x-text="issuedResponse.numCode"></p>
                        </div>
                    </div>

                    <div class="p-5 space-y-4">
                        <template x-for="pax in issuedResponse.paxBookingDetails" :key="pax.ticketNumber">
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <p class="text-xs font-black text-slate-800 uppercase" x-text="pax.paxName"></p>
                                        <p class="text-[9px] font-bold text-slate-400 uppercase"
                                            x-text="pax.paxType + ' | ' + (pax.paxGender === '0' ? 'Laki-laki' : 'Perempuan')">
                                        </p>
                                    </div>
                                    <span class="text-[10px] font-black text-blue-600 uppercase"
                                        x-text="pax.cabin && pax.cabin !== '0' ? 'Kamar: ' + pax.cabin : 'Deck: ' + pax.deck"></span>
                                </div>
                                <div class="flex items-center justify-between pt-2 border-t border-slate-200">
                                    <p class="text-[10px] font-bold text-slate-500"
                                        x-text="'Tiket: ' + pax.ticketNumber"></p>

                                    <button @click="viewEticket(issuedResponse.bookingNumber)"
                                        class="flex items-center gap-1 text-[10px] font-black text-[#ff5e1f] uppercase tracking-widest underline decoration-2 underline-offset-4">
                                        <i data-lucide="download" class="w-3 h-3"></i>
                                        Lihat E-Tiket
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <button @click="stage = 'search'"
                    class="w-full border-2 border-slate-200 text-slate-600 py-4 rounded-2xl font-black uppercase text-sm shadow-sm active:scale-95 transition-all">
                    Kembali ke Beranda
                </button>
            </div>
        </template>
    </div>

    <div x-show="toast.show" x-transition x-cloak
        class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-[10px] font-bold uppercase tracking-widest px-6 py-3 rounded-full shadow-2xl z-[200]">
        <span x-text="toast.message"></span>
    </div>

    <script>
        function shipDluApp() {
            return {
                stage: 'search',
                loading: false,
                loadingText: 'Memuat...',
                routes: { origins: [], destinations: [] },
                classTypes: [],
                vehicleTypes: [],
                ticketTypes: [],
                roomClasses: [],
                scheduleList: [],
                bookingResponse: null,
                issuedResponse: null,
                selectedShip: null,
                selectedFareData: '',
                toast: { show: false, message: '' },
                search: {
                    originPort: '',
                    destinationPort: '',
                    classID: '0',
                    vehicleID: '0',
                    ticketTypeID: '1',
                    roomClassID: '0',
                    departDate: new Date().toISOString().split('T')[0],
                    adultMale: 1,
                    adultFemale: 0,
                    child: 0,
                    infant: 0
                },

                async init() {
                    this.loading = true;
                    this.loadingText = 'Loading...';
                    try {
                        const baseUrl = 'https://darma.siappgo.id/api/shipdlu';
                        const [resRoute, resClass, resVehicle, resTicket, resRoom] = await Promise.all([
                            fetch(`${baseUrl}/route`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                            fetch(`${baseUrl}/class-types`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                            fetch(`${baseUrl}/vehicle-types`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                            fetch(`${baseUrl}/ticket-types`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                            fetch(`${baseUrl}/room-classes`, { method: 'POST', headers: { 'Content-Type': 'application/json' } })
                        ]);

                        const dataRoute = await resRoute.json();
                        if (dataRoute.status === "SUCCESS") {
                            this.routes.origins = dataRoute.origins;
                            this.routes.destinations = dataRoute.destinations;
                        }
                        const dataClass = await resClass.json();
                        if (dataClass.status === "SUCCESS") this.classTypes = dataClass.shipclasses;
                        const dataVehicle = await resVehicle.json();
                        if (dataVehicle.status === "SUCCESS") this.vehicleTypes = dataVehicle.shipVehicleTypes;
                        const dataTicket = await resTicket.json();
                        if (dataTicket.status === "SUCCESS") this.ticketTypes = dataTicket.shipPaxTypes;
                        const dataRoom = await resRoom.json();
                        if (dataRoom.status === "SUCCESS") this.roomClasses = dataRoom.shipRoomClasses;

                    } catch (e) {
                        this.showToast("Gagal memuat API");
                    } finally {
                        this.loading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                async getSchedules() {
                    this.loading = true;
                    this.loadingText = 'Mencari Jadwal...';
                    try {
                        const start = new Date(this.search.departDate);
                        const end = new Date(this.search.departDate);
                        end.setDate(start.getDate() + 3);

                        const payload = {
                            originPort: this.search.originPort,
                            destinationPort: this.search.destinationPort,
                            departStartDate: start.toISOString().split('T')[0] + "T00:00:00Z",
                            departEndDate: end.toISOString().split('T')[0] + "T23:59:59Z",
                            paxClass: this.search.classID,
                            ticketType: this.search.ticketTypeID,
                            vehicleType: (this.search.ticketTypeID === '1') ? '0' : this.search.vehicleID
                        };

                        const res = await fetch('https://darma.siappgo.id/api/shipdlu/schedule', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const data = await res.json();
                        if (data.status === "SUCCESS") {
                            this.scheduleList = data.schedules || [];
                            this.stage = 'results';
                        } else {
                            this.showToast(data.respMessage);
                        }
                    } catch (e) {
                        this.showToast("Server sibuk");
                    } finally {
                        this.loading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                async selectFare(item, fare) {
                    this.loading = true;
                    this.loadingText = 'Mengunci Kursi...';
                    try {
                        const totalPax = parseInt(this.search.adultMale) + parseInt(this.search.adultFemale) + parseInt(this.search.child);
                        this.selectedShip = item;
                        this.selectedFareData = fare.Data;

                        const payload = {
                            shipNumber: item.shipNumber,
                            originPort: item.originCode,
                            destinationPort: item.destCode,
                            departDate: item.departDateTime,
                            fares: [{ count: totalPax, data: fare.Data }]
                        };

                        const res = await fetch('https://darma.siappgo.id/api/shipdlu/select-schedule', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const data = await res.json();
                        if (data.status === "SUCCESS") {
                            const setupPax = (p) => ({
                                ...p,
                                city: p.city || '',
                                note: p.note || '',
                                paxGroup: p.paxGroup || '1'
                            });

                            if (data.listPax) data.listPax = data.listPax.map(setupPax);
                            if (data.listRoom && data.listRoom[0]) data.listRoom[0].paxes = data.listRoom[0].paxes.map(setupPax);
                            if (data.listVehicle && data.listVehicle[0] && data.listVehicle[0].paxes) {
                                data.listVehicle[0].paxes = data.listVehicle[0].paxes.map(setupPax);
                            }

                            this.bookingResponse = data;
                            this.stage = 'passenger_form';
                        } else {
                            this.showToast(data.respMessage);
                        }
                    } catch (e) {
                        this.showToast("Koneksi gagal");
                    } finally {
                        this.loading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                getPaxList() {
                    if (!this.bookingResponse) return [];
                    if (this.bookingResponse.listRoom && this.bookingResponse.listRoom.length > 0) {
                        return this.bookingResponse.listRoom[0].paxes || [];
                    }
                    if (this.bookingResponse.listPax && this.bookingResponse.listPax.length > 0) {
                        return this.bookingResponse.listPax;
                    }
                    if (this.bookingResponse.listVehicle && this.bookingResponse.listVehicle.length > 0) {
                        return this.bookingResponse.listVehicle[0].paxes || [];
                    }
                    return [];
                },

                async confirmBookingAndIssued() {
                    this.loading = true;
                    this.loadingText = 'Validasi Harga...';
                    try {
                        const rawPaxes = this.getPaxList();
                        
                        const cleanedPax = rawPaxes.map(p => ({
                            ...p,
                            name: (p.name || "").toUpperCase(),
                            city: (p.city || "JAKARTA").toUpperCase(),
                            note: p.note || "",
                            paxGroup: String(p.paxGroup || "1"),
                            gender: String(p.gender || "0"),
                            paxType: String(p.paxType || "1"),
                            paxClass: String(p.paxClass || "1"),
                            dob: p.dob ? `${p.dob}T00:00:00` : "1990-01-01T00:00:00"
                        }));

                        const fareStr = String(this.selectedFareData);
                        const isRoom = fareStr.includes('|ROM|');
                        const isVehicle = fareStr.includes('|VHC|');

                        const payloadPrice = {
                            originPort: String(this.search.originPort),
                            destinationPort: String(this.search.destinationPort),
                            shipNumber: String(this.selectedShip.shipNumber),
                            departDate: this.selectedShip.departDateTime,
                            fares: [{ count: cleanedPax.length, data: this.selectedFareData }],
                            
                            listPax: (!isRoom && !isVehicle) ? cleanedPax : null,
                            
                            listRoom: isRoom ? [{
                                info: this.bookingResponse.listRoom[0].info,
                                roomClass: String(this.bookingResponse.listRoom[0].roomClass),
                                price: parseFloat(this.bookingResponse.listRoom[0].price),
                                admin: parseFloat(this.bookingResponse.listRoom[0].admin),
                                paxes: cleanedPax
                            }] : null,

                            listVehicle: isVehicle ? [{
                                ...this.bookingResponse.listVehicle[0],
                                paxes: cleanedPax
                            }] : null
                        };

                        const resPrice = await fetch('https://darma.siappgo.id/api/shipdlu/price', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payloadPrice)
                        });
                        const dataPrice = await resPrice.json();

                        if (dataPrice.status !== "SUCCESS") {
                            this.showToast("Gagal Validasi: " + dataPrice.respMessage);
                            this.loading = false;
                            return;
                        }

                        this.loadingText = 'Memproses Tiket...';
                        const genNumCode = () => "AGNT-" + Date.now() + "-" + Math.random().toString(36).substring(2, 8).toUpperCase();
                        
                        const payloadIssued = {
                            numCode: genNumCode(),
                            originPort: payloadPrice.originPort,
                            destinationPort: payloadPrice.destinationPort,
                            shipNumber: payloadPrice.shipNumber,
                            departDate: payloadPrice.departDate,
                            listPax: payloadPrice.listPax,
                            listVehicle: payloadPrice.listVehicle,
                            listRoom: payloadPrice.listRoom,
                            bookerData: {
                                name: (this.bookingResponse.bookerData?.name || cleanedPax[0].name).toUpperCase(),
                                phone: this.bookingResponse.bookerData?.phone || "08123456789",
                                email: this.bookingResponse.bookerData?.email || "guest@mail.com",
                                gender: "0",
                                id: cleanedPax[0].id,
                                city: cleanedPax[0].city
                            }
                        };

                        const resIssued = await fetch('https://darma.siappgo.id/api/shipdlu/issued', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payloadIssued)
                        });
                        const dataIssued = await resIssued.json();

                        if (dataIssued.status === "SUCCESS") {
                            this.issuedResponse = dataIssued;
                            this.stage = 'issued_success';
                        } else {
                            this.showToast(dataIssued.respMessage);
                        }
                    } catch (e) {
                        this.showToast("Terjadi kesalahan sistem");
                    } finally {
                        this.loading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                async viewEticket(bookingNumber) {
                    this.loading = true;
                    this.loadingText = 'Membuka Tiket...';
                    try {
                        const res = await fetch('https://darma.siappgo.id/api/shipdlu/get-eticket', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ bookingNumber: bookingNumber })
                        });
                        if (!res.ok) throw new Error("Gagal download");
                        const blob = await res.blob();
                        const url = window.URL.createObjectURL(blob);
                        window.open(url, '_blank');
                    } catch (e) {
                        this.showToast("Gagal membuka E-Tiket.");
                    } finally {
                        this.loading = false;
                    }
                },

                initBooker() {
                    if (this.bookingResponse && !this.bookingResponse.bookerData) {
                        this.bookingResponse.bookerData = { name: '', phone: '', email: '' };
                    }
                },

                goBack() {
                    if (this.stage === 'issued_success') this.stage = 'search';
                    else if (this.stage === 'passenger_form') this.stage = 'results';
                    else if (this.stage === 'results') this.stage = 'search';
                    this.$nextTick(() => lucide.createIcons());
                },

                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.show = true;
                    setTimeout(() => { this.toast.show = false; }, 3000);
                },

                formatDateShort(iso) {
                    if (!iso) return '';
                    return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                },
                formatTime(iso) {
                    if (!iso) return '';
                    return new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace('.', ':');
                },
                formatCurrency(num) {
                    if (!num) return 'Rp 0';
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
                }
            }
        }
    </script>
</body>
