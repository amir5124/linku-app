<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Jadwal DLU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="bg-slate-50 font-sans antialiased" x-data="shipDluApp()">

    <div
        class="fixed top-0 inset-x-0 bg-white text-slate-800 p-4 z-50 shadow-sm flex items-center gap-4 max-w-md mx-auto">
        <button @click="goBack()" class="p-1 hover:bg-slate-100 rounded-full transition-colors">
            <i data-lucide="arrow-left" class="w-6 h-6"></i>
        </button>
        <h2 class="font-semibold text-lg" x-text="stage === 'search' ? 'Dharma Lautan Utama' : 'Pilih Jadwal'"></h2>
        <div class="ml-auto">
            <i data-lucide="more-vertical" class="w-6 h-6"></i>
        </div>
    </div>

    <div x-show="loading"
        class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex items-center justify-center max-w-md mx-auto"
        x-cloak>
        <div class="text-center">
            <div
                class="w-12 h-12 border-4 border-[#24b3ae] border-t-transparent rounded-full animate-spin mx-auto mb-4">
            </div>
            <p class="text-xs font-bold text-slate-600 uppercase tracking-widest" x-text="loadingText"></p>
        </div>
    </div>

    <main class="max-w-md mx-auto min-h-screen bg-white pt-20 px-4 pb-10 shadow-xl">

        <template x-if="stage === 'search'">
            <div class="space-y-2">
                <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 shadow-sm">

                    <div @click="showOriginModal = true; searchCityQuery = ''"
                        class="p-4 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition">
                        <i data-lucide="map-pin" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Dari</label>
                            <div class="font-medium text-slate-700" x-text="selectedOriginName"></div>
                        </div>
                    </div>

                    <div @click="showDestModal = true; searchCityQuery = ''"
                        class="p-4 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition border-t">
                        <i data-lucide="map-pin" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Ke</label>
                            <div class="font-medium text-slate-700" x-text="selectedDestName"></div>
                        </div>
                    </div>

                    <div class="p-4 flex items-center gap-4">
                        <i data-lucide="calendar" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Tanggal Berangkat</label>
                            <input type="date" x-model="search.departDate" :min="new Date().toISOString().split('T')[0]"
                                class="w-full bg-transparent font-medium text-slate-700 outline-none">
                        </div>
                    </div>

                    <div class="p-4 flex items-center gap-4 border-b border-slate-50">
                        <i data-lucide="layers" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Jenis Tiket</label>
                            <select x-model="search.ticketTypeID"
                                class="w-full bg-transparent font-medium text-slate-700 outline-none appearance-none">
                                <template x-for="tkt in ticketTypes" :key="tkt.id">
                                    <option :value="tkt.id" x-text="tkt.name"></option>
                                </template>
                            </select>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                    </div>



                    <div class="p-4 flex items-center gap-4">
                        <i data-lucide="layers" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Kelas</label>
                            <select x-model="search.classID"
                                class="w-full bg-transparent font-medium text-slate-700 outline-none appearance-none">
                                <option value="0">Semua Kelas</option>
                                <template x-for="cls in classTypes" :key="cls.id">
                                    <option :value="cls.id" x-text="cls.name"></option>
                                </template>
                            </select>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                    </div>

                    <template x-if="search.ticketTypeID !== '1'">
                        <div class="p-4 flex items-center gap-4 border-t border-slate-100">
                            <i data-lucide="truck" class="w-6 h-6 text-slate-400"></i>
                            <div class="flex-1">
                                <label class="block text-xs text-slate-400">Jenis Kendaraan</label>
                                <select x-model="search.vehicleID"
                                    class="w-full bg-transparent font-medium text-slate-700 outline-none appearance-none">
                                    <option value="0">Semua Kelas</option>
                                    <template x-for="vhc in vehicleTypes" :key="vhc.id">
                                        <option :value="vhc.id" x-text="vhc.name"></option>
                                    </template>
                                </select>
                            </div>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                        </div>
                    </template>

                    <div class="p-4 flex items-center gap-4 border-t border-slate-100">
                        <i data-lucide="door-closed" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Jenis Kamar</label>
                            <select x-model="search.roomClassID"
                                class="w-full bg-transparent font-medium text-slate-700 outline-none appearance-none">
                                <option value="0">Semua Jenis Kamar</option>
                                <template x-for="rm in roomClasses" :key="rm.id">
                                    <option :value="rm.id" x-text="rm.name"></option>
                                </template>
                            </select>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                    </div>
                </div>

                <div class="pt-4">
                    <button @click="getSchedules"
                        class="w-full bg-[#24b3ae] text-white py-4 rounded-xl font-bold text-base shadow-lg active:scale-[0.98] transition-all">
                        Cari Kapal Laut
                    </button>
                </div>


            </div>
        </template>

        <template x-if="stage === 'results'">
            <div class="space-y-0 -mx-4">
                <div
                    class="px-4 py-3 bg-white border-b border-slate-100 flex justify-between items-center sticky top-0 z-50">
                    <div class="flex flex-col">
                        <div class="flex items-center gap-1">
                            <span class="text-[13px] font-bold text-slate-800" x-text="originName"></span>
                            <i data-lucide="arrow-right" class="w-3 h-3 text-slate-400"></i>
                            <span class="text-[13px] font-bold text-slate-800" x-text="destinationName"></span>
                        </div>
                        <span class="text-[11px] text-slate-500" x-text="formatDateFull(search.departDate)"></span>
                    </div>
                    <button @click="stage = 'search'"
                        class="text-[#24b3ae] text-xs font-bold px-3 py-1 bg-cyan-50 rounded-lg active:scale-95 transition">
                        Ubah
                    </button>
                </div>

                <div class="flex bg-white border-b border-slate-200 sticky top-[52px] z-40 shadow-sm">
                    <template x-for="date in availableDates" :key="date">
                        <button @click="search.departDate = date"
                            :class="search.departDate === date ? 'border-[#24b3ae] text-[#24b3ae] bg-cyan-50/30' : 'border-transparent text-slate-400 hover:text-slate-600'"
                            class="flex-1 py-3 text-center border-b-2 transition-all duration-200 flex flex-col items-center">
                            <span class="text-[10px] font-bold uppercase" x-text="formatDateShort(date)"></span>
                        </button>
                    </template>
                </div>

                <div class="p-4 space-y-6 pb-32">
                    <template x-for="item in scheduleList.filter(s => s.departDateTime.startsWith(search.departDate))"
                        :key="item.shipNumber + item.departDateTime">
                        <div class="space-y-4 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                            <div class="p-4 relative">
                                <div class="absolute top-0 left-0 w-1 h-full bg-[#24b3ae]"></div>

                                <div class="flex justify-between items-start mb-4">
                                    <div class="flex items-center gap-2">
                                        <div class="p-2 bg-cyan-50 rounded-lg">
                                            <i data-lucide="ship" class="w-4 h-4 text-[#24b3ae]"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-sm" x-text="item.shipName"></h3>
                                            <p class="text-[10px] text-slate-400" x-text="item.shipNumber"></p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span
                                            class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold"
                                            x-text="item.routeInfo.split('-').length > 2 ? 'Transit' : 'Langsung'"></span>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-4 mb-4">
                                    <div>
                                        <p class="text-[10px] text-slate-400 font-medium">Keberangkatan</p>
                                        <p class="text-xs font-bold text-slate-700" x-text="originName"></p>
                                        <p class="text-[11px] text-[#24b3ae] font-bold mt-1"
                                            x-text="item.departDateTime.split('T')[1].substring(0,5)"></p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[10px] text-slate-400 font-medium">Tiba (Estimasi)</p>
                                        <p class="text-xs font-bold text-slate-700" x-text="destinationName"></p>
                                        <p class="text-[11px] text-slate-500 font-bold mt-1"
                                            x-text="item.arrivalDateTime.split('T')[1].substring(0,5)"></p>
                                    </div>
                                </div>

                                <div class="pt-3 border-t border-dashed border-slate-200">
                                    <p class="text-[10px] text-slate-400 font-medium mb-1">Rute Perjalanan</p>
                                    <p class="text-[11px] font-medium text-slate-600 italic"
                                        x-text="item.routeInfo.trim()"></p>
                                </div>
                            </div>

                            <div class="bg-slate-50/50 divide-y divide-slate-100">
                                <template x-for="(fare, index) in item.Fares" :key="fare.Classes + fare.PaxType">
                                    <div class="p-4 flex justify-between items-center">
                                        <div class="flex-1 pr-4">
                                            <div class="flex items-center gap-2">
                                                <span
                                                    class="text-[10px] font-black text-slate-400 uppercase tracking-wider"
                                                    x-text="fare.Classes"></span>
                                                <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                                                <span class="text-xs text-slate-600 font-medium"
                                                    x-text="fare.PaxType"></span>
                                            </div>
                                            <p class="text-sm font-black text-[#24b3ae] mt-0.5"
                                                x-text="formatCurrency(fare.Price)"></p>
                                        </div>

                                        <div
                                            class="flex items-center gap-3 bg-white rounded-full px-2 py-1 shadow-sm border border-slate-100">
                                            <button @click="updateQty(item.shipNumber, index, -1)"
                                                class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-50 text-slate-600 active:bg-slate-200 transition">
                                                <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                                            </button>
                                            <span class="text-xs font-bold min-w-[20px] text-center"
                                                x-text="fare.count || 0"></span>
                                            <button @click="updateQty(item.shipNumber, index, 1)"
                                                class="w-7 h-7 flex items-center justify-center rounded-full bg-[#24b3ae] text-white active:scale-90 transition shadow-md shadow-cyan-100">
                                                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <div x-show="scheduleList.filter(s => s.departDateTime.startsWith(search.departDate)).length === 0"
                        class="py-20 text-center flex flex-col items-center">
                        <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                            <i data-lucide="calendar-x" class="w-10 h-10 text-slate-300"></i>
                        </div>
                        <p class="text-slate-800 font-bold">Tidak ada jadwal</p>
                        <p class="text-slate-400 text-xs mt-1">Silakan pilih tanggal lain di atas</p>
                    </div>
                </div>

                <div x-show="getTotalSelected() > 0" x-transition:enter="transition ease-out duration-300"
                    x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0"
                    class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-white p-4 border-t border-slate-100 shadow-[0_-10px_25px_rgba(0,0,0,0.1)] z-[60] flex items-center justify-between rounded-t-2xl">
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Total Bayar</p>
                        <p class="text-lg font-black text-[#24b3ae]" x-text="formatCurrency(getTotalPrice())"></p>
                        <p class="text-[9px] text-slate-400" x-text="`${getTotalSelected()} Tiket Terpilih`"></p>
                    </div>
                    <button @click="goToPassengerForm()"
                        class="bg-[#24b3ae] text-white px-10 py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-cyan-100 active:scale-95 transition-all">
                        Lanjutkan
                    </button>
                </div>
            </div>
        </template>

        <template x-if="stage === 'passenger_form'">
            <div class="space-y-6 pb-20 animate-in fade-in slide-in-from-bottom-4 duration-500">

                <div
                    class="bg-gradient-to-br from-[#24b3ae] to-[#1d9692] p-6 rounded-3xl text-white shadow-xl shadow-cyan-100">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold uppercase tracking-[0.2em] opacity-80">Total
                            Pembayaran</span>
                        <i data-lucide="credit-card" class="w-5 h-5 opacity-80"></i>
                    </div>
                    <p class="text-3xl font-black" x-text="formatCurrency(bookingResponse.totalPrice)"></p>
                </div>

                <div class="space-y-4" x-show="passengerDetails.length > 0">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2 px-1">
                        <i data-lucide="users" class="w-5 h-5 text-[#24b3ae]"></i>
                        Data Penumpang
                        <template x-if="bookingResponse.listVehicle?.length > 0">
                            <span class="text-[#24b3ae]">(Sekaligus Driver)</span>
                        </template>
                    </h3>

                    <template x-for="(pax, index) in passengerDetails" :key="index">
                        <div
                            class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm hover:border-[#24b3ae] transition-all">
                            <div
                                class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                                <span class="text-[10px] font-black text-slate-500 uppercase"
                                    x-text="(pax.paxInfo || 'Penumpang') + ' ' + (index + 1)"></span>
                                <template x-if="index === 0 && bookingResponse.listVehicle?.length > 0">
                                    <span
                                        class="bg-blue-100 text-blue-600 text-[9px] px-2 py-0.5 rounded-full font-bold uppercase">Driver
                                        / Pengendara</span>
                                </template>
                            </div>

                            <div class="p-5 space-y-5">
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">Nama
                                        Lengkap (Sesuai KTP)</label>
                                    <input type="text" x-model="pax.name"
                                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#24b3ae] focus:bg-white transition-all"
                                        placeholder="CONTOH: AMIR MUNADIR">
                                </div>

                                <div>
                                    <label
                                        class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">Jenis
                                        Kelamin</label>
                                    <select x-model="pax.gender"
                                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#24b3ae] appearance-none">
                                        <option value="L">Laki-laki (L)</option>
                                        <option value="P">Perempuan (P)</option>
                                    </select>
                                </div>

                                <div>
                                    <label
                                        class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">Tanggal
                                        Lahir</label>
                                    <input type="date" x-model="pax.dob"
                                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#24b3ae]">
                                </div>

                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">NIK
                                        (Nomor Induk Kependudukan)</label>
                                    <input type="number" x-model="pax.id"
                                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#24b3ae]"
                                        placeholder="Masukkan 16 digit NIK">
                                </div>

                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">Kota
                                        Asal / Alamat</label>
                                    <input type="text" x-model="pax.city"
                                        class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-[#24b3ae]"
                                        placeholder="CONTOH: BALIKPAPAN">
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <template x-if="bookingResponse.listVehicle && bookingResponse.listVehicle.length > 0">
                    <div class="space-y-4">
                        <h3 class="font-bold text-slate-800 flex items-center gap-2 px-1">
                            <i data-lucide="truck" class="w-5 h-5 text-orange-500"></i>
                            Data Kendaraan
                        </h3>

                        <template x-for="(vhc, vIdx) in bookingResponse.listVehicle" :key="'v-'+vIdx">
                            <div class="bg-orange-50 border border-orange-200 rounded-3xl p-5 space-y-5">
                                <div class="flex items-center gap-2 border-b border-orange-200 pb-3">
                                    <span class="text-xs font-black text-orange-700 uppercase"
                                        x-text="vhc.vehicleInfo"></span>
                                </div>

                                <div>
                                    <label
                                        class="text-[10px] font-bold text-orange-400 uppercase mb-1.5 block px-1">Nomor
                                        Polisi (Plat)</label>
                                    <input type="text" x-model="vhc.regNo"
                                        class="w-full p-4 bg-white border border-orange-200 rounded-2xl text-sm font-bold outline-none focus:border-orange-500"
                                        placeholder="KH 1234 ABC">
                                </div>

                                <div>
                                    <label
                                        class="text-[10px] font-bold text-orange-400 uppercase mb-1.5 block px-1">Nama
                                        Pemilik (Sesuai STNK)</label>
                                    <input type="text" x-model="vhc.ownerName"
                                        class="w-full p-4 bg-white border border-orange-200 rounded-2xl text-sm font-bold outline-none focus:border-orange-500"
                                        placeholder="NAMA SESUAI STNK">
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <div class="flex flex-col gap-3 pt-4">
                    <button @click="confirmBookingAndIssued()"
                        class="w-full bg-[#24b3ae] text-white py-5 rounded-2xl font-black uppercase text-sm shadow-lg shadow-cyan-100 transform active:scale-95 transition-all">
                        Lanjutkan ke Pembayaran
                    </button>
                    <button @click="stage = 'results'; window.scrollTo(0,0)"
                        class="w-full text-slate-400 py-2 text-xs font-bold uppercase tracking-widest">
                        Batal dan Kembali
                    </button>
                </div>
            </div>
        </template>

        <template x-if="stage === 'issued_success'">
            <div class="space-y-6">
                <div class="text-center py-6">
                    <div
                        class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                        <i data-lucide="check-circle" class="w-12 h-12"></i>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 uppercase tracking-tight">Pembayaran Berhasil</h3>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest"
                        x-text="'Kode Booking: ' + issuedResponse.bookingNumber"></p>
                </div>

                <div class="bg-white border-2 border-slate-100 rounded-3xl overflow-hidden shadow-sm">
                    <div class="p-5 bg-slate-50 border-b border-slate-100">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Nama Kapal</p>
                                <p class="text-sm font-black text-[#0194f3]" x-text="issuedResponse.shipName"></p>
                            </div>
                            <div class="text-right">
                                <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">No Reff</p>
                                <p class="text-sm font-black text-slate-800" x-text="issuedResponse.numCode"></p>
                            </div>
                        </div>

                        <div class="flex items-center gap-3 pt-3 border-t border-slate-200/50">
                            <div class="flex-1">
                                <p class="text-[8px] font-black text-slate-400 uppercase">Asal</p>
                                <p class="text-[10px] font-bold text-slate-700" x-text="issuedResponse.originName"></p>
                            </div>
                            <i data-lucide="arrow-right" class="w-4 h-4 text-slate-300"></i>
                            <div class="flex-1 text-right">
                                <p class="text-[8px] font-black text-slate-400 uppercase">Tujuan</p>
                                <p class="text-[10px] font-bold text-slate-700" x-text="issuedResponse.destinationName">
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="p-5 space-y-4">
                        <template x-for="pax in issuedResponse.paxBookingDetails" :key="pax.ticketNumber">
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 relative overflow-hidden">
                                <i data-lucide="ticket"
                                    class="absolute -right-2 -bottom-2 w-16 h-16 text-slate-200/50 -rotate-12"></i>

                                <div class="relative z-10">
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <p class="text-xs font-black text-slate-800 uppercase" x-text="pax.paxName">
                                            </p>
                                            <p class="text-[9px] font-bold text-slate-400 uppercase"
                                                x-text="pax.paxType + ' | ' + (pax.paxGender === 'L' ? 'Laki-laki' : 'Perempuan')">
                                            </p>
                                        </div>
                                        <div class="text-right">
                                            <span class="block text-[9px] font-black text-blue-600 uppercase"
                                                x-text="pax.cabin && pax.cabin !== '0' ? 'Kamar: ' + pax.cabin : 'Deck: ' + pax.deck"></span>
                                            <span class="block text-[8px] font-bold text-slate-400 uppercase"
                                                x-text="'Bed: ' + pax.bed"></span>
                                        </div>
                                    </div>

                                    <div
                                        class="flex items-center justify-between pt-2 border-t border-dashed border-slate-200">
                                        <div>
                                            <p class="text-[8px] font-black text-slate-400 uppercase">No. Tiket</p>
                                            <p class="text-[10px] font-bold text-slate-600" x-text="pax.ticketNumber">
                                            </p>
                                        </div>

                                        <button
                                            @click="window.open('https://dlu.co.id/cetak-tiket/' + issuedResponse.bookingNumber)"
                                            class="flex items-center gap-1 text-[10px] font-black text-[#ff5e1f] uppercase tracking-widest underline decoration-2 underline-offset-4">
                                            <i data-lucide="qr-code" class="w-3 h-3"></i>
                                            E-Tiket
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="p-5 bg-slate-800">
                        <div class="flex justify-between items-center">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Pembayaran
                            </p>
                            <p class="text-lg font-black text-white"
                                x-text="'Rp ' + new Intl.NumberFormat('id-ID').format(issuedResponse.ticketPrice)"></p>
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button @click="stage = 'search'; window.scrollTo(0,0)"
                        class="w-full bg-[#24b3ae] text-white py-5 rounded-2xl font-black uppercase text-sm shadow-lg shadow-blue-100 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        Selesai & Kembali ke Beranda
                    </button>
                </div>
            </div>
        </template>
        </div>

        <div x-show="toast.show" x-transition x-cloak
            class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-[10px] font-bold uppercase tracking-widest px-6 py-3 rounded-full shadow-2xl z-[200]">
            <span x-text="toast.message"></span>
        </div>

        <template x-if="showOriginModal || showDestModal">
            <div class="fixed inset-0 z-[100] flex flex-col bg-white overflow-hidden">
                <div class="flex items-center p-4 border-b">
                    <button @click="showOriginModal = false; showDestModal = false" class="p-2">
                        <i data-lucide="arrow-left" class="w-6 h-6 text-slate-600"></i>
                    </button>
                    <h3 class="flex-1 font-bold text-lg text-center" x-text="showOriginModal ? 'Asal' : 'Tujuan'"></h3>
                    <div class="w-10"></div>
                </div>

                <div class="p-4 bg-slate-50">
                    <div class="relative flex items-center">
                        <i data-lucide="search" class="absolute left-3 w-5 h-5 text-slate-400"></i>
                        <input type="text" x-model="searchCityQuery" placeholder="Cari nama kota / pelabuhan..."
                            class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto">
                    <template x-if="showOriginModal">
                        <div class="divide-y divide-slate-100">
                            <template x-for="port in filteredOrigins" :key="port.originPort">
                                <div @click="search.originPort = port.originPort; showOriginModal = false"
                                    class="p-4 hover:bg-slate-50 active:bg-slate-100 cursor-pointer flex items-center gap-3">
                                    <i data-lucide="anchor" class="w-4 h-4 text-slate-400"></i>
                                    <span class="text-slate-700 font-medium" x-text="port.originName"></span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template x-if="showDestModal">
                        <div class="divide-y divide-slate-100">
                            <template x-for="port in filteredDestinations" :key="port.destinationPort">
                                <div @click="search.destinationPort = port.destinationPort; showDestModal = false"
                                    class="p-4 hover:bg-slate-50 active:bg-slate-100 cursor-pointer flex items-center gap-3">
                                    <i data-lucide="anchor" class="w-4 h-4 text-slate-400"></i>
                                    <span class="text-slate-700 font-medium" x-text="port.destinationName"></span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <div x-show="showOriginModal ? filteredOrigins.length === 0 : filteredDestinations.length === 0"
                        class="p-10 text-center text-slate-400">
                        <p>Kota tidak ditemukan</p>
                    </div>
                </div>
            </div>
        </template>

        <script>
            function shipDluApp() {
                return {
                    stage: 'search',
                    passengerDetails: [],
                    loading: false,
                    loadingText: 'Memuat...',
                    routes: { origins: [], destinations: [] },
                    classTypes: [],
                    vehicleTypes: [],
                    ticketTypes: [],
                    roomClasses: [],
                    scheduleList: [],
                    bookingResponse: null,
                    issuedResponse: null,
                    selectedShip: null,
                    selectedFareData: '',
                    toast: { show: false, message: '' },
                    search: {
                        originPort: '',
                        destinationPort: '',
                        classID: '0',
                        vehicleID: '0',
                        ticketTypeID: '0',
                        roomClassID: '0',
                        departDate: (() => {
                            const d = new Date();
                            d.setDate(d.getDate() + 2); // Tambah 1 hari
                            return d.toISOString().split('T')[0];
                        })(),
                        adultMale: 1,
                        adultFemale: 0,
                        child: 0,
                        infant: 0
                    },
                    bookingResponse: {
                        bookerData: {
                            name: '',
                            phone: '',
                            email: '',
                            city: ''
                        }
                    },
                    showOriginModal: false,
                    showDestModal: false,
                    searchCityQuery: '',
                    availableDates: [],
                    scheduleList: [],

                    generateDateTabs(startDate) {
                        const dates = [];
                        for (let i = 0; i < 3; i++) {
                            const d = new Date(startDate);
                            d.setDate(d.getDate() + i);
                            dates.push(d.toISOString().split('T')[0]);
                        }
                        this.availableDates = dates;
                    },
                    // Letakkan di dalam return { ... } Alpine kamu
                    formatDateFull(dateStr) {
                        if (!dateStr) return '';
                        const d = new Date(dateStr);
                        return d.toLocaleDateString('id-ID', {
                            weekday: 'long',
                            day: 'numeric',
                            month: 'long',
                            year: 'numeric'
                        });
                    },

                    formatDateShort(dateStr) {
                        if (!dateStr) return '';
                        const d = new Date(dateStr);
                        const day = d.toLocaleDateString('id-ID', { day: 'numeric' });
                        const month = d.toLocaleDateString('id-ID', { month: 'short' });
                        return `${day} ${month}`;
                    },

                    formatDateRange(start, end) {
                        if (!start) return '-';
                        const s = start.split('T')[1].substring(0, 5);
                        const e = end ? end.split('T')[1].substring(0, 5) : '';
                        return e ? `${s} - ${e}` : s;
                    },

                    // Getter untuk memfilter jadwal yang tampil sesuai tab yang diklik
                    get filteredSchedules() {
                        return this.scheduleList.filter(item => {
                            // Asumsi item.departDateTime formatnya "2026-04-09T10:00:00"
                            return item.departDateTime.startsWith(this.search.departDate);
                        });
                    },

                    get filteredOrigins() {
                        return this.routes.origins.filter(p =>
                            p.originName.toLowerCase().includes(this.searchCityQuery.toLowerCase())
                        );
                    },
                    get filteredDestinations() {
                        return this.routes.destinations.filter(p =>
                            p.destinationName.toLowerCase().includes(this.searchCityQuery.toLowerCase())
                        );
                    },

                    // Helper untuk mendapatkan nama kota yang terpilih saat ini
                    get selectedOriginName() {
                        const found = this.routes.origins.find(p => p.originPort == this.search.originPort);
                        return found ? found.originName : 'Pilih Kota Asal';
                    },
                    get selectedDestName() {
                        const found = this.routes.destinations.find(p => p.destinationPort == this.search.destinationPort);
                        return found ? found.destinationName : 'Pilih Kota Tujuan';
                    },

                    async init() {
                        this.loading = true;
                        this.loadingText = 'Loading...';
                        try {
                            const baseUrl = 'https://darma.siappgo.id/api/shipdlu';
                            const [resRoute, resClass, resVehicle, resTicket, resRoom] = await Promise.all([
                                fetch(`${baseUrl}/route`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                                fetch(`${baseUrl}/class-types`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                                fetch(`${baseUrl}/vehicle-types`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                                fetch(`${baseUrl}/ticket-types`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                                fetch(`${baseUrl}/room-classes`, { method: 'POST', headers: { 'Content-Type': 'application/json' } })
                            ]);

                            const dataRoute = await resRoute.json();
                            if (dataRoute.status === "SUCCESS") {
                                this.routes.origins = dataRoute.origins;
                                this.routes.destinations = dataRoute.destinations;
                            }
                            const dataClass = await resClass.json();
                            if (dataClass.status === "SUCCESS") this.classTypes = dataClass.shipclasses;
                            const dataVehicle = await resVehicle.json();
                            if (dataVehicle.status === "SUCCESS") this.vehicleTypes = dataVehicle.shipVehicleTypes;
                            const dataTicket = await resTicket.json();
                            if (dataTicket.status === "SUCCESS") this.ticketTypes = dataTicket.shipPaxTypes;
                            const dataRoom = await resRoom.json();
                            if (dataRoom.status === "SUCCESS") this.roomClasses = dataRoom.shipRoomClasses;

                        } catch (e) {
                            this.showToast("Gagal memuat API");
                        } finally {
                            this.loading = false;
                            this.$nextTick(() => lucide.createIcons());
                        }
                        this.$watch('search.departDate', (value) => {
                            this.$nextTick(() => {
                                if (typeof lucide !== 'undefined') {
                                    lucide.createIcons();
                                }
                            });
                        });
                    },

                    updateQty(shipNumber, fareIndex, delta) {
                        const ship = this.scheduleList.find(s => s.shipNumber === shipNumber);
                        if (ship && ship.Fares[fareIndex]) {
                            let currentCount = ship.Fares[fareIndex].count || 0;
                            let newCount = currentCount + delta;

                            // Batasi agar tidak kurang dari 0
                            if (newCount >= 0) {
                                ship.Fares[fareIndex].count = newCount;
                            }
                        }
                    },

                    getTotalSelected() {
                        let total = 0;
                        this.scheduleList.forEach(ship => {
                            ship.Fares.forEach(fare => {
                                total += (fare.count || 0);
                            });
                        });
                        return total;
                    },

                    getTotalPrice() {
                        let total = 0;
                        this.scheduleList.forEach(ship => {
                            ship.Fares.forEach(fare => {
                                total += (fare.count || 0) * fare.Price;
                            });
                        });
                        return total;
                    },

                    async goToPassengerForm() {
                        console.group("🛳️ DEBUG: Proses Go To Passenger Form");

                        // 1. Validasi: Cari jadwal yang memiliki tiket terpilih
                        const selectedItem = this.scheduleList.find(item =>
                            item.Fares && item.Fares.some(f => f.count > 0)
                        );

                        if (!selectedItem) {
                            console.warn("Validation Fail: No tickets selected");
                            this.showToast("Silakan pilih minimal satu tiket.");
                            console.groupEnd();
                            return;
                        }

                        this.selectedShip = selectedItem;

                        // 2. Persiapan Payload Fares yang Teliti
                        // Kita pastikan mengambil .Data atau .data karena sering terjadi perbedaan case di API
                        const selectedFares = selectedItem.Fares
                            .filter(f => f.count > 0)
                            .map(f => {
                                const fareString = f.Data || f.data || "";
                                if (!fareString) console.error("CRITICAL: Fare Data is EMPTY for", f);
                                return {
                                    count: f.count,
                                    data: fareString
                                };
                            });

                        // 3. Hitung jumlah ORANG saja (untuk validasi form nanti)
                        // Filter hanya yang mengandung kata 'PAX' di dalam string datanya
                        const totalPaxOnly = selectedFares
                            .filter(f => f.data.includes('|PAX|'))
                            .reduce((sum, f) => sum + f.count, 0);

                        console.log("Selected Ship:", selectedItem.shipNumber);
                        console.log("Total Pax Detected:", totalPaxOnly);
                        console.log("Fares Payload:", selectedFares);

                        this.loading = true;
                        this.loadingText = 'Mengunci Kursi...';

                        try {
                            const payload = {
                                shipNumber: String(selectedItem.shipNumber),
                                originPort: String(selectedItem.originCode || this.search.originPort),
                                destinationPort: String(selectedItem.destCode || this.search.destinationPort),
                                departDate: selectedItem.departDateTime,
                                fares: selectedFares
                            };

                            console.log("Sending Request to /select-schedule...", payload);

                            const res = await fetch('https://darma.siappgo.id/api/shipdlu/select-schedule', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            const data = await res.json();
                            console.log("Response /select-schedule:", data);

                            if (data.status === "SUCCESS") {
                                // PENTING: Simpan fares yang kita kirim tadi ke dalam bookingResponse 
                                // agar saat hit API /price, data 'data' (pipe string) tidak hilang
                                this.bookingResponse = {
                                    ...data,
                                    fares: selectedFares
                                };

                                // 4. Inisialisasi Tanggal
                                const today = new Date();
                                const maxDateDefault = today.toISOString().split('T')[0];
                                const minDateBayi = new Date();
                                minDateBayi.setFullYear(today.getFullYear() - 2);
                                const minDateBayiStr = minDateBayi.toISOString().split('T')[0];

                                // 5. Ambil list Pax secara Robust
                                let rawPaxes = this.getPaxList(data);
                                console.log("Raw Paxes from API:", rawPaxes.length);

                                // 6. Sinkronisasi FORM Penumpang
                                // Jika API kasih pax lebih sedikit dari yang kita beli, tambahkan dummy
                                if (rawPaxes.length < totalPaxOnly) {
                                    const diff = totalPaxOnly - rawPaxes.length;
                                    console.log(`Syncing: Adding ${diff} extra passenger objects`);
                                    for (let i = 0; i < diff; i++) {
                                        rawPaxes.push({
                                            name: '', id: '', gender: "0", paxGroup: "1",
                                            city: 'BALIKPAPAN', dob: '1990-01-01', paxType: "1",
                                            paxInfo: 'Penumpang'
                                        });
                                    }
                                }

                                // 7. Transformasi Data untuk UI Form
                                this.passengerDetails = rawPaxes.slice(0, totalPaxOnly).map((p, index) => {
                                    const isBayi = p.paxType === "2" || (p.paxInfo && p.paxInfo.toLowerCase().includes('bayi'));

                                    return {
                                        ...p,
                                        name: p.name || '',
                                        id: p.id || '',
                                        gender: String(p.gender || "0"),
                                        city: p.city || 'BALIKPAPAN',
                                        isBayi: isBayi,
                                        dob: (p.dob && !p.dob.startsWith('0001')) ? p.dob.split('T')[0] : (isBayi ? maxDateDefault : '1990-01-01'),
                                        minDob: isBayi ? minDateBayiStr : '1900-01-01',
                                        maxDob: maxDateDefault
                                    };
                                });

                                // 8. Inisialisasi Booker (Pemesan) jika null
                                if (!this.bookingResponse.bookerData) {
                                    this.bookingResponse.bookerData = {
                                        name: '', phone: '', email: '', city: 'BALIKPAPAN'
                                    };
                                }

                                console.log("Final Passenger Details for Form:", this.passengerDetails);
                                this.stage = 'passenger_form';
                                window.scrollTo(0, 0);

                            } else {
                                console.error("API Error Response:", data.respMessage);
                                this.showToast(data.respMessage || "Gagal mengunci jadwal");
                            }
                        } catch (e) {
                            console.error("CRITICAL EXCEPTION:", e);
                            this.showToast("Gangguan koneksi ke server");
                        } finally {
                            this.loading = false;
                            console.groupEnd();
                            this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
                        }
                    },

                    getPaxList(data) {
                        // Helper untuk mencari list penumpang di berbagai struktur response API DLU
                        const source = data || this.bookingResponse;
                        if (!source) return [];

                        if (source.listRoom?.length > 0 && source.listRoom[0].paxes?.length > 0) {
                            return source.listRoom[0].paxes;
                        }
                        if (source.listVehicle?.length > 0 && source.listVehicle[0].paxes?.length > 0) {
                            // Beberapa tiket kendaraan menyertakan pax driver di dalamnya
                            return source.listVehicle[0].paxes;
                        }
                        if (source.listPax?.length > 0) {
                            return source.listPax;
                        }
                        return [];
                    },

                    async getSchedules() {
                        console.group("🚀 Debugging Get Schedules");

                        // 1. Validasi awal
                        if (!this.search.originPort || !this.search.destinationPort || !this.search.departDate) {
                            console.warn("⚠️ Validasi Gagal: Data pencarian belum lengkap.");
                            this.showToast("Lengkapi rute dan tanggal keberangkatan");
                            console.groupEnd();
                            return;
                        }

                        this.loading = true;
                        this.loadingText = 'Mencari Jadwal...';
                        this.scheduleList = [];
                        this.availableDates = [];

                        try {
                            const start = new Date(this.search.departDate);
                            const end = new Date(this.search.departDate);
                            end.setDate(start.getDate() + 2);

                            // LOGIKA FIX: Hanya kirim vehicle '0' jika ticketType ADALAH '1' (Penumpang Saja)
                            // Jika ticketType adalah '0' (Penumpang & Kendaraan) atau '2' (Kendaraan), gunakan vehicleID pilihan user
                            let finalVehicleID = this.search.vehicleID || '0';
                            if (this.search.ticketTypeID === '1') {
                                finalVehicleID = '0';
                            }

                            const payload = {
                                originPort: String(this.search.originPort),
                                destinationPort: String(this.search.destinationPort),
                                departStartDate: start.toISOString().split('T')[0] + "T00:00:00",
                                departEndDate: end.toISOString().split('T')[0] + "T23:59:59",
                                paxClass: this.search.classID || "0",
                                ticketType: String(this.search.ticketTypeID),
                                vehicleType: String(finalVehicleID),
                                roomClass: this.search.roomClassID || "0"
                            };

                            console.log("📤 Payload Fix Terkirim:", JSON.stringify(payload, null, 2));

                            const res = await fetch('https://darma.siappgo.id/api/shipdlu/schedule', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            if (!res.ok) throw new Error(`HTTP Error! Status: ${res.status}`);
                            const data = await res.json();
                            console.log("📥 Response dari API:", data);

                            if (data.status === "SUCCESS") {
                                this.scheduleList = data.schedules || [];

                                // Generate Array Tanggal untuk Tab
                                const dateArray = [];
                                for (let i = 0; i <= 2; i++) {
                                    const tempDate = new Date(this.search.departDate);
                                    tempDate.setDate(tempDate.getDate() + i);
                                    dateArray.push(tempDate.toISOString().split('T')[0]);
                                }
                                this.availableDates = dateArray;

                                // Mapping Nama Pelabuhan
                                const origin = this.routes.origins.find(o => o.originPort === this.search.originPort);
                                const dest = this.routes.destinations.find(d => d.destinationPort === this.search.destinationPort);
                                this.originName = origin ? origin.originName : this.search.originPort;
                                this.destinationName = dest ? dest.destinationName : this.search.destinationPort;

                                this.stage = 'results';
                            } else {
                                this.showToast(data.respMessage || "Jadwal tidak ditemukan");
                            }
                        } catch (e) {
                            console.error("💥 Error:", e.message);
                            this.showToast("Gagal terhubung ke server");
                        } finally {
                            this.loading = false;
                            console.groupEnd();
                            this.$nextTick(() => {
                                if (typeof lucide !== 'undefined') lucide.createIcons();
                            });
                        }
                    },


                    async confirmBookingAndIssued() {
                        this.loading = true;
                        this.loadingText = 'Memproses Pesanan...';

                        try {
                            // 1. Ambil data Auth & Pendukung
                            const userID = this.bookingResponse.userID;
                            const accessToken = this.bookingResponse.accessToken;
                            const fareStr = String(this.selectedFareData || ""); // Pastikan ambil dari state fare yang dipilih

                            if (!userID || !accessToken) {
                                throw new Error("Sesi tidak valid. Silakan ulangi pencarian.");
                            }

                            // 2. Helper Sanitasi Tanggal (Menghapus Z dan mencegah double format)
                            // API DLU meminta format ISO Lokal tanpa akhiran Z
                            const getCleanDate = (str) => {
                                if (!str) return "2026-04-11T00:00:00";
                                return str.split('T')[0] + "T00:00:00";
                            };

                            // 3. Bersihkan Data Penumpang (Mapping Gender L/P)
                            const cleanedPax = this.passengerDetails.map(p => {
                                // Mapping gender sesuai keberhasilan: 0/L atau 1/P
                                let genderLetter = "L";
                                if (p.gender === "1" || p.gender === 1 || p.gender === "P") genderLetter = "P";

                                return {
                                    name: (p.name || "PENUMPANG").toUpperCase().trim(),
                                    gender: genderLetter, // WAJIB L/P
                                    dob: getCleanDate(p.dob || "1990-01-01"),
                                    id: String(p.id || "1234567890"),
                                    city: (p.city || 'BALIKPAPAN').toUpperCase().trim(),
                                    paxGroup: String(p.paxGroup || "1"),
                                    paxType: String(p.paxType || "1"),
                                    paxClass: String(p.paxClass || "1"),
                                    paxInfo: p.paxInfo || "VIP Dewasa",
                                    note: p.note || "",
                                    price: Number(p.price || 0),
                                    admin: Number(p.admin || 0)
                                };
                            });

                            // 4. Deteksi Tipe Tiket (Kamar / Kendaraan / Penumpang Saja)
                            const isRoom = fareStr.includes('|ROM|');
                            const isVehicle = fareStr.includes('|VHC|');

                            // 5. Bangun Payload untuk Price
                            const payloadPrice = {
                                userID: userID,
                                accessToken: accessToken,
                                originPort: String(this.selectedShip.originCode || this.search.originPort),
                                destinationPort: String(this.selectedShip.destCode || this.search.destinationPort),
                                shipNumber: String(this.selectedShip.shipNumber),
                                departDate: getCleanDate(this.selectedShip.departDateTime),
                                // Jika single fare gunakan array, jika multiple gunakan yang dari bookingResponse
                                fares: this.selectedFareData ? [{ count: cleanedPax.length, data: this.selectedFareData }] : JSON.parse(JSON.stringify(this.bookingResponse.fares)),

                                // Logic null sesuai keberhasilan kode kamu
                                listPax: (!isRoom && !isVehicle) ? cleanedPax : null,
                                listRoom: isRoom ? [{
                                    info: this.bookingResponse.listRoom[0]?.info,
                                    roomClass: String(this.bookingResponse.listRoom[0]?.roomClass),
                                    price: parseFloat(this.bookingResponse.listRoom[0]?.price || 0),
                                    admin: parseFloat(this.bookingResponse.listRoom[0]?.admin || 0),
                                    paxes: cleanedPax
                                }] : null,
                                listVehicle: isVehicle ? [{
                                    ...JSON.parse(JSON.stringify(this.bookingResponse.listVehicle[0])),
                                    paxes: cleanedPax
                                }] : null
                            };

                            console.log("🚀 Step 1: Validasi Harga...", payloadPrice);

                            // --- EXECUTE PRICE ---
                            const resPrice = await fetch('https://darma.siappgo.id/api/shipdlu/price', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payloadPrice)
                            });

                            const dataPrice = await resPrice.json();
                            if (dataPrice.status !== "SUCCESS") {
                                throw new Error(dataPrice.respMessage || "Gagal verifikasi harga.");
                            }

                            // --- EXECUTE ISSUED (Sesuai Dokumentasi H2H) ---
                            this.loadingText = 'Memproses Tiket...';

                            // Generate Unique numCode
                            const numCode = "AGNT-" + Date.now() + "-" + Math.random().toString(36).substring(2, 7).toUpperCase();

                            const payloadIssued = {
                                numCode: numCode,
                                userID: userID,
                                accessToken: accessToken,
                                originPort: payloadPrice.originPort,
                                destinationPort: payloadPrice.destinationPort,
                                shipNumber: payloadPrice.shipNumber,
                                departDate: payloadPrice.departDate,
                                listPax: payloadPrice.listPax,
                                listVehicle: payloadPrice.listVehicle,
                                listRoom: payloadPrice.listRoom,
                                bookerData: {
                                    name: (this.bookingResponse.bookerData?.name || cleanedPax[0].name).toUpperCase(),
                                    gender: cleanedPax[0].gender, // Ikuti gender penumpang pertama
                                    id: String(this.bookingResponse.bookerData?.id || cleanedPax[0].id),
                                    email: this.bookingResponse.bookerData?.email || "guest@mail.com",
                                    phone: this.bookingResponse.bookerData?.phone || "08123456789",
                                    city: (this.bookingResponse.bookerData?.city || cleanedPax[0].city).toUpperCase()
                                }
                            };

                            console.log("🚀 Step 2: Hit Issued...", payloadIssued);

                            const resIssued = await fetch('https://darma.siappgo.id/api/shipdlu/issued', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payloadIssued)
                            });

                            const dataIssued = await resIssued.json();

                            if (dataIssued.status === "SUCCESS") {
                                this.issuedResponse = dataIssued;
                                this.stage = 'issued_success';
                                this.showToast("Booking & Issued Berhasil!", "success");
                            } else {
                                throw new Error(dataIssued.respMessage || "Proses Issued gagal.");
                            }

                        } catch (e) {
                            console.error("⛔ System Error:", e);
                            this.showToast(e.message || "Terjadi gangguan sistem");
                        } finally {
                            this.loading = false;
                            this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
                        }
                    },
                    async viewEticket(bookingNumber) {
                        this.loading = true;
                        this.loadingText = 'Membuka Tiket...';
                        try {
                            const res = await fetch('https://darma.siappgo.id/api/shipdlu/get-eticket', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ bookingNumber: bookingNumber })
                            });
                            if (!res.ok) throw new Error("Gagal download");
                            const blob = await res.blob();
                            const url = window.URL.createObjectURL(blob);
                            window.open(url, '_blank');
                        } catch (e) {
                            this.showToast("Gagal membuka E-Tiket.");
                        } finally {
                            this.loading = false;
                        }
                    },

                    initBooker() {
                        if (this.bookingResponse && !this.bookingResponse.bookerData) {
                            this.bookingResponse.bookerData = { name: '', phone: '', email: '' };
                        }
                    },

                    goBack() {
                        if (this.stage === 'issued_success') this.stage = 'search';
                        else if (this.stage === 'passenger_form') this.stage = 'results';
                        else if (this.stage === 'results') this.stage = 'search';
                        this.$nextTick(() => lucide.createIcons());
                    },

                    showToast(msg) {
                        this.toast.message = msg;
                        this.toast.show = true;
                        setTimeout(() => { this.toast.show = false; }, 3000);
                    },

                    formatDateShort(iso) {
                        if (!iso) return '';
                        return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                    },
                    formatTime(iso) {
                        if (!iso) return '';
                        return new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace('.', ':');
                    },
                    formatCurrency(num) {
                        if (!num) return 'Rp 0';
                        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
                    }
                }
            }
        </script>
</body>
