<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Jadwal DLU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="bg-slate-50 font-sans antialiased" x-data="shipDluApp()">

    <div
        class="fixed top-0 inset-x-0 bg-white text-slate-800 p-4 z-50 shadow-sm flex items-center gap-4 max-w-md mx-auto">
        <button @click="goBack()" class="p-1 hover:bg-slate-100 rounded-full transition-colors">
            <i data-lucide="arrow-left" class="w-6 h-6"></i>
        </button>
        <h2 class="font-semibold text-lg" x-text="stage === 'search' ? 'Dharma Lautan Utama' : 'Pilih Jadwal'"></h2>
        <div class="ml-auto">
            <i data-lucide="more-vertical" class="w-6 h-6"></i>
        </div>
    </div>

    <div x-show="loading"
        class="fixed inset-0 bg-white/80 backdrop-blur-sm z-[100] flex items-center justify-center max-w-md mx-auto"
        x-cloak>
        <div class="text-center">
            <div
                class="w-12 h-12 border-4 border-[#24b3ae] border-t-transparent rounded-full animate-spin mx-auto mb-4">
            </div>
            <p class="text-xs font-bold text-slate-600 uppercase tracking-widest" x-text="loadingText"></p>
        </div>
    </div>

    <main class="max-w-md mx-auto min-h-screen bg-white pt-20 px-4 pb-10 shadow-xl">

        <template x-if="stage === 'search'">
            <div class="space-y-2">
                <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 shadow-sm">

                    <div @click="showOriginModal = true; searchCityQuery = ''"
                        class="p-4 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition">
                        <i data-lucide="map-pin" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Dari</label>
                            <div class="font-medium text-slate-700" x-text="selectedOriginName"></div>
                        </div>
                    </div>

                    <div @click="showDestModal = true; searchCityQuery = ''"
                        class="p-4 flex items-center gap-4 cursor-pointer hover:bg-slate-50 transition border-t">
                        <i data-lucide="map-pin" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Ke</label>
                            <div class="font-medium text-slate-700" x-text="selectedDestName"></div>
                        </div>
                    </div>

                    <div class="p-4 flex items-center gap-4">
                        <i data-lucide="calendar" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Tanggal Berangkat</label>
                            <input type="date" x-model="search.departDate"
                                class="w-full bg-transparent font-medium text-slate-700 outline-none">
                        </div>
                    </div>

                    <div class="p-4 flex items-center gap-4">
                        <i data-lucide="layers" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Jenis Tiket</label>
                            <select x-model="search.ticketTypeID"
                                class="w-full bg-transparent font-medium text-slate-700 outline-none appearance-none">
                                <template x-for="tkt in ticketTypes" :key="tkt.id">
                                    <option :value="tkt.id" x-text="tkt.name"></option>
                                </template>
                            </select>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                    </div>

                    <div class="p-4 flex items-center gap-4">
                        <i data-lucide="layers" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Kelas</label>
                            <select x-model="search.classID"
                                class="w-full bg-transparent font-medium text-slate-700 outline-none appearance-none">
                                <option value="0">Semua Kelas</option>
                                <template x-for="cls in classTypes" :key="cls.id">
                                    <option :value="cls.id" x-text="cls.name"></option>
                                </template>
                            </select>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                    </div>

                    <template x-if="search.ticketTypeID !== '1'">
                        <div class="p-4 flex items-center gap-4 border-t border-slate-100">
                            <i data-lucide="truck" class="w-6 h-6 text-slate-400"></i>
                            <div class="flex-1">
                                <label class="block text-xs text-slate-400">Jenis Kendaraan</label>
                                <select x-model="search.vehicleID"
                                    class="w-full bg-transparent font-medium text-slate-700 outline-none appearance-none">
                                    <option value="0">Pilih Kendaraan</option>
                                    <template x-for="vhc in vehicleTypes" :key="vhc.id">
                                        <option :value="vhc.id" x-text="vhc.name"></option>
                                    </template>
                                </select>
                            </div>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                        </div>
                    </template>

                    <div class="p-4 flex items-center gap-4 border-t border-slate-100">
                        <i data-lucide="door-closed" class="w-6 h-6 text-slate-400"></i>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400">Jenis Kamar</label>
                            <select x-model="search.roomClassID"
                                class="w-full bg-transparent font-medium text-slate-700 outline-none appearance-none">
                                <option value="0">Semua Jenis Kamar</option>
                                <template x-for="rm in roomClasses" :key="rm.id">
                                    <option :value="rm.id" x-text="rm.name"></option>
                                </template>
                            </select>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                    </div>
                </div>

                <div class="pt-4">
                    <button @click="getSchedules"
                        class="w-full bg-[#24b3ae] text-white py-4 rounded-xl font-bold text-base shadow-lg active:scale-[0.98] transition-all">
                        Cari Kapal Laut
                    </button>
                </div>


            </div>
        </template>

        <template x-if="stage === 'results'">
            <div class="space-y-0 -mx-4">
                <div class="px-4 py-3 bg-white border-b border-slate-100 flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-[13px] font-bold text-slate-800" x-text="`${originName} /` "></span>
                        <span class="text-[11px] text-slate-500" x-text="formatDateFull(search.departDate)"></span>
                    </div>
                    <button @click="stage = 'search'"
                        class="text-[#24b3ae] text-xs font-bold px-3 py-1 bg-cyan-50 rounded-lg">Ubah</button>
                </div>

                <div class="flex bg-slate-50 border-b border-slate-200 sticky top-[60px] z-40">
                    <template x-for="date in availableDates" :key="date">
                        <button @click="search.departDate = date"
                            :class="search.departDate === date ? 'border-[#24b3ae] text-[#24b3ae]' : 'border-transparent text-slate-400'"
                            class="flex-1 py-3 text-center border-b-2 transition-all">
                            <span class="text-[10px] font-bold uppercase" x-text="formatDateShort(date)"></span>
                        </button>
                    </template>
                </div>

                <div class="p-4 space-y-6">
                    <template x-for="item in scheduleList" :key="item.shipNumber">
                        <div class="space-y-4">
                            <div
                                class="bg-white rounded-xl border border-blue-100 p-4 shadow-sm relative overflow-hidden">
                                <div class="absolute top-0 left-0 w-1 h-full bg-[#24b3ae]"></div>

                                <div class="flex items-center gap-2 mb-4">
                                    <div class="p-1.5 bg-blue-50 rounded-md">
                                        <i data-lucide="ship" class="w-4 h-4 text-[#24b3ae]"></i>
                                    </div>
                                    <h3 class="font-bold text-slate-800 text-sm" x-text="item.shipName"></h3>
                                </div>

                                <div class="space-y-3">
                                    <div>
                                        <p class="text-[10px] text-slate-400 font-medium">Pelabuhan Asal</p>
                                        <p class="text-xs font-semibold text-slate-700" x-text="originName"></p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] text-slate-400 font-medium">Pelabuhan Tujuan</p>
                                        <p class="text-xs font-semibold text-slate-700" x-text="destinationName"></p>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[11px] text-slate-600 font-medium"
                                            x-text="formatDateRange(item.departDateTime, item.arrivalDateTime)"></span>
                                        <span class="text-slate-300">•</span>
                                        <span class="text-[11px] text-slate-600 font-medium">06:00 - 12:00</span>
                                        <span class="text-slate-300">•</span>
                                        <span class="text-[11px] text-slate-600 font-medium">30j 0m</span>
                                    </div>
                                    <div>
                                        <p class="text-[10px] text-slate-400 font-medium">Rute</p>
                                        <p class="text-xs font-bold text-slate-700" x-text="item.routeInfo.trim()"></p>
                                    </div>
                                </div>
                            </div>

                            <div class="divide-y divide-slate-100">
                                <template x-for="(fare, index) in item.Fares" :key="fare.Classes + fare.PaxType">
                                    <div class="py-4 flex justify-between items-center">
                                        <div class="flex-1 pr-4">
                                            <p class="text-xs font-bold text-slate-500" x-text="fare.Classes"></p>
                                            <p class="text-xs text-slate-700 font-medium leading-tight"
                                                x-text="fare.PaxType"></p>
                                            <p class="text-sm font-bold text-[#24b3ae] mt-1"
                                                x-text="formatCurrency(fare.Price)"></p>
                                        </div>

                                        <div
                                            class="flex items-center gap-3 bg-slate-50 rounded-full px-2 py-1 border border-slate-100">
                                            <button @click="updateQty(item.shipNumber, index, -1)"
                                                class="w-6 h-6 flex items-center justify-center rounded-full bg-white shadow-sm text-slate-600 active:scale-90">
                                                <i data-lucide="minus" class="w-3 h-3"></i>
                                            </button>
                                            <span class="text-xs font-bold w-4 text-center"
                                                x-text="fare.count || 0"></span>
                                            <button @click="updateQty(item.shipNumber, index, 1)"
                                                class="w-6 h-6 flex items-center justify-center rounded-full bg-[#24b3ae] shadow-sm text-white active:scale-90">
                                                <i data-lucide="plus" class="w-3 h-3"></i>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="getTotalSelected() > 0" x-transition:enter="translate-y-full"
                    x-transition:enter-end="translate-y-0"
                    class="fixed bottom-0 inset-x-0 max-w-md mx-auto bg-white p-4 border-t border-slate-100 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] z-50 flex items-center justify-between">
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">Total Bayar</p>
                        <p class="text-lg font-black text-[#24b3ae]" x-text="formatCurrency(getTotalPrice())"></p>
                    </div>
                    <button @click="goToPassengerForm()"
                        class="bg-[#24b3ae] text-white px-8 py-3 rounded-xl font-bold text-sm">
                        Lanjutkan
                    </button>
                </div>
            </div>
        </template>

        <template x-if="stage === 'passenger_form'">
            <div class="space-y-6">
                <div class="bg-[#24b3ae] p-5 rounded-3xl text-white shadow-lg shadow-cyan-100">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[10px] font-bold uppercase tracking-widest opacity-80">Total Pembayaran</span>
                        <i data-lucide="info" class="w-4 h-4"></i>
                    </div>
                    <p class="text-3xl font-black" x-text="formatCurrency(getTotalPrice())"></p>
                </div>

                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h3 class="font-bold text-blue-800 flex items-center gap-2 text-sm">
                        <i data-lucide="users" class="w-4 h-4"></i>
                        Data Penumpang
                    </h3>
                    <p class="text-[10px] text-blue-600">Sesuai KTP/Paspor untuk verifikasi manifest pelabuhan.</p>
                </div>

                <template x-for="(pax, index) in passengerDetails" :key="index">
                    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        <div class="bg-slate-50 px-4 py-2 border-b border-slate-200 flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider"
                                x-text="'Penumpang ' + (index + 1) + ' (' + pax.paxType + ')'"></span>
                            <i data-lucide="user-check" class="w-4 h-4 text-slate-400"></i>
                        </div>

                        <div class="p-4 space-y-4">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Nama
                                    Lengkap</label>
                                <input type="text" x-model="pax.name"
                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:border-[#24b3ae]"
                                    placeholder="Contoh: AMIR MUNADIR">
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Jenis
                                    Kelamin</label>
                                <select x-model="pax.gender"
                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none">
                                    <option value="0">Laki-laki</option>
                                    <option value="1">Perempuan</option>
                                </select>
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Tanggal
                                    Lahir</label>
                                <input type="date" x-model="pax.dob"
                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none">
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">NIK / No.
                                    Identitas</label>
                                <input type="text" x-model="pax.id"
                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none"
                                    placeholder="16 Digit Nomor NIK">
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Kota
                                    Asal</label>
                                <input type="text" x-model="pax.city"
                                    class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none"
                                    placeholder="Contoh: TANGERANG">
                            </div>
                        </div>
                    </div>
                </template>

                <div
                    class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-4 border-2 border-dashed">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                        Kontak Pemesan
                    </h3>

                    <div class="space-y-3" x-show="bookingResponse && bookingResponse.bookerData">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Nama
                                Pemesan</label>
                            <input type="text" x-model="bookingResponse.bookerData.name"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none">
                        </div>

                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">No.
                                WhatsApp</label>
                            <input type="tel" x-model="bookingResponse.bookerData.phone"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none">
                        </div>

                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Email</label>
                            <input type="email" x-model="bookingResponse.bookerData.email"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none">
                        </div>

                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase mb-1 block">Kota</label>
                            <input type="text" x-model="bookingResponse.bookerData.city"
                                class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none">
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-3 pb-10">
                    <button @click="confirmBookingAndIssued()"
                        class="w-full bg-[#24b3ae] text-white py-4 rounded-2xl font-black uppercase text-sm shadow-lg shadow-cyan-100 active:scale-95 transition-all">
                        Booking & Issued Tiket Sekarang
                    </button>
                    <button @click="stage = 'results'"
                        class="w-full bg-slate-100 text-slate-600 py-4 rounded-2xl font-bold hover:bg-slate-200 transition">
                        Kembali
                    </button>
                </div>
            </div>
        </template>

        <template x-if="stage === 'issued_success'">
            <div class="space-y-6">
                <div class="text-center py-6">
                    <div
                        class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                        <i data-lucide="check-circle" class="w-12 h-12"></i>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 uppercase tracking-tight">Pembayaran Berhasil</h3>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest"
                        x-text="'No. Booking: ' + issuedResponse.bookingNumber"></p>
                </div>

                <div class="bg-white border-2 border-slate-100 rounded-3xl overflow-hidden shadow-sm">
                    <div class="p-5 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                        <div>
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Kapal</p>
                            <p class="text-sm font-black text-[#0194f3]" x-text="issuedResponse.shipName"></p>
                        </div>
                        <div class="text-right">
                            <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest">No Reff</p>
                            <p class="text-sm font-black text-slate-800" x-text="issuedResponse.numCode"></p>
                        </div>
                    </div>

                    <div class="p-5 space-y-4">
                        <template x-for="pax in issuedResponse.paxBookingDetails" :key="pax.ticketNumber">
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <p class="text-xs font-black text-slate-800 uppercase" x-text="pax.paxName"></p>
                                        <p class="text-[9px] font-bold text-slate-400 uppercase"
                                            x-text="pax.paxType + ' | ' + (pax.paxGender === '0' ? 'Laki-laki' : 'Perempuan')">
                                        </p>
                                    </div>
                                    <span class="text-[10px] font-black text-blue-600 uppercase"
                                        x-text="pax.cabin && pax.cabin !== '0' ? 'Kamar: ' + pax.cabin : 'Deck: ' + pax.deck"></span>
                                </div>
                                <div class="flex items-center justify-between pt-2 border-t border-slate-200">
                                    <p class="text-[10px] font-bold text-slate-500"
                                        x-text="'Tiket: ' + pax.ticketNumber"></p>

                                    <button @click="viewEticket(issuedResponse.bookingNumber)"
                                        class="flex items-center gap-1 text-[10px] font-black text-[#ff5e1f] uppercase tracking-widest underline decoration-2 underline-offset-4">
                                        <i data-lucide="download" class="w-3 h-3"></i>
                                        Lihat E-Tiket
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <button @click="stage = 'search'"
                    class="w-full border-2 border-slate-200 text-slate-600 py-4 rounded-2xl font-black uppercase text-sm shadow-sm active:scale-95 transition-all">
                    Kembali ke Beranda
                </button>
            </div>
        </template>
        </div>

        <div x-show="toast.show" x-transition x-cloak
            class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-[10px] font-bold uppercase tracking-widest px-6 py-3 rounded-full shadow-2xl z-[200]">
            <span x-text="toast.message"></span>
        </div>

        <template x-if="showOriginModal || showDestModal">
            <div class="fixed inset-0 z-[100] flex flex-col bg-white overflow-hidden">
                <div class="flex items-center p-4 border-b">
                    <button @click="showOriginModal = false; showDestModal = false" class="p-2">
                        <i data-lucide="arrow-left" class="w-6 h-6 text-slate-600"></i>
                    </button>
                    <h3 class="flex-1 font-bold text-lg text-center" x-text="showOriginModal ? 'Asal' : 'Tujuan'"></h3>
                    <div class="w-10"></div>
                </div>

                <div class="p-4 bg-slate-50">
                    <div class="relative flex items-center">
                        <i data-lucide="search" class="absolute left-3 w-5 h-5 text-slate-400"></i>
                        <input type="text" x-model="searchCityQuery" placeholder="Cari nama kota / pelabuhan..."
                            class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto">
                    <template x-if="showOriginModal">
                        <div class="divide-y divide-slate-100">
                            <template x-for="port in filteredOrigins" :key="port.originPort">
                                <div @click="search.originPort = port.originPort; showOriginModal = false"
                                    class="p-4 hover:bg-slate-50 active:bg-slate-100 cursor-pointer flex items-center gap-3">
                                    <i data-lucide="anchor" class="w-4 h-4 text-slate-400"></i>
                                    <span class="text-slate-700 font-medium" x-text="port.originName"></span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template x-if="showDestModal">
                        <div class="divide-y divide-slate-100">
                            <template x-for="port in filteredDestinations" :key="port.destinationPort">
                                <div @click="search.destinationPort = port.destinationPort; showDestModal = false"
                                    class="p-4 hover:bg-slate-50 active:bg-slate-100 cursor-pointer flex items-center gap-3">
                                    <i data-lucide="anchor" class="w-4 h-4 text-slate-400"></i>
                                    <span class="text-slate-700 font-medium" x-text="port.destinationName"></span>
                                </div>
                            </template>
                        </div>
                    </template>

                    <div x-show="showOriginModal ? filteredOrigins.length === 0 : filteredDestinations.length === 0"
                        class="p-10 text-center text-slate-400">
                        <p>Kota tidak ditemukan</p>
                    </div>
                </div>
            </div>
        </template>

        <script>
            function shipDluApp() {
                return {
                    stage: 'search',
                    passengerDetails: [],
                    loading: false,
                    loadingText: 'Memuat...',
                    routes: { origins: [], destinations: [] },
                    classTypes: [],
                    vehicleTypes: [],
                    ticketTypes: [],
                    roomClasses: [],
                    scheduleList: [],
                    bookingResponse: null,
                    issuedResponse: null,
                    selectedShip: null,
                    selectedFareData: '',
                    toast: { show: false, message: '' },
                    search: {
                        originPort: '',
                        destinationPort: '',
                        classID: '0',
                        vehicleID: '0',
                        ticketTypeID: '1',
                        roomClassID: '0',
                        departDate: new Date().toISOString().split('T')[0],
                        adultMale: 1,
                        adultFemale: 0,
                        child: 0,
                        infant: 0
                    },
                    bookingResponse: {
                        bookerData: {
                            name: '',
                            phone: '',
                            email: '',
                            city: ''
                        }
                    },
                    showOriginModal: false,
                    showDestModal: false,
                    searchCityQuery: '',

                    get filteredOrigins() {
                        return this.routes.origins.filter(p =>
                            p.originName.toLowerCase().includes(this.searchCityQuery.toLowerCase())
                        );
                    },
                    get filteredDestinations() {
                        return this.routes.destinations.filter(p =>
                            p.destinationName.toLowerCase().includes(this.searchCityQuery.toLowerCase())
                        );
                    },

                    // Helper untuk mendapatkan nama kota yang terpilih saat ini
                    get selectedOriginName() {
                        const found = this.routes.origins.find(p => p.originPort == this.search.originPort);
                        return found ? found.originName : 'Pilih Kota Asal';
                    },
                    get selectedDestName() {
                        const found = this.routes.destinations.find(p => p.destinationPort == this.search.destinationPort);
                        return found ? found.destinationName : 'Pilih Kota Tujuan';
                    },

                    async init() {
                        this.loading = true;
                        this.loadingText = 'Loading...';
                        try {
                            const baseUrl = 'https://darma.siappgo.id/api/shipdlu';
                            const [resRoute, resClass, resVehicle, resTicket, resRoom] = await Promise.all([
                                fetch(`${baseUrl}/route`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                                fetch(`${baseUrl}/class-types`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                                fetch(`${baseUrl}/vehicle-types`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                                fetch(`${baseUrl}/ticket-types`, { method: 'POST', headers: { 'Content-Type': 'application/json' } }),
                                fetch(`${baseUrl}/room-classes`, { method: 'POST', headers: { 'Content-Type': 'application/json' } })
                            ]);

                            const dataRoute = await resRoute.json();
                            if (dataRoute.status === "SUCCESS") {
                                this.routes.origins = dataRoute.origins;
                                this.routes.destinations = dataRoute.destinations;
                            }
                            const dataClass = await resClass.json();
                            if (dataClass.status === "SUCCESS") this.classTypes = dataClass.shipclasses;
                            const dataVehicle = await resVehicle.json();
                            if (dataVehicle.status === "SUCCESS") this.vehicleTypes = dataVehicle.shipVehicleTypes;
                            const dataTicket = await resTicket.json();
                            if (dataTicket.status === "SUCCESS") this.ticketTypes = dataTicket.shipPaxTypes;
                            const dataRoom = await resRoom.json();
                            if (dataRoom.status === "SUCCESS") this.roomClasses = dataRoom.shipRoomClasses;

                        } catch (e) {
                            this.showToast("Gagal memuat API");
                        } finally {
                            this.loading = false;
                            this.$nextTick(() => lucide.createIcons());
                        }
                    },

                    updateQty(shipNumber, fareIndex, delta) {
                        const ship = this.scheduleList.find(s => s.shipNumber === shipNumber);
                        if (ship && ship.Fares[fareIndex]) {
                            let currentCount = ship.Fares[fareIndex].count || 0;
                            let newCount = currentCount + delta;

                            // Batasi agar tidak kurang dari 0
                            if (newCount >= 0) {
                                ship.Fares[fareIndex].count = newCount;
                            }
                        }
                    },

                    // Hitung Total Item yang dipilih
                    getTotalSelected() {
                        let total = 0;
                        this.scheduleList.forEach(ship => {
                            ship.Fares.forEach(fare => {
                                total += (fare.count || 0);
                            });
                        });
                        return total;
                    },

                    // Hitung Total Harga
                    getTotalPrice() {
                        let total = 0;
                        this.scheduleList.forEach(ship => {
                            ship.Fares.forEach(fare => {
                                total += (fare.count || 0) * fare.Price;
                            });
                        });
                        return total;
                    },

                    async goToPassengerForm() {
                        // 1. Validasi: Cari kapal yang ada tiketnya (count > 0)
                        const selectedItem = this.scheduleList.find(item =>
                            item.Fares && item.Fares.some(f => f.count > 0)
                        );

                        if (!selectedItem) {
                            this.showToast("Silakan pilih minimal satu tiket.");
                            return;
                        }

                        // 2. Kunci data ke variabel global Alpine agar tidak hilang/null
                        this.selectedShip = selectedItem;

                        // Ambil string 'Data' dari fare pertama yang dipilih user
                        const chosenFare = selectedItem.Fares.find(f => f.count > 0);
                        this.selectedFareData = chosenFare.Data;

                        const selectedFares = selectedItem.Fares
                            .filter(f => f.count > 0)
                            .map(f => ({
                                count: f.count,
                                data: f.Data
                            }));

                        this.loading = true;
                        this.loadingText = 'Mengunci Kursi...';

                        try {
                            const payload = {
                                shipNumber: String(selectedItem.shipNumber),
                                originPort: String(selectedItem.originCode || this.search.originPort),
                                destinationPort: String(selectedItem.destCode || this.search.destinationPort),
                                departDate: selectedItem.departDateTime,
                                fares: selectedFares
                            };

                            console.log("Select Schedule Payload:", payload);

                            const res = await fetch('https://darma.siappgo.id/api/shipdlu/select-schedule', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            const data = await res.json();

                            if (data.status === "SUCCESS") {
                                this.bookingResponse = data;

                                // Logika Ekstraksi Penumpang dengan Fallback
                                let rawPaxes = [];
                                if (data.listPax?.length > 0) rawPaxes = data.listPax;
                                else if (data.listRoom?.[0]?.paxes) rawPaxes = data.listRoom[0].paxes;
                                else if (data.listVehicle?.[0]?.paxes) rawPaxes = data.listVehicle[0].paxes;

                                // ANTI-GAGAL: Jika listPax kosong, paksa buat template sesuai jumlah tiket
                                if (rawPaxes.length === 0) {
                                    const totalTarget = selectedFares.reduce((a, b) => a + b.count, 0);
                                    for (let i = 0; i < totalTarget; i++) {
                                        rawPaxes.push({ name: '', id: '', gender: "0", paxGroup: "1", city: 'JAKARTA' });
                                    }
                                }

                                this.passengerDetails = rawPaxes.map(p => ({
                                    ...p,
                                    name: p.name || '',
                                    id: p.id || '',
                                    city: p.city || 'JAKARTA',
                                    gender: String(p.gender || "0"),
                                    paxGroup: String(p.paxGroup || "1"),
                                    dob: p.dob || '1990-01-01'
                                }));

                                this.initBooker();
                                this.stage = 'passenger_form';
                            } else {
                                this.showToast(data.respMessage || "Gagal mengunci jadwal");
                            }
                        } catch (e) {
                            console.error("Fatal Error Select Schedule:", e);
                            this.showToast("Gangguan koneksi ke server");
                        } finally {
                            this.loading = false;
                        }
                    },

                    getPaxList() {
                        if (!this.bookingResponse) return [];
                        if (this.bookingResponse.listRoom && this.bookingResponse.listRoom.length > 0) {
                            return this.bookingResponse.listRoom[0].paxes || [];
                        }
                        if (this.bookingResponse.listPax && this.bookingResponse.listPax.length > 0) {
                            return this.bookingResponse.listPax;
                        }
                        if (this.bookingResponse.listVehicle && this.bookingResponse.listVehicle.length > 0) {
                            return this.bookingResponse.listVehicle[0].paxes || [];
                        }
                        return [];
                    },

                    async getSchedules() {
                        this.loading = true;
                        this.loadingText = 'Mencari Jadwal...';
                        try {
                            const start = new Date(this.search.departDate);
                            const end = new Date(this.search.departDate);
                            end.setDate(start.getDate() + 3);

                            const payload = {
                                originPort: this.search.originPort,
                                destinationPort: this.search.destinationPort,
                                departStartDate: start.toISOString().split('T')[0] + "T00:00:00Z",
                                departEndDate: end.toISOString().split('T')[0] + "T23:59:59Z",
                                paxClass: this.search.classID, // Filter Kelas
                                ticketType: this.search.ticketTypeID, // Penumpang / Kendaraan
                                vehicleType: (this.search.ticketTypeID === '1') ? '0' : this.search.vehicleID,
                                roomClass: this.search.roomClassID // Filter Jenis Kamar
                            };

                            const res = await fetch('https://darma.siappgo.id/api/shipdlu/schedule', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            const data = await res.json();
                            if (data.status === "SUCCESS") {
                                this.scheduleList = data.schedules || [];
                                this.stage = 'results';

                                // Logika Tambahan: Ambil nama Pelabuhan untuk Header Result
                                const origin = this.routes.origins.find(o => o.originPort === this.search.originPort);
                                const dest = this.routes.destinations.find(d => d.destinationPort === this.search.destinationPort);
                                this.originName = origin ? origin.originName : '';
                                this.destinationName = dest ? dest.destinationName : '';

                            } else {
                                this.showToast(data.respMessage || "Jadwal tidak ditemukan");
                            }
                        } catch (e) {
                            this.showToast("Server sibuk");
                        } finally {
                            this.loading = false;
                            this.$nextTick(() => lucide.createIcons());
                        }
                    },


                    async selectFare(item, fare) {
                        this.loading = true;
                        this.loadingText = 'Mengunci Kursi...';

                        // 1. LOG INITIAL DATA: Memastikan data yang diterima dari UI benar
                        console.log("=== DEBUG SELECT FARE START ===");
                        console.log("Item Kapal:", item);
                        console.log("Fare Terpilih:", fare);

                        try {
                            // Validasi: Hindari NaN dengan fallback 0
                            const adultMale = parseInt(this.search.adultMale) || 0;
                            const adultFemale = parseInt(this.search.adultFemale) || 0;
                            const child = parseInt(this.search.child) || 0;
                            const totalPax = adultMale + adultFemale + child;

                            console.log("Detail Penumpang:", { adultMale, adultFemale, child, totalPax });

                            // KRITIKAL: Jika total penumpang 0, API Darmawisata biasanya menolak
                            if (totalPax <= 0) {
                                console.error("Error: Total penumpang adalah 0.");
                                this.showToast("Pilih jumlah penumpang terlebih dahulu");
                                this.loading = false;
                                return;
                            }

                            this.selectedShip = item;
                            this.selectedFareData = fare.Data;

                            // 2. PREPARE PAYLOAD
                            const payload = {
                                shipNumber: String(item.shipNumber),
                                originPort: String(item.originCode),
                                destinationPort: String(item.destCode),
                                departDate: item.departDateTime,
                                fares: [{ count: totalPax, data: fare.Data }]
                            };

                            console.log("Payload ke /select-schedule:", JSON.stringify(payload, null, 2));

                            // 3. FETCHING
                            const res = await fetch('https://darma.siappgo.id/api/shipdlu/select-schedule', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });

                            if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

                            const data = await res.json();
                            console.log("Response dari Server:", data);

                            if (data.status === "SUCCESS") {
                                this.bookingResponse = data;

                                // Helper untuk mapping data penumpang
                                const setupPax = (p) => ({
                                    ...p,
                                    name: p.name || '',
                                    id: p.id || '',
                                    city: p.city || 'JAKARTA',
                                    note: p.note || '',
                                    gender: String(p.gender || "0"),
                                    paxGroup: String(p.paxGroup || "1"),
                                    dob: p.dob || ''
                                });

                                // --- STRATEGI EKSTRAKSI DENGAN FALLBACK ---
                                let extractedPaxes = [];

                                if (data.listRoom?.length > 0 && data.listRoom[0].paxes?.length > 0) {
                                    console.log("Tipe: Booking Kamar (Room)");
                                    extractedPaxes = data.listRoom[0].paxes;
                                }
                                else if (data.listPax?.length > 0) {
                                    console.log("Tipe: Booking Penumpang Biasa");
                                    extractedPaxes = data.listPax;
                                }
                                else if (data.listVehicle?.length > 0 && data.listVehicle[0].paxes?.length > 0) {
                                    console.log("Tipe: Booking Kendaraan");
                                    extractedPaxes = data.listVehicle[0].paxes;
                                }

                                // FALLBACK: Jika API sukses tapi paxes kosong, buat 1 template penumpang manual
                                if (extractedPaxes.length === 0) {
                                    console.warn("Warning: Data penumpang kosong dari API, menggunakan fallback template.");
                                    extractedPaxes = [{
                                        name: '',
                                        id: '',
                                        gender: "0",
                                        paxGroup: "1", // Dewasa
                                        city: 'JAKARTA'
                                    }];
                                }

                                this.passengerDetails = extractedPaxes.map(setupPax);
                                console.log("Final Passenger Details:", this.passengerDetails);

                                this.initBooker();
                                this.stage = 'passenger_form';

                            } else {
                                console.warn("API Gagal:", data.respMessage);
                                this.showToast(data.respMessage || "Terjadi kesalahan pada sistem DLU");
                            }
                        } catch (e) {
                            console.error("Exception Caught:", e);
                            this.showToast("Koneksi gagal atau server sibuk");
                        } finally {
                            this.loading = false;
                            console.log("=== DEBUG SELECT FARE END ===");
                            this.$nextTick(() => {
                                if (typeof lucide !== 'undefined') lucide.createIcons();
                            });
                        }
                    },
                    async confirmBookingAndIssued() {
                        this.loading = true;
                        this.loadingText = 'Validasi Harga...';

                        try {
                            const rawPaxes = this.getPaxList();

                            // --- 1. CLEANING PENUMPANG (Paling Krusial) ---
                            const cleanedPax = rawPaxes.map(p => {
                                // Mapping gender: API minta L/P. Jika "0" (Pria) -> L, Jika "1" (Wanita) -> P
                                let genderLetter = "L";
                                if (p.gender === "1" || p.gender === 1) genderLetter = "P";

                                return {
                                    ...p,
                                    name: (p.name || "PENUMPANG").toUpperCase().trim(),
                                    city: (p.city || "JAKARTA").toUpperCase().trim(),
                                    note: p.note || "",
                                    paxGroup: String(p.paxGroup || "1"),
                                    gender: genderLetter, // Gunakan L/P sesuai dokumentasi
                                    paxType: String(p.paxType || "1"),
                                    paxClass: String(p.paxClass || "1"),
                                    // ANTI-GAGAL: Jangan biarkan DOB 0001-01-01. Gunakan default 1990 jika kosong.
                                    dob: (p.dob && p.dob !== "0001-01-01T00:00:00")
                                        ? (p.dob.includes('T') ? p.dob.split('Z')[0] : `${p.dob}T00:00:00`)
                                        : "1990-01-01T00:00:00",
                                    id: String(p.id || "1234567890"),
                                    // Field Tambahan dari dokumentasi issued
                                    price: p.price || 0,
                                    admin: p.admin || 0,
                                    paxInfo: p.paxInfo || "Dewasa"
                                };
                            });

                            const fareStr = String(this.selectedFareData);
                            const isRoom = fareStr.includes('|ROM|');
                            const isVehicle = fareStr.includes('|VHC|');
                            // Hilangkan 'Z' dari departDate
                            const formattedDepartDate = this.selectedShip.departDateTime.split('Z')[0];

                            // --- 2. PAYLOAD UNTUK PRICE (Gunakan format kode lama Anda yang berhasil) ---
                            const payloadPrice = {
                                originPort: String(this.search.originPort),
                                destinationPort: String(this.search.destinationPort),
                                shipNumber: String(this.selectedShip.shipNumber),
                                departDate: formattedDepartDate,
                                fares: [{ count: cleanedPax.length, data: this.selectedFareData }],
                                listPax: (!isRoom && !isVehicle) ? cleanedPax : null,
                                listRoom: isRoom ? [{
                                    info: this.bookingResponse.listRoom[0].info,
                                    roomClass: String(this.bookingResponse.listRoom[0].roomClass),
                                    price: parseFloat(this.bookingResponse.listRoom[0].price),
                                    admin: parseFloat(this.bookingResponse.listRoom[0].admin),
                                    paxes: cleanedPax
                                }] : null,
                                listVehicle: isVehicle ? [{
                                    ...this.bookingResponse.listVehicle[0],
                                    paxes: cleanedPax
                                }] : null
                            };

                            const resPrice = await fetch('https://darma.siappgo.id/api/shipdlu/price', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payloadPrice)
                            });
                            const dataPrice = await resPrice.json();

                            if (dataPrice.status !== "SUCCESS") {
                                this.showToast("Gagal Validasi: " + dataPrice.respMessage);
                                this.loading = false;
                                return;
                            }

                            // --- 3. PAYLOAD UNTUK ISSUED (Sesuai Dokumentasi H2H) ---
                            this.loadingText = 'Memproses Tiket...';
                            const genNumCode = () => "AGNT-" + Date.now() + "-" + Math.random().toString(36).substring(2, 8).toUpperCase();

                            const payloadIssued = {
                                numCode: genNumCode(),
                                originPort: payloadPrice.originPort,
                                destinationPort: payloadPrice.destinationPort,
                                shipNumber: payloadPrice.shipNumber,
                                departDate: payloadPrice.departDate,
                                listPax: payloadPrice.listPax,
                                listVehicle: payloadPrice.listVehicle,
                                listRoom: payloadPrice.listRoom,
                                bookerData: {
                                    // Booker gender juga gunakan L/P
                                    gender: cleanedPax[0].gender === "P" ? "P" : "L",
                                    name: (this.bookingResponse.bookerData?.name || cleanedPax[0].name).toUpperCase(),
                                    id: String(this.bookingResponse.bookerData?.id || cleanedPax[0].id || "1234567890"),
                                    email: this.bookingResponse.bookerData?.email || "guest@mail.com",
                                    phone: this.bookingResponse.bookerData?.phone || "08123456789",
                                    city: (this.bookingResponse.bookerData?.city || cleanedPax[0].city).toUpperCase()
                                }
                            };

                            const resIssued = await fetch('https://darma.siappgo.id/api/shipdlu/issued', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payloadIssued)
                            });
                            const dataIssued = await resIssued.json();

                            // 4. HASIL AKHIR
                            if (dataIssued.status === "SUCCESS") {
                                this.issuedResponse = dataIssued;
                                this.stage = 'issued_success';
                            } else {
                                this.showToast(dataIssued.respMessage);
                            }

                        } catch (e) {
                            console.error("Critical System Error:", e);
                            this.showToast("Terjadi kesalahan sistem");
                        } finally {
                            this.loading = false;
                            this.$nextTick(() => {
                                if (typeof lucide !== 'undefined') lucide.createIcons();
                            });
                        }
                    },

                    async viewEticket(bookingNumber) {
                        this.loading = true;
                        this.loadingText = 'Membuka Tiket...';
                        try {
                            const res = await fetch('https://darma.siappgo.id/api/shipdlu/get-eticket', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ bookingNumber: bookingNumber })
                            });
                            if (!res.ok) throw new Error("Gagal download");
                            const blob = await res.blob();
                            const url = window.URL.createObjectURL(blob);
                            window.open(url, '_blank');
                        } catch (e) {
                            this.showToast("Gagal membuka E-Tiket.");
                        } finally {
                            this.loading = false;
                        }
                    },

                    initBooker() {
                        if (this.bookingResponse && !this.bookingResponse.bookerData) {
                            this.bookingResponse.bookerData = { name: '', phone: '', email: '' };
                        }
                    },

                    goBack() {
                        if (this.stage === 'issued_success') this.stage = 'search';
                        else if (this.stage === 'passenger_form') this.stage = 'results';
                        else if (this.stage === 'results') this.stage = 'search';
                        this.$nextTick(() => lucide.createIcons());
                    },

                    showToast(msg) {
                        this.toast.message = msg;
                        this.toast.show = true;
                        setTimeout(() => { this.toast.show = false; }, 3000);
                    },

                    formatDateShort(iso) {
                        if (!iso) return '';
                        return new Date(iso).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                    },
                    formatTime(iso) {
                        if (!iso) return '';
                        return new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace('.', ':');
                    },
                    formatCurrency(num) {
                        if (!num) return 'Rp 0';
                        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
                    }
                }
            }
        </script>
</body>
