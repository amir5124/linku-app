<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pemesanan - TangerangFast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .color-primary {
            color: #24b3a3;
        }

        .bg-primary {
            background-color: #24b3a3;
        }

        .color-secondary {
            color: #e03f7d;
        }

        .bg-secondary {
            background-color: #e03f7d;
        }

        .border-primary {
            border-color: #24b3a3;
        }

        [x-cloak] {
            display: none !important;
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .bg-dashed {
            background-image: linear-gradient(to right, #cbd5e1 50%, rgba(255, 255, 255, 0) 0%);
            background-position: bottom;
            background-size: 8px 1px;
            background-repeat: repeat-x;
        }
    </style>
</head>

<body class="bg-gray-100 font-sans" x-data="bookingApp()" x-init="
      window.app = $data;   
      fetchHistory();
  " @bayar.window="prosesBayar($event.detail)">

    <div x-show="isProcessing"
        class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-md"
        x-cloak>
        <div class="w-16 h-16 border-4 border-[#24b3a3] border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-white font-black tracking-widest uppercase text-xs" x-text="processText"></p>
    </div>

    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[300] w-full max-w-xs transition-all duration-500"
        x-show="toast.show" x-transition:enter="translate-y-20 opacity-0"
        x-transition:enter-end="translate-y-0 opacity-100" x-transition:leave="translate-y-20 opacity-0" x-cloak>
        <div :class="toast.type === 'success' ? 'bg-emerald-500' : 'bg-red-500'"
            class="p-4 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/20">
            <i :data-lucide="toast.type === 'success' ? 'check-circle' : 'alert-circle'" class="w-5 h-5 text-white"></i>
            <p class="text-white text-[11px] font-bold leading-tight" x-text="toast.message"></p>
        </div>
    </div>

    <div x-show="step === 'history'">
        <div class="bg-white shadow-sm sticky top-0 z-50">
            <div class="px-4 py-4 flex items-center justify-between max-w-md mx-auto">
                <div class="flex items-center gap-3">
                    <i data-lucide="plane" class="w-6 h-6 color-primary"></i>
                    <h1 class="text-lg font-bold text-gray-800">Riwayat Pesanan</h1>
                </div>
            </div>
        </div>

        <div class="max-w-md mx-auto p-4 space-y-4" id="history-container">
            <div id="loading-state" class="space-y-4" x-show="loading">
                <div class="bg-white rounded-2xl h-44 w-full skeleton border border-gray-100"></div>
                <div class="bg-white rounded-2xl h-44 w-full skeleton border border-gray-100"></div>
            </div>
        </div>
    </div>

    <div x-show="step === 'e-ticket'" x-cloak class="min-h-screen bg-slate-50 pb-20 max-w-md mx-auto">
        <div class="bg-[#24b3ae] p-4 text-white flex items-center gap-4 sticky top-0 z-50 shadow-md">
            <button @click="location.reload()"><i data-lucide="arrow-left"></i></button>
            <div class="flex-1">
                <h2 class="font-bold uppercase tracking-tight text-sm">E-Tiket Siap</h2>
                <p class="text-[10px] opacity-80"
                    x-text="'No. Ref: ' + (bookingDetail ? bookingDetail.reference_no : '')"></p>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[8px] uppercase font-bold opacity-70">Status</span>
                <span class="text-[10px] font-black bg-white/20 px-2 py-0.5 rounded"
                    x-text="bookingDetail ? bookingDetail.ticket_status : 'ISSUED'"></span>
            </div>
        </div>

        <div class="p-4 space-y-4">
            <div class="bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
                <div class="bg-slate-900 p-5 text-white flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-[8px] text-slate-400 uppercase font-bold tracking-widest mb-1">Maskapai</span>
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center p-1">
                                <i data-lucide="plane" class="text-slate-900 w-5 h-5"></i>
                            </div>
                            <span class="font-black text-sm tracking-tight"
                                x-text="bookingDetail ? bookingDetail.airline_name : ''"></span>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-[8px] text-slate-400 uppercase font-bold tracking-widest mb-1">Kode Booking</p>
                        <p class="font-black text-xl text-[#24b3ae] tracking-[0.2em]"
                            x-text="bookingDetail ? bookingDetail.booking_code : ''"></p>
                    </div>
                </div>

                <div class="p-6 space-y-6">
                    <div class="flex justify-between items-center relative">
                        <div class="text-left w-1/3">
                            <p class="text-2xl font-black text-slate-800 leading-none"
                                x-text="bookingDetail ? bookingDetail.origin_code || bookingDetail.origin : ''"></p>
                            <p class="text-[9px] text-slate-400 font-bold uppercase mt-2 truncate"
                                x-text="bookingDetail ? bookingDetail.origin_port : ''"></p>
                        </div>

                        <div class="flex-1 flex flex-col items-center px-2">
                            <div class="w-full border-t-2 border-dashed border-slate-200 relative mt-2">
                                <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-white px-2 text-[#24b3ae]">
                                    <i data-lucide="plane-takeoff" class="w-5 h-5"></i>
                                </div>
                            </div>
                            <span
                                class="text-[7px] font-black text-[#24b3ae] uppercase mt-4 tracking-widest">Pergi</span>
                        </div>

                        <div class="text-right w-1/3">
                            <p class="text-2xl font-black text-slate-800 leading-none"
                                x-text="bookingDetail ? bookingDetail.destination_code || bookingDetail.destination : ''">
                            </p>
                            <p class="text-[9px] text-slate-400 font-bold uppercase mt-2 truncate"
                                x-text="bookingDetail ? bookingDetail.destination_port : ''"></p>
                        </div>
                    </div>

                    <template
                        x-if="bookingDetail && bookingDetail.payload_request && bookingDetail.payload_request.tripType === 'RoundTrip'">
                        <div class="flex justify-between items-center relative pt-4 border-t border-slate-50">
                            <div class="text-left w-1/3 opacity-60">
                                <p class="text-xl font-black text-slate-800 leading-none"
                                    x-text="bookingDetail.destination_code || bookingDetail.destination"></p>
                                <p class="text-[8px] text-slate-400 font-bold uppercase mt-1 truncate"
                                    x-text="bookingDetail.destination_port"></p>
                            </div>

                            <div class="flex-1 flex flex-col items-center px-2">
                                <div class="w-full border-t-2 border-dashed border-slate-200 relative mt-2">
                                    <div
                                        class="absolute -top-3 left-1/2 -translate-x-1/2 bg-white px-2 text-purple-400">
                                        <i data-lucide="plane-landing" class="w-5 h-5"></i>
                                    </div>
                                </div>
                                <span
                                    class="text-[7px] font-black text-purple-400 uppercase mt-4 tracking-widest">Pulang</span>
                            </div>

                            <div class="text-right w-1/3 opacity-60">
                                <p class="text-xl font-black text-slate-800 leading-none"
                                    x-text="bookingDetail.origin_code || bookingDetail.origin"></p>
                                <p class="text-[8px] text-slate-400 font-bold uppercase mt-1 truncate"
                                    x-text="bookingDetail.origin_port"></p>
                            </div>
                        </div>
                    </template>

                    <div class="grid grid-cols-2 gap-4 py-4 border-y border-slate-50">
                        <div>
                            <p class="text-[8px] text-slate-400 font-bold uppercase">Tanggal Pergi</p>
                            <p class="text-xs font-black text-slate-700"
                                x-text="bookingDetail ? new Date(bookingDetail.depart_date).toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) : ''">
                            </p>
                        </div>
                        <div class="text-right">
                            <p class="text-[8px] text-slate-400 font-bold uppercase">Penumpang</p>
                            <p class="text-xs font-black text-slate-700"
                                x-text="(bookingDetail ? bookingDetail.total_pax : '0') + ' Orang'"></p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="flex items-center gap-2">
                            <i data-lucide="users" class="w-3 h-3 text-slate-400"></i>
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Penumpang Utama
                            </p>
                        </div>
                        <div
                            class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 group">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-8 h-8 bg-white rounded-full flex items-center justify-center border border-slate-200 shadow-sm">
                                    <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                                </div>
                                <div>
                                    <p class="font-black text-slate-800 text-xs uppercase tracking-tight"
                                        x-text="bookingDetail ? (bookingDetail.main_pax_first + ' ' + (bookingDetail.main_pax_last || '')) : ''">
                                    </p>
                                    <p class="text-[8px] text-[#24b3ae] font-black uppercase">Dewasa / Terverifikasi</p>
                                </div>
                            </div>
                            <div class="bg-green-100 p-1 rounded-full">
                                <i data-lucide="check" class="w-3 h-3 text-green-600"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-900 rounded-2xl p-4 text-white">
                        <div class="flex justify-between items-center mb-2 text-slate-400">
                            <span class="text-[9px] font-black uppercase tracking-widest">Total Pembayaran</span>
                            <div class="flex items-center gap-1">
                                <i data-lucide="shield-check" class="w-3 h-3 text-green-400"></i>
                                <span class="text-[8px] font-bold uppercase text-green-400">Lunas</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-xs font-bold opacity-60">IDR</span>
                            <span class="text-2xl font-black text-white"
                                x-text="bookingDetail ? Number(bookingDetail.total_price).toLocaleString('id-ID') : '0'"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button @click="downloadTicket()"
                    class="flex flex-col items-center justify-center p-5 bg-white border-2 border-slate-100 rounded-[1.5rem] gap-2 shadow-sm active:scale-95 transition-all hover:border-[#24b3ae]/30">
                    <div class="p-3 bg-[#24b3ae]/10 rounded-full text-[#24b3ae]">
                        <i data-lucide="file-text" class="w-6 h-6"></i>
                    </div>
                    <span class="text-[10px] font-black uppercase text-slate-700 tracking-wider">Unduh PDF</span>
                </button>
                <button
                    class="flex flex-col items-center justify-center p-5 bg-white border-2 border-slate-100 rounded-[1.5rem] gap-2 shadow-sm active:scale-95 transition-all hover:border-[#24b3ae]/30">
                    <div class="p-3 bg-slate-100 rounded-full text-slate-600">
                        <i data-lucide="share-2" class="w-6 h-6"></i>
                    </div>
                    <span class="text-[10px] font-black uppercase text-slate-700 tracking-wider">Bagikan</span>
                </button>
            </div>

            <button @click="location.reload()"
                class="w-full py-6 text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] hover:text-[#24b3ae] transition-colors">
                Tutup & Kembali ke Riwayat
            </button>
        </div>
    </div>

    <div x-show="showConfirmModal" class="fixed inset-0 z-[120] flex items-center justify-center p-4" x-cloak>
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" @click="showConfirmModal = false"></div>
        <div x-show="showConfirmModal" x-transition:enter="transition ease-out duration-300 transform"
            x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
            class="relative bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 text-center overflow-hidden">
            <template x-if="isSaldoCukup">
                <div>
                    <div class="mb-6">
                        <div
                            class="w-20 h-20 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="alert-circle" class="w-10 h-10"></i>
                        </div>
                        <h3 class="text-2xl font-black text-slate-800 tracking-tighter uppercase">Konfirmasi Pembayaran
                        </h3>
                        <p class="text-slate-500 mt-2 text-sm">
                            Anda akan membayar sebesar <span class="font-bold text-slate-800"
                                x-text="new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(totalBayarJagel)"></span>.
                            Koin akan langsung terpotong.
                        </p>
                    </div>
                    <div class="flex flex-col gap-3">
                        <button @click="issueTicket()"
                            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl shadow-lg transition-all uppercase tracking-widest text-xs">
                            Ya, Bayar Sekarang
                        </button>

                        <button @click="showConfirmModal = false"
                            class="w-full bg-slate-100 text-slate-500 font-bold py-4 rounded-2xl transition-all uppercase tracking-widest text-xs">Batal</button>
                    </div>
                </div>
            </template>

            <template x-if="!isSaldoCukup">
                <div>
                    <div class="mb-6">
                        <div
                            class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="wallet" class="w-10 h-10"></i>
                        </div>
                        <h3 class="text-2xl font-black text-slate-800 tracking-tighter uppercase">Koin Tidak Cukup</h3>
                        <p class="text-slate-500 mt-2 text-sm">
                            Koin Anda kurang <span class="text-red-500 font-bold"
                                x-text="new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(saldoDibutuhkan)"></span>.
                        </p>
                    </div>
                    <div class="flex flex-col gap-3">

                        <a href="https://jgjk.mobi/m/6879ab2a8cd9b" target="_top"
                            class="block w-full bg-[#24b3ae] text-white font-black py-4 rounded-2xl shadow-lg transition-all active:scale-95 uppercase tracking-widest text-[10px] text-center">
                            Isi Koin Sekarang
                        </a> <button @click="showConfirmModal = false"
                            class="w-full bg-slate-100 text-slate-500 font-bold py-4 rounded-2xl transition-all uppercase tracking-widest text-xs">Nanti
                            Saja</button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script>
        function bookingApp() {
            return {
                pengguna: "amir",
                step: 'history',
                showConfirmModal: false,
                isSaldoCukup: false,
                totalBayarJagel: 0,
                saldoDibutuhkan: 0,
                loading: true,
                isProcessing: false,
                processText: "Menerbitkan tiket...",
                bookingDetail: null,
                urlDepositJagel: "https://jagel.id/deposit",
                toast: { show: false, message: "", type: "success" },

                showToast(msg, type = "success") {
                    this.toast.message = msg;
                    this.toast.type = type;
                    this.toast.show = true;
                    setTimeout(() => lucide.createIcons(), 10);
                    setTimeout(() => { this.toast.show = false; }, 3000);
                },

                async fetchHistory() {
                    const API_URL = `https://darma.siappgo.id/api/booking-history/user/${this.pengguna}`;
                    const container = document.getElementById('history-container');
                    try {
                        const response = await fetch(API_URL);
                        const result = await response.json();
                        if (result.status === "SUCCESS" && result.data.length > 0) {
                            container.innerHTML = "";

                            // Logika Grouping Transit (Berdasarkan booking_code yang sama)
                            const grouped = result.data.reduce((acc, current) => {
                                if (!acc[current.booking_code]) {
                                    acc[current.booking_code] = [];
                                }
                                acc[current.booking_code].push(current);
                                return acc;
                            }, {});

                            Object.values(grouped).forEach(bookings => {
                                container.appendChild(createCard(bookings));
                            });

                            lucide.createIcons();
                        } else {
                            container.innerHTML = `<div class="py-20 text-center text-gray-400">Belum ada riwayat.</div>`;
                        }
                    } catch (error) {
                        console.error(error);
                        container.innerHTML = `<div class="py-20 text-center text-red-500 text-xs font-bold">Gagal memuat data.</div>`;
                    } finally {
                        this.loading = false;
                    }
                },

                async prosesBayar(bookingCode) {
                    try {
                        const response = await fetch(`https://darma.siappgo.id/api/booking-history/user/${this.pengguna}`);
                        const result = await response.json();

                        const b = result.data.find(item => item.booking_code === bookingCode);
                        if (!b) {
                            return this.showToast("Data booking tidak ditemukan", "error");
                        }

                        this.bookingDetail = b;

                        // ✅ JIKA SUDAH TICKETED → LANGSUNG KE E-TICKET
                        if (b.ticket_status === 'TICKETED') {
                            this.step = 'e-ticket';
                            setTimeout(() => lucide.createIcons(), 100);
                            return;
                        }

                        // ✅ JIKA BELUM TICKETED → SIAPKAN MODAL KONFIRMASI
                        this.totalBayarJagel = Number(b.total_price);

                        // --- INTEGRASI PHP BRIDGE (CHECK BALANCE) ---
                        const resBal = await fetch('https://rtsindonesia.biz.id/adjust.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                action: 'check_balance',
                                value: this.pengguna
                            })
                        });

                        const dataSaldo = await resBal.json();

                        if (dataSaldo.success && dataSaldo.data) {
                            const saldoAktif = parseFloat(dataSaldo.data.balance_active) || 0;

                            this.isSaldoCukup = saldoAktif >= this.totalBayarJagel;
                            this.saldoDibutuhkan = this.isSaldoCukup
                                ? 0
                                : this.totalBayarJagel - saldoAktif;

                            // ✅ TAMPILKAN MODAL
                            this.showConfirmModal = true;
                            setTimeout(() => lucide.createIcons(), 50);
                        } else {
                            throw new Error(dataSaldo.message || "Gagal mengambil data saldo");
                        }

                    } catch (e) {
                        console.error(e);
                        this.showToast("Gagal memproses pembayaran: " + e.message, "error");
                    }
                },

                async issueTicket() {
                    this.showConfirmModal = false;
                    this.isProcessing = true;
                    this.processText = "Menerbitkan tiket...";

                    try {
                        const b = this.bookingDetail;
                        const formatToISO = (dateStr) => {
                            const d = new Date(dateStr);
                            return isNaN(d.getTime()) ? new Date().toISOString().split('.')[0] + "Z" : d.toISOString().split('.')[0] + "Z";
                        };

                        const payload = {
                            airlineID: b.airline_id || b.airline_name,
                            origin: b.origin,
                            destination: b.destination,
                            tripType: b.trip_type || "OneWay",
                            departDate: formatToISO(b.depart_date),
                            returnDate: b.return_date ? formatToISO(b.return_date) : formatToISO(b.depart_date),
                            bookingCode: b.booking_code,
                            bookingDate: formatToISO(b.created_at),
                            airlineAccessCode: b.airline_id || b.airline_name,
                            userID: b.user_id || "CF0X64HBR8",
                            accessToken: b.accessToken || b.access_token || ""
                        };

                        // 1. API Issued Darmawisata
                        const res = await fetch('https://darma.siappgo.id/api/flights/issued-ticket', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const result = await res.json();

                        if (result.status === "SUCCESS") {
                            this.processText = "Tiket Terbit! Memotong saldo...";

                            // 2. --- INTEGRASI PHP BRIDGE (ADJUST BALANCE) ---
                            const resAdjust = await fetch('https://rtsindonesia.biz.id/adjust.php', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    action: 'adjust_balance',
                                    value: this.pengguna,
                                    amount: -this.totalBayarJagel,
                                    note: `Issued ${b.booking_code} Berhasil`
                                })
                            });

                            const dataAdjust = await resAdjust.json();

                            if (dataAdjust.success) {
                                this.showToast("Tiket Berhasil Terbit!", "success");
                                this.bookingDetail.ticket_status = 'TICKETED';
                                this.step = 'e-ticket';
                                setTimeout(() => lucide.createIcons(), 100);
                            } else {
                                // Notif jika issued berhasil tapi potong saldo gagal (jarang terjadi tapi perlu antisipasi)
                                this.showToast("Tiket terbit, namun gagal update saldo: " + dataAdjust.message, "warning");
                            }

                        } else {
                            this.showToast("Gagal: " + (result.respMessage || "Booking data not found"), "error");
                        }
                    } catch (e) {
                        this.showToast("Error: " + e.message, "error");
                    } finally {
                        this.isProcessing = false;
                    }
                },

                async downloadTicket() {
                    // 1. Validasi Data Awal
                    const bCode = this.bookingDetail?.booking_code;
                    const ticketStatus = this.bookingDetail?.ticket_status;

                    if (ticketStatus !== 'TICKETED') {
                        return this.showToast("Tiket hanya bisa diunduh setelah status ISSUED/TICKETED", "warning");
                    }

                    if (!bCode) {
                        return this.showToast("Kode booking tidak ditemukan", "error");
                    }

                    // 2. State Loading
                    this.isProcessing = true;
                    this.processText = "Sedang menghubungkan ke server...";

                    try {
                        const downloadUrl = `https://darma.siappgo.id/api/flights/generate-ticket/${bCode}`;

                        // 3. Validasi HEAD (Opsional tapi Robust)
                        // Mengecek apakah file ada tanpa mendownload isinya, agar tidak redirect jika 404
                        const check = await fetch(downloadUrl, { method: 'HEAD' });
                        if (!check.ok) throw new Error("File tiket belum tersedia atau server sibuk.");

                        // 4. Implementasi Hidden Iframe
                        // Hapus iframe lama jika ada
                        let iframe = document.getElementById('hidden-download-iframe');
                        if (iframe) document.body.removeChild(iframe);

                        // Buat iframe baru
                        iframe = document.createElement('iframe');
                        iframe.id = 'hidden-download-iframe';

                        // Sembunyikan iframe sepenuhnya
                        Object.assign(iframe.style, {
                            display: 'none',
                            width: '0',
                            height: '0',
                            border: 'none',
                            visibility: 'hidden'
                        });

                        // Masukkan ke DOM
                        document.body.appendChild(iframe);

                        // 5. Pemicu Unduhan
                        // Mengubah src akan memicu WebView/Browser untuk mendownload secara native
                        iframe.src = downloadUrl;

                        this.showToast("Permintaan unduhan terkirim", "success");

                        // 6. Cleanup DOM
                        // Beri jeda lama agar jabat tangan (handshake) download selesai
                        setTimeout(() => {
                            if (document.body.contains(iframe)) {
                                document.body.removeChild(iframe);
                            }
                        }, 10000);

                    } catch (e) {
                        console.error("Download Error:", e);
                        this.showToast(e.message, "error");
                    } finally {
                        this.isProcessing = false;
                    }
                }
            }
        }

        function createCard(bookings) {
            const mainBooking = bookings[0];
            const timeLimit = new Date(mainBooking.time_limit);
            const now = new Date();

            // Perbaikan logika isExpired
            const isExpired = mainBooking.isExpired || (now > timeLimit && mainBooking.ticket_status !== 'TICKETED');

            // 1. Ambil payload request untuk cek tipe trip
            const payload = mainBooking.payload_request || {};
            const isRoundTrip = payload.tripType === "RoundTrip";

            // 2. Gabungkan rute pergi dan pulang
            let allSegments = bookings;
            if (isRoundTrip && payload.schReturns && payload.schReturns.length > 0) {
                const hasReturnInBookings = bookings.some(b => b.origin === payload.destination && b.destination === payload.origin);
                if (!hasReturnInBookings) {
                    const returnSegments = payload.schReturns.map(ret => ({
                        ...ret,
                        origin: ret.schOrigin,
                        destination: ret.schDestination,
                        jam_berangkat: ret.schDepartTime ? ret.schDepartTime.substring(11, 16) : '--:--',
                        jam_tiba: ret.schArrivalTime ? ret.schArrivalTime.substring(11, 16) : '--:--',
                        flight_number: (ret.airlineCode || mainBooking.airline_name) + ' ' + ret.flightNumber,
                        airline_name: mainBooking.airline_name,
                        flight_class: ret.flightClass,
                        depart_time: ret.schDepartTime // Penting untuk kalkulasi layover
                    }));
                    allSegments = [...bookings, ...returnSegments];
                }
            }

            const firstSegment = allSegments[0];
            const lastSegment = allSegments[allSegments.length - 1];

            const rawDate = firstSegment.depart_time ? firstSegment.depart_time.split('T')[0].split(' ')[0] : payload.departDate?.split('T')[0];
            const departDate = new Date(rawDate);
            const dateString = departDate.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });

            const div = document.createElement('div');
            div.className = `bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative transition-all mb-4 ${isExpired ? 'opacity-60 grayscale-[0.5]' : ''}`;

            let segmentsHtml = '';
            let returnTripStarted = false;

            // Helper: Hitung waktu transit (layover)
            const getLayover = (currentArr, nextDep) => {
                const diff = new Date(nextDep) - new Date(currentArr);
                const hours = Math.floor(diff / 3600000);
                const mins = Math.round((diff % 3600000) / 60000);
                return hours > 0 ? `${hours}j ${mins}m` : `${mins}m`;
            };

            allSegments.forEach((seg, idx) => {
                // DETEKSI PEMISAH PULANG (ROUNDTRIP)
                if (isRoundTrip && idx > 0 && !returnTripStarted) {
                    if (seg.origin === payload.destination || seg.schOrigin === payload.destination) {
                        returnTripStarted = true;
                        segmentsHtml += `
                    <div class="flex items-center gap-2 my-3 opacity-60">
                        <div class="h-[1px] flex-1 bg-dashed border-gray-300"></div>
                        <div class="flex items-center gap-1.5 px-2 py-0.5 bg-purple-50 rounded-full">
                            <i data-lucide="refresh-cw" class="w-2.5 h-2.5 text-purple-400"></i>
                            <span class="text-[7px] font-black uppercase tracking-widest text-purple-600">Penerbangan Pulang</span>
                        </div>
                        <div class="h-[1px] flex-1 bg-dashed border-gray-300"></div>
                    </div>`;
                    }
                }

                // DETEKSI TRANSIT (LAYOVER) - Hanya jika dalam rangkaian rute yang sama
                if (idx > 0 && !returnTripStarted && allSegments[idx - 1].destination === seg.origin) {
                    const layoverTime = getLayover(allSegments[idx - 1].arrival_time || allSegments[idx - 1].schArrivalTime, seg.depart_time || seg.schDepartTime);
                    segmentsHtml += `
                <div class="ml-14 my-1 flex items-center gap-2">
                    <div class="w-1 h-1 rounded-full bg-orange-400"></div>
                    <span class="text-[8px] font-bold text-orange-500 uppercase tracking-tighter">Transit di ${seg.origin} (${layoverTime})</span>
                </div>`;
                }

                segmentsHtml += `
        <div class="flex items-center gap-3 ${idx !== 0 && !returnTripStarted ? 'mt-3 pt-3 border-t border-gray-50' : (idx > 0 ? 'mt-2' : '')}">
            <div class="flex flex-col items-center min-w-[45px] border-r border-gray-100 pr-2">
                <span class="text-[10px] font-black text-primary leading-none">${seg.jam_berangkat || '--:--'}</span>
                <div class="w-[1px] h-2 bg-gray-200 my-0.5"></div>
                <span class="text-[10px] font-black text-gray-400 leading-none">${seg.jam_tiba || '--:--'}</span>
            </div>
            <div class="flex flex-col items-center">
                 <div class="w-1.5 h-1.5 rounded-full bg-primary"></div>
                 <div class="w-[1px] h-3 bg-gray-200 my-0.5"></div>
                 <div class="w-1.5 h-1.5 rounded-full border border-primary"></div>
            </div>
            <div class="flex-1">
                <div class="flex justify-between items-center">
                    <p class="text-[10px] font-black text-gray-800">${seg.origin_code || seg.origin} → ${seg.destination_code || seg.destination}</p>
                    <p class="text-[9px] text-gray-400 font-bold">${seg.flight_number}</p>
                </div>
                <div class="flex justify-between items-center">
                    <p class="text-[8px] text-gray-400 uppercase tracking-tighter">${seg.airline_name}</p>
                    <p class="text-[8px] text-primary font-bold">Class ${seg.flight_class || 'Eco'}</p>
                </div>
            </div>
        </div>`;
            });

            let tripBadge = isRoundTrip
                ? `<span class="bg-purple-50 text-purple-600 text-[8px] font-bold px-1.5 py-0.5 rounded">PULANG-PERGI</span>`
                : (allSegments.length > 1 ? `<span class="bg-orange-50 text-orange-500 text-[8px] font-bold px-1.5 py-0.5 rounded">${allSegments.length - 1} TRANSIT</span>` : `<span class="bg-emerald-50 text-emerald-600 text-[8px] font-bold px-1.5 py-0.5 rounded">ONE WAY</span>`);

            // Tombol Aksi
            let actionButton = '';
            if (mainBooking.ticket_status === 'TICKETED') {
                actionButton = `<button onclick="window.app.prosesBayar('${mainBooking.booking_code}')" class="bg-slate-800 text-white px-5 py-2.5 rounded-xl text-[10px] font-black shadow-lg active:scale-95 transition-all flex items-center gap-2 uppercase tracking-widest"><i data-lucide="ticket" class="w-3 h-3 text-green-400"></i>LIHAT TIKET</button>`;
            } else if (isExpired) {
                actionButton = `<button disabled class="bg-gray-200 text-gray-400 px-5 py-2.5 rounded-xl text-[10px] font-black cursor-not-allowed flex items-center gap-2 uppercase tracking-widest"><i data-lucide="clock-alert" class="w-3 h-3"></i>EXPIRED</button>`;
            } else {
                actionButton = `<button onclick="window.app.prosesBayar('${mainBooking.booking_code}')" class="bg-primary text-white px-5 py-2.5 rounded-xl text-[10px] font-black shadow-lg shadow-[#24b3a3]/20 active:scale-95 transition-all flex items-center gap-2 uppercase tracking-widest"><i data-lucide="credit-card" class="w-3 h-3"></i>BAYAR</button>`;
            }

            div.innerHTML = `
        <div class="flex justify-between items-center p-3 border-b border-dashed border-gray-100 bg-gray-50/30">
            <div class="flex items-center gap-2">
                <span class="${mainBooking.ticket_status === 'TICKETED' ? 'bg-blue-50 text-blue-600' : (isExpired ? 'bg-red-50 text-red-400' : 'bg-green-50 text-green-600')} text-[9px] font-black px-1.5 py-0.5 rounded uppercase tracking-wider">
                    ${isExpired ? 'EXPIRED' : mainBooking.ticket_status}
                </span>
                <span class="text-[9px] text-gray-400 font-mono">#${mainBooking.booking_code}</span>
                ${tripBadge}
            </div>
            <div class="text-[9px] font-bold ${isExpired ? 'text-red-500' : 'color-secondary'} ">
                ${mainBooking.ticket_status === 'TICKETED' ? 'Tiket Terbit' : (isExpired ? 'Waktu Habis' : 'Batas: ' + (mainBooking.formattedLimit ? mainBooking.formattedLimit.split(',')[1] : '-'))}
            </div>
        </div>

        <div class="p-4">
            <div class="flex justify-between items-center mb-4 relative">
                <div class="text-left">
                    <p class="text-2xl font-black text-gray-800 leading-none">${payload.origin || firstSegment.origin}</p>
                    <p class="text-[9px] text-gray-400 font-bold uppercase mt-1 truncate max-w-[80px]">${mainBooking.origin_port || 'Origin'}</p>
                </div>
                <div class="flex-1 px-4 flex flex-col items-center justify-center">
                    <i data-lucide="${isRoundTrip ? 'arrow-left-right' : 'plane'}" class="w-5 h-5 color-primary ${isRoundTrip ? '' : 'rotate-90'} mb-1"></i>
                    <div class="w-full h-[1px] bg-dashed relative"></div>
                </div>
                <div class="text-right">
                    <p class="text-2xl font-black text-gray-800 leading-none">${isRoundTrip ? (payload.origin || firstSegment.origin) : (payload.destination || lastSegment.destination)}</p>
                    <p class="text-[9px] text-gray-400 font-bold uppercase mt-1 truncate max-w-[80px]">${isRoundTrip ? mainBooking.origin_port : (mainBooking.destination_port || 'Destination')}</p>
                </div>
            </div>

            <div class="bg-gray-50 rounded-xl p-3 mb-4 border border-gray-100/50">
                 <div class="flex justify-between items-center mb-3">
                    <p class="text-[8px] text-gray-400 font-black uppercase tracking-widest">Rincian Perjalanan</p>
                    <span class="text-[9px] text-gray-500 font-black bg-white px-2 py-0.5 rounded-full border border-gray-100">${dateString}</span>
                 </div>
                 ${segmentsHtml}
            </div>

            <div class="flex items-center justify-between border-t border-gray-50 pt-3">
                <div class="flex items-center gap-1.5 text-[10px] text-gray-500">
                    <div class="p-1 bg-gray-100 rounded"><i data-lucide="calendar" class="w-3 h-3 text-gray-400"></i></div>
                    <span class="font-bold">${dateString}</span>
                </div>
                <div class="flex items-center gap-1.5 text-[10px] text-gray-500">
                    <div class="p-1 bg-gray-100 rounded"><i data-lucide="users" class="w-3 h-3 text-gray-400"></i></div>
                    <span class="font-black uppercase">${mainBooking.total_pax || 1} PENUMPANG</span>
                </div>
            </div>
        </div>

        <div class="bg-gray-50/50 p-3 flex justify-between items-center border-t border-gray-50">
            <div>
                <p class="text-[8px] text-gray-400 uppercase font-bold leading-none mb-1 tracking-widest">Total Bayar</p>
                <p class="text-lg font-black color-primary leading-none">Rp${Number(mainBooking.total_price).toLocaleString('id-ID')}</p>
            </div>
            ${actionButton}
        </div>`;

            if (window.lucide) setTimeout(() => window.lucide.createIcons({ node: div }), 10);
            return div;
        }
    </script>
</body>

</html>
