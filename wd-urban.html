    <title>Halaman Penarikan</title>
    <style>
        #content {
            display: none;
            /* Menyembunyikan konten utama */
        }

        #accessDenied {
            display: none;
            /* Menyembunyikan pesan akses ditolak */
            color: red;
            text-align: center;
            margin-top: 20px;
        }
    </style>
    <script>
        // Fungsi untuk memeriksa waktu akses
        function checkAccessTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const currentTime = hours * 60 + minutes; // Menghitung waktu dalam menit

            // Mengatur waktu mulai dan waktu akhir dalam menit
            const openingTime = 0 * 60; // 06:00
            const closingTime = 24 * 60; // 24:00

            // Memeriksa apakah waktu saat ini berada dalam jam operasional
            if (currentTime < openingTime || currentTime >= closingTime) {
                document.getElementById('accessDenied').style.display = 'block'; // Menampilkan pesan akses ditolak
            } else {
                document.getElementById('content').style.display = 'block'; // Menampilkan konten utama
            }
        }

        // Memanggil fungsi saat halaman dimuat
        window.onload = checkAccessTime;
    </script>
