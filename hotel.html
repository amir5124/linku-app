<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] {
            display: none !important
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none
        }

        @keyframes bounce-custom {

            0%,
            100% {
                transform: translateY(-10px);
                opacity: .5
            }

            50% {
                transform: translateY(0);
                opacity: 1
            }
        }

        .dot-pulse {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #24b3ae;
            border-radius: 50%;
            animation: wave 1.2s infinite ease-in-out
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s
        }

        @keyframes wave {

            0%,
            60%,
            100% {
                transform: translateY(0)
            }

            30% {
                transform: translateY(-10px)
            }
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden
        }
    </style>
</head>

<body class="bg-gray-100 font-sans">
    <div x-data="hotelApp()" x-init="init()" x-cloak>
        <div class="fixed top-5 left-1/2 -translate-x-1/2 z-[600] w-full max-w-xs space-y-2 px-4"><template
                x-for="toast in toasts" :key="toast.id">
                <div x-transition:enter="transition ease-out duration-300"
                    x-transition:enter-start="opacity-0 transform -translate-y-2"
                    x-transition:enter-end="opacity-100 transform translate-y-0"
                    x-transition:leave="transition ease-in duration-200"
                    x-transition:leave-start="opacity-100 transform translate-y-0"
                    x-transition:leave-end="opacity-0 transform -translate-y-2"
                    class="bg-slate-800 text-white p-4 rounded-2xl shadow-2xl flex items-center gap-3 border-l-4 border-orange-500">
                    <i data-lucide="alert-circle" class="w-5 h-5 text-orange-400"></i>
                    <p class="text-[11px] font-bold uppercase tracking-tight" x-text="toast.message"></p>
                </div>
            </template></div>
        <div x-show="loading" x-cloak
            class="fixed inset-0 bg-black/75 flex flex-col items-center justify-center z-[500] font-bold text-center p-6">
            <div class="dot-pulse mb-4">
                <div class="dot !bg-white"></div>
                <div class="dot !bg-white"></div>
                <div class="dot !bg-white"></div>
            </div>
            <p class="text-white text-[12px] tracking-widest uppercase ">Mohon tunggu...</p>
        </div>
        <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-2xl relative overflow-hidden"><template
                x-if="stage === 'search'">
                <div class="pb-10">
                    <div class="relative h-60 bg-[#24b3ae]"><img
                            src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=500&q=80"
                            class="w-full h-full object-cover opacity-70">
                        <div class="absolute bottom-16 left-6 text-white">
                            <h1 class="text-2xl font-bold uppercase tracking-tighter">Booking Hotel</h1>
                            <p class="text-[12px] opacity-90">Cari penginapan terbaik di seluruh dunia</p>
                        </div>
                    </div>
                    <div class="relative -mt-10 px-4">
                        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                            <div class="flex border-b"><button @click="searchTab = 'by_city'"
                                    :class="searchTab === 'by_city' ? 'flex-1 py-3 text-[12px] font-bold text-[#24b3ae] border-b-2 border-[#24b3ae] bg-teal-50/60 transition-all' : 'flex-1 py-3 text-[12px] font-semibold text-slate-400 hover:text-slate-600 transition-all'"><i
                                        data-lucide="map-pin" class="w-4 h-4 inline mr-1 mb-0.5"></i> Cari Kota
                                </button><button @click="searchTab = 'by_name'"
                                    :class="searchTab === 'by_name' ? 'flex-1 py-3 text-[12px] font-bold text-[#24b3ae] border-b-2 border-[#24b3ae] bg-teal-50/60 transition-all' : 'flex-1 py-3 text-[12px] font-semibold text-slate-400 hover:text-slate-600 transition-all'"><i
                                        data-lucide="search" class="w-4 h-4 inline mr-1 mb-0.5"></i> Cari Nama Hotel
                                </button></div>
                            <div class="p-6 space-y-6"><template x-if="searchTab === 'by_city'">
                                    <div class="space-y-6">
                                        <div class="border-b pb-3">
                                            <div class="flex justify-between items-center"><label
                                                    class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                                                    Pilih Destinasi </label><a href="https://jgjk.mobi/m/69a7e46c788f9"
                                                    class="flex items-center gap-1 text-[#24b3ae] hover:opacity-80 transition"><i
                                                        data-lucide="history" class="w-6 h-6"></i></a></div>
                                            <div x-on:click="openModal('destination')"
                                                class="flex items-center gap-3 mt-1 cursor-pointer">
                                                <div class="flex items-center gap-3 text-[#24b3ae] font-bold"><i
                                                        data-lucide="map-pin" class="w-5 h-5"></i><span
                                                        class="text-slate-700 text-[14px]"
                                                        x-text="search.cityName || 'Pilih kota tujuan'"></span></div>
                                            </div>
                                        </div>
                                        <div class="grid grid-cols-2 gap-4">
                                            <div x-on:click="openModal('date')" class="border-b pb-3 cursor-pointer">
                                                <label
                                                    class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Check-In</label>
                                                <div class="flex items-center gap-2 mt-1"><i data-lucide="calendar"
                                                        class="w-4 h-4 text-slate-400"></i><span
                                                        class="font-bold text-slate-700 text-[12px]"
                                                        x-text="formatDisplayDate(search.checkInDate)"></span></div>
                                            </div>
                                            <div x-on:click="openModal('duration')"
                                                class="border-b pb-3 cursor-pointer"><label
                                                    class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Durasi</label>
                                                <div
                                                    class="flex items-center gap-2 mt-1 font-bold text-slate-700 text-[12px] underline decoration-blue-200">
                                                    <span class="text-[12px]"
                                                        x-text="search.duration + ' Malam'"></span></div>
                                            </div>
                                        </div>
                                        <div x-on:click="openModal('guest')" class="border-b pb-3 cursor-pointer"><label
                                                class="text-[12px] text-slate-400 font-bold uppercase tracking-wider">Kamar
                                                & Tamu</label>
                                            <div class="flex items-center gap-3 mt-1 text-slate-400"><i
                                                    data-lucide="users" class="w-5 h-5"></i><span
                                                    class="font-bold text-slate-700 text-[12px]"
                                                    x-text="getGuestSummary()"></span></div>
                                        </div><button x-on:click="performSearch()"
                                            class="w-full bg-[#24b3ae] h-14 rounded-[15px] text-white font-bold text-[14px] shadow-lg transition-all active:scale-95 uppercase">
                                            Cari Sekarang </button>
                                    </div>
                                </template></div>
    </div>
    </div>
    </div>
    </template><template x-if="stage === 'results'">
        <div class="bg-gray-100 min-h-screen">
            <div
                class="fixed top-0 left-0 right-0 bg-[#24b3ae] text-white p-4 z-[100] shadow-md flex items-center gap-3 max-w-md mx-auto">
                <button x-on:click="stage = 'search'" class="p-1 hover:bg-[#21a19d] rounded-full transition"><i
                        data-lucide="arrow-left" class="w-6 h-6"></i></button>
                <div class="flex-1">
                    <h2 class="font-bold text-base leading-tight text-white"
                        x-text="search.cityName + ': ' + hotelList.length + ' Properti'"></h2>
                    <p class="text-[10px] opacity-90"
                        x-text="formatDisplayDate(search.checkInDate) + ' • ' + search.duration + ' Malam'"></p>
                </div>
            </div>
            <div class="pt-16"></div>
            <div class="px-3 space-y-4 pt-4 pb-10"><template x-if="loading && displayedHotels.length === 0">
                    <div class="space-y-4"><template x-for="i in 5" :key="i">
                            <div class="bg-white rounded-xl overflow-hidden shadow-sm animate-pulse">
                                <div class="h-48 bg-gray-200"></div>
                                <div class="p-4 space-y-3">
                                    <div class="h-5 bg-gray-200 rounded w-3/4"></div>
                                    <div class="h-3 bg-gray-100 rounded w-1/2"></div>
                                    <div class="h-10 bg-gray-200 rounded mt-4"></div>
                                </div>
                            </div>
                        </template></div>
                </template><template x-for="(hotel, index) in displayedHotels" :key="index">
                    <div x-on:click="getAvailableRooms(hotel)"
                        class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 cursor-pointer active:scale-[0.98] transition-all">
                        <div class="relative h-48"><img
                                :src="'https://uat-backup.darmawisataindonesiah2h.co.id:7080/h2h/hotel/logo?id=' + (hotel.logo.includes('id=') ? hotel.logo.split('id=')[1] : hotel.logo)"
                                class="w-full h-full object-cover bg-gray-200"
                                @error="$el.src='https://via.placeholder.com/400x200?text=Image+Not+Found'"><template
                                x-if="hotel.promoCode">
                                <div
                                    class="absolute top-3 left-3 bg-red-600 text-white text-[10px] px-2 py-1 rounded font-black shadow-lg">
                                    PROMO: <span class="text-[12px]" x-text="hotel.promoCode"></span></div>
                            </template></div>
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="font-bold text-slate-800 text-lg leading-tight flex-1" x-text="hotel.name">
                                </h3>
                                <div class="text-right ml-2 text-[#24b3ae] font-bold text-base"
                                    x-text="hotel.ratingAverage || '9.0'"></div>
                            </div>
                            <p class="text-[11px] text-slate-500 mb-2 truncate" x-text="hotel.address"></p>
                            <p class="text-[11px] text-slate-400 line-clamp-2 leading-relaxed mb-3"
                                x-text="hotel.message"></p>
                            <div class="border-t border-dashed pt-3 text-right">
                                <p class="text-xl font-black text-[#24b3ae]"
                                    x-text="'Rp ' + Math.round(hotel.priceStart).toLocaleString('id-ID')"></p>
                                <p class="text-[8px] text-slate-400 mt-1 uppercase font-bold">Termasuk Pajak</p>
                            </div>
                        </div>
                    </div>
                </template>
                <div id="load-more-trigger" class="py-10 flex flex-col items-center justify-center"><template
                        x-if="hasMore">
                        <div class="flex flex-col items-center gap-2">
                            <div class="w-6 h-6 border-2 border-gray-300 border-t-[#24b3ae] rounded-full animate-spin">
                            </div><span class="text-[10px] text-gray-400 italic">Memuat lebih banyak
                                properti...</span>
                        </div>
                    </template><template x-if="!hasMore && hotelList.length > 0">
                        <div class="text-center">
                            <div class="w-1 h-1 bg-gray-300 rounded-full mx-auto mb-2"></div>
                            <p class="text-[10px] text-gray-400 italic">Semua properti telah ditampilkan</p>
                        </div>
                    </template></div>
            </div>
        </div>
    </template><template x-if="stage === 'detail'">
        <div class="bg-white min-h-screen pb-32 overflow-y-auto no-scrollbar">
            <div class="relative h-64"><img
                    :src="'https://uat-backup.darmawisataindonesiah2h.co.id:7080/h2h/hotel/logo?id=' + (selectedHotel.logo.includes('id=') ? selectedHotel.logo.split('id=')[1] : selectedHotel.logo)"
                    class="w-full h-full object-cover shadow-inner bg-gray-200"
                    @error="$el.src='https://via.placeholder.com >/600x400?text=Image+Not+Found'">
                <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
                <div class="absolute top-4 left-4"><button x-on:click="stage = 'results'"
                        class="p-2 bg-black/40 backdrop-blur-md rounded-full text-white shadow-lg transition active:scale-90"><i
                            data-lucide="arrow-left" class="w-5 h-5"></i></button></div>
            </div>
            <div class="p-4 -mt-6 relative bg-white rounded-t-3xl border-t shadow-2xl">
                <h1 class="text-xl font-bold text-slate-800" x-text="selectedHotel.name"></h1>
                <div class="mt-4 p-3 bg-slate-50 rounded-xl border">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Tentang
                        Hotel</h4>
                    <div class="relative">
                        <p class="text-[11px] text-slate-600 leading-relaxed transition-all duration-300"
                            :class="showFullMessage ? '' : 'line-clamp-3'" x-html="selectedHotel.message"></p>
                        <button x-on:click="showFullMessage = !showFullMessage"
                            class="text-[11px] font-bold text-[#e03f7d] mt-1 flex items-center gap-1"><span
                                x-text="showFullMessage ? 'Sembunyikan' : 'Lihat Selengkapnya'"></span><i
                                data-lucide="chevron-down" class="w-3 h-3 transition-transform duration-300"
                                :class="showFullMessage ? 'rotate-180' : ''"></i></button>
                    </div>
                </div>
                <div class="mt-6 space-y-4">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b pb-1">
                        Fasilitas Utama</h4>
                    <div class="grid grid-cols-2 gap-3"><template x-for="group in selectedHotel.facility"
                            :key="group.facilityGroupName">
                            <div class="flex items-start gap-2"><i data-lucide="check-circle"
                                    class="w-3 h-3 text-green-500 mt-0.5"></i><span
                                    class="text-[10px] text-slate-600 font-bold"
                                    x-text="group.facilityGroupName"></span></div>
                        </template></div>
                </div>
            </div>
            <div class="bg-[#e03f7d] p-4 text-[#fff] text-xs uppercase tracking-widest border-y"> Kamar Tersedia
            </div>
            <div class="p-4 space-y-6"><template x-for="room in roomList" :key="room.ID">
                    <div class="bg-white border border-slate-100 rounded-3xl overflow-hidden shadow-sm">
                        <div class="relative h-44"><img
                                :src="'https://darma.siappgo.id/api/hotels/room-image?RoomID=' + selectedHotel.ID.split('~')[0] + '-' + room.ID.split('|')[0]"
                                class="w-full h-full object-cover bg-slate-50"
                                @error="$el.src='https://via.placeholder.com/300x200?text=No+Room+Image'">
                            <div class="absolute bottom-3 left-3 bg-white/90 px-3 py-1 rounded-full text-[10px] font-black shadow-sm"
                                x-text="room.breakfast"></div>
                        </div>
                        <div class="p-5">
                            <h4 class="font-bold text-slate-800 text-[12px] uppercase mb-4" x-text="room.name">
                            </h4>
                            <div class="flex justify-between items-end border-t pt-4 border-dashed">
                                <div class="flex-1 pr-4">
                                    <div class="flex flex-wrap gap-1"><template
                                            x-for="(fac, fIdx) in (room.facilites || []).slice(0, 4)" :key="fIdx"><span
                                                class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-[9px] font-bold uppercase tracking-tighter"
                                                x-text="fac"></span></template></div>
                                </div>
                                <div class="text-right shrink-0">
                                    <p class="text-xl font-black text-[#24b3ae]"
                                        x-text="'Rp ' + room.price.toLocaleString('id-ID')"></p><button
                                        x-on:click="openBookingPage(room)"
                                        class="mt-2 bg-[#24b3ae] text-white px-8 py-2.5 rounded-xl font-black text-xs active:scale-95 uppercase tracking-widest">Pilih</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template></div>
        </div>
    </template><template x-if="stage === 'booking'">
        <div class="bg-gray-50 min-h-screen pb-32 overflow-y-auto no-scrollbar">
            <div
                class="fixed top-0 left-0 right-0 bg-[#24b3ae] text-white p-4 z-[110] shadow-md flex items-center gap-3 max-w-md mx-auto">
                <button x-on:click="stage = 'detail'" class="p-1 hover:bg-[#24b3ae] rounded-full transition"><i
                        data-lucide="arrow-left" class="w-6 h-6"></i></button>
                <h2 class="font-black text-[12px] uppercase tracking-widest flex-1">Konfirmasi Pesanan</h2>
            </div>
            <div class="pt-14"></div>
            <div class="p-4 space-y-4">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                    <h3 class="font-black text-xs text-[#24b3ae] uppercase mb-2" x-text="selectedHotel.name">
                    </h3>
                    <div class="bg-slate-50 p-4 rounded-2xl border border-dashed border-slate-200">
                        <p class="text-[11px] font-black text-slate-700 uppercase" x-text="selectedRoom.name">
                        </p>
                        <div class="flex justify-between mt-2 text-[10px] font-bold text-slate-500 uppercase">
                            <span>Check-in</span><span class="text-[12px]"
                                x-text="formatDisplayDate(search.checkInDate)"></span>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                    <h3 class="font-black text-xs text-slate-800 uppercase">Kontak Pemesan</h3>
                    <div class="space-y-3"><input type="email" x-model="bookingData.contactEmail"
                            placeholder="Email (Wajib Diisi)"
                            class="w-full bg-slate-50 border rounded-2xl p-3 text-[12px] font-bold outline-none focus:border-[#24b3ae]"><input
                            type="text" x-model="bookingData.contactPhone" placeholder="Nomor WA (Wajib Diisi)"
                            class="w-full bg-slate-50 border rounded-2xl p-3 text-[12px] font-bold outline-none focus:border-[#24b3ae]">
                    </div>
                </div><template x-for="(pax, pIdx) in bookingData.paxes" :key="pIdx">
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                        <h3 class="font-black text-xs text-[#24b3ae] uppercase" x-text="'Informasi Tamu ' + (pIdx + 1)">
                        </h3>
                        <div class="grid grid-cols-3 gap-2"><select x-model="pax.title"
                                class="bg-slate-50 border rounded-xl p-2.5 text-xs font-bold outline-none uppercase">
                                <option value="Mr.">Mr.</option>
                                <option value="Mrs.">Mrs.</option>
                                <option value="Ms.">Ms.</option>
                            </select><input type="text" x-model="pax.firstName" placeholder="Nama Depan *"
                                class="col-span-2 bg-slate-50 border rounded-xl p-2.5 text-xs font-bold outline-none uppercase tracking-tighter">
                        </div><input type="text" x-model="pax.lastName" placeholder="Nama Belakang *"
                            class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold outline-none uppercase tracking-tighter">
                    </div>
                </template>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="font-black text-xs text-slate-800 uppercase">Biaya Penanganan</h3><span
                            class="text-[9px] bg-slate-100 text-slate-500 px-2 py-1 rounded-full font-bold">OPSIONAL</span>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><span
                                class="text-slate-400 font-black text-xs">Rp</span></div><input type="number"
                            x-model.number="inputHandlingFee" placeholder="Masukkan nominal jika ada..."
                            class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-3 pl-10 pr-4 text-[12px] font-bold outline-none focus:border-[#24b3ae] transition-colors">
                    </div>
                    <p class="text-[9px] text-slate-400 font-medium">Biaya ini akan ditambahkan ke total
                        potongan saldo Anda.</p>
                </div>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100"><textarea
                        x-model="bookingData.requestDescription"
                        class="w-full bg-slate-50 border rounded-2xl p-4 text-[11px] outline-none h-20 font-bold"
                        placeholder="Permintaan khusus..."></textarea></div>
            </div>
            <div
                class="fixed bottom-0 max-w-md w-full bg-white border-t p-4 flex justify-between items-center z-[110] shadow-[0_-4px_20px_rgba(0,0,0,0.1)]">
                <div class="flex flex-col"><span
                        class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Total
                        Harga</span><span class="text-xl font-black text-[#e03f7d]"
                        x-text="'Rp ' + totalBayarDisplay.toLocaleString('id-ID')"></span><span
                        class="text-[8px] text-slate-400 italic">*Sudah termasuk PPN & Biaya Penanganan</span>
                </div><button @click="showConfirmModal = true; setTimeout(() => lucide.createIcons(), 50);"
                    class="bg-[#24b3ae] text-white px-10 py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl active:scale-95 transition-transform">
                    Booking </button>
            </div>
        </div>
    </template>
    <div x-show="modals.destination" class="fixed inset-0 z-[150] bg-white flex flex-col" x-transition x-cloak>
        <div class="p-4 border-b flex items-center gap-4"><i x-on:click="modals.destination = false"
                data-lucide="arrow-left" class="cursor-pointer"></i>
            <div class="relative flex-1"><i data-lucide="search"
                    class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i><input type="text"
                    placeholder="Mau menginap di mana?"
                    class="w-full bg-slate-100 rounded-full pl-10 pr-4 py-2 outline-none uppercase font-black text-xs tracking-tighter">
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-4"><template x-for="dest in popularDests" :key="dest.cityID">
                <div x-on:click="selectDestination(dest)"
                    class="flex justify-between items-center py-4 border-b border-slate-50 cursor-pointer hover:bg-slate-50 rounded-xl px-2">
                    <div class="flex items-center gap-4">
                        <div class="bg-[#24b3ae] p-2.5 rounded-xl"><i
                                :data-lucide="dest.type === 'CITY' ? 'building-2' : 'map'"
                                class="w-5 h-5 text-[#fff]"></i></div>
                        <div>
                            <p class="font-black text-slate-800 uppercase tracking-tighter" x-text="dest.name">
                            </p>
                            <p class="text-[9px] text-slate-400 uppercase font-black" x-text="dest.sub"></p>
                        </div>
                    </div><span

    <script>
        function hotelApp() {
            return {
                stage: 'search',
                loading: !1,
                loadingText: '',
                showFullMessage: !1,
                modals: {
                    destination: !1,
                    date: !1,
                    duration: !1,
                    guest: !1
                },
                showConfirmModal: !1,
                searchTab: 'by_city',
                search: {
                    cityID: '10779',
                    cityName: 'Surabaya',
                    checkInDate: '',
                    duration: 1,
                    adultCount: 1,
                    roomCount: 1,
                    roomType: 1, // Default: 1 untuk Double, 0 untuk Single
                    roomTypeName: 'Double'
                },
                searchByNameQuery: '',
                searchByNameResults: [],
                searchByNameLoading: !1,
                searchByNameHasSearched: !1,
                hotelList: [],
                displayedHotels: [],
                itemsPerPage: 10,
                currentPage: 1,
                inputHandlingFee: 0,
                hasMore: !1,
                selectedHotel: {},
                roomList: [],
                selectedRoom: null,
                bookingData: {
                    contactEmail: '',
                    contactPhone: '',
                    requestDescription: '',
                    paxes: []
                },
                bookingResult: null,
                biayaAdminJagel: 0,
                isSaldoCukup: !0,
                saldoDibutuhkan: 0,
                totalBayarJagel: 0,
                toast: {
                    show: !1,
                    message: ''
                },
              
                calendarMonths: [],
                init() {
                    const t = new Date();
                    t.setDate(t.getDate() + 1);
                    this.search.checkInDate = t.toISOString().split('T')[0];
                    this.generateCalendar(6);
                    this.refreshIcons()
                },
                refreshIcons() {
                    this.$nextTick(() => {
                        try {
                            lucide.createIcons()
                        } catch (e) { }
                    })
                },
                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.show = !0;
                    setTimeout(() => {
                        this.toast.show = !1
                    }, 3500)
                },
                openModal(k) {
                    this.modals[k] = !0;
                    this.refreshIcons()
                },
                formatDisplayDate(d) {
                    if (!d) return '';
                    return new Date(d).toLocaleDateString('id-ID', {
                        day: 'numeric',
                        month: 'short',
                        year: 'numeric'
                    })
                },
                getCheckOutDate(dur) {
                    let d = new Date(this.search.checkInDate);
                    d.setDate(d.getDate() + parseInt(dur));
                    return this.formatDisplayDate(d)
                },
                getGuestSummary() {
                    return `${this.search.roomCount} Kamar, ${this.search.adultCount} Dws, ${this.search.childCount} Anak`
                },
                buildDateRange() {
                    const checkIn = this.search.checkInDate + "T14:00:00Z";
                    let out = new Date(this.search.checkInDate);
                    out.setDate(out.getDate() + parseInt(this.search.duration));
                    const checkOut = out.toISOString().split('T')[0] + "T12:00:00Z";
                    return {
                        checkIn,
                        checkOut
                    }
                },
                buildRoomRequest(withPaxes = !1) {
                    const roomCount = parseInt(this.search.roomCount) || 1;
                    return Array.from({
                        length: roomCount
                    }, (_, i) => {
                        let paxesData = [];
                        if (withPaxes) {
                            if (this.bookingData.paxes && Array.isArray(this.bookingData.paxes[i])) {
                                paxesData = this.bookingData.paxes[i]
                            } else if (i === 0 && Array.isArray(this.bookingData.paxes)) {
                                paxesData = this.bookingData.paxes
                            }
                        }
                        return {
                            paxes: paxesData,
                            isSmokingRoom: Boolean(this.bookingData.isSmokingRoom),
                            phone: withPaxes ? String(this.bookingData.contactPhone || "08123456789") : "08123456789",
                            email: withPaxes ? String(this.bookingData.contactEmail || "guest@mail.com") : "guest@mail.com",
                            specialRequestArray: [],
                            requestDescription: this.bookingData.requestDescription || "",
                            roomType: this.search.roomType,
                            isRequestChildBed: !1,
                            childNum: i === 0 ? (parseInt(this.search.childCount) || 0) : 0,
                            childAges: i === 0 ? (this.search.childAges ? this.search.childAges.map(Number) : [0]) : [0]
                        }
                    })
                },
                calculateCheckOutDate() {
                    const date = new Date(this.search.checkInDate);
                    date.setDate(date.getDate() + parseInt(this.search.duration));
                    return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                },

                openRoomTypeModal() {
                    // Sederhananya, kita bisa gunakan prompt atau toggle untuk demo ini
                    // Atau buatkan modal Alpine khusus untuk pilihan Double/Single
                    const types = [{ id: 1, name: 'Double' }, { id: 0, name: 'Single' }];
                    // Contoh toggle sederhana:
                    this.search.roomType = this.search.roomType === 1 ? 0 : 1;
                    this.search.roomTypeName = this.search.roomType === 1 ? 'Double' : 'Single';
                    this.showToast("Tipe kamar diganti ke " + this.search.roomTypeName);
                },
                get totalBayarDisplay() {
                    if (!this.selectedRoom) return 0;
                    return Math.round(this.selectedRoom.price) + this.inputHandlingFee
                },
                generateCalendar(count) {
                    const months = [];
                    const now = new Date();
                    for (let i = 0; i < count; i++) {
                        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
                        months.push({
                            name: d.toLocaleDateString('id-ID', {
                                month: 'long',
                                year: 'numeric'
                            }),
                            month: d.getMonth(),
                            year: d.getFullYear(),
                            days: new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(),
                            startDay: d.getDay()
                        })
                    }
                    this.calendarMonths = months
                },
                isDateDisabled(day, month, year) {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    return new Date(year, month, day) < today
                },
                isSelectedDate(day, month, year) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    return this.search.checkInDate === dateStr
                },
                selectDate(day, month, year) {
                    if (this.isDateDisabled(day, month, year)) return;
                    this.search.checkInDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    this.modals.date = !1
                },
                selectDestination(d) {
                    this.search.cityID = d.cityID;
                    this.search.cityName = d.name;
                    this.modals.destination = !1
                },
                addChild() {
                    if (this.search.childCount < 4) {
                        this.search.childCount++;
                        this.search.childAges.push(5)
                    }
                },
                removeChild() {
                    if (this.search.childCount > 0) {
                        this.search.childCount--;
                        this.search.childAges.pop()
                    }
                },
                initObserver() {
                    const observer = new IntersectionObserver((entries) => {
                        if (entries[0].isIntersecting && this.hasMore && !this.loading) {
                            this.loadMoreHotels()
                        }
                    }, {
                        rootMargin: '200px'
                    });
                    const trigger = document.getElementById('load-more-trigger');
                    if (trigger) observer.observe(trigger);
                },
                loadMoreHotels() {
                    const start = (this.currentPage - 1) * this.itemsPerPage;
                    const nextBatch = this.hotelList.slice(start, start + this.itemsPerPage);
                    if (nextBatch.length > 0) {
                        this.displayedHotels = [...this.displayedHotels, ...nextBatch];
                        this.currentPage++;
                        this.hasMore = this.displayedHotels.length < this.hotelList.length
                    } else {
                        this.hasMore = !1
                    }
                    this.$nextTick(() => this.refreshIcons())
                },
                async performSearch() {
                    this.loading = !0;
                    this.currentPage = 1;
                    this.hotelList = [];
                    this.displayedHotels = [];
                    const {
                        checkIn,
                        checkOut
                    } = this.buildDateRange();
                    const payload = {
                        paxPassport: "ID",
                        countryID: "ID",
                        cityID: String(this.search.cityID),
                        checkInDate: checkIn,
                        checkOutDate: checkOut,
                        roomRequest: this.buildRoomRequest()
                    };
                    try {
                        const res = await fetch('https://darma.siappgo.id/api/hotels/search', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                        const r = await res.json();
                        this.hotelList = r.hotels || [];
                        this.stage = 'results';
                        this.loadMoreHotels();
                        setTimeout(() => this.initObserver(), 500)
                    } catch (e) {
                        this.showToast("Koneksi bermasalah. Coba lagi.")
                    } finally {
                        this.loading = !1;
                        this.refreshIcons()
                    }
                },
                onSearchByNameInput() {
                    if (this.searchByNameQuery.trim().length === 0) {
                        this.searchByNameResults = [];
                        this.searchByNameHasSearched = !1
                    }
                },
                async searchHotelByName() {
                    if (!this.searchByNameQuery || this.searchByNameQuery.trim().length < 2) return;
                    this.searchByNameLoading = !0;
                    this.searchByNameHasSearched = !1;
                    this.searchByNameResults = [];
                    try {
                        const res = await fetch('https://darma.siappgo.id/api/hotels/search-by-name', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                hotelName: this.searchByNameQuery.trim()
                            })
                        });
                        const data = await res.json();
                        this.searchByNameResults = Array.isArray(data.hotels) ? data.hotels : [];
                        if (this.searchByNameResults.length === 0) {
                            this.showToast("Hotel tidak ditemukan. Coba kata kunci lain.")
                        }
                    } catch (e) {
                        this.showToast("Gagal mencari hotel: " + e.message)
                    } finally {
                        this.searchByNameLoading = !1;
                        this.searchByNameHasSearched = !0;
                        this.refreshIcons()
                    }
                },
                async selectHotelByName(hotel) {
                    const nameParts = hotel.Name.split(' - ');
                    const cityGuess = nameParts.length >= 2 ? nameParts[nameParts.length - 1].replace(', Indonesia', '').trim() : '';
                    this.search.cityID = hotel.cityID;
                    this.search.cityName = cityGuess || `City ${hotel.cityID}`;
                    this.selectedHotel = {
                        ID: hotel.ID,
                        name: hotel.Name,
                        cityID: hotel.cityID,
                        internalCode: hotel.ID
                    };
                    await this.getAvailableRooms(this.selectedHotel)
                },
                async getAvailableRooms(hotel) {
                    this.loading = !0;
                    this.loadingText = "Memuat kamar tersedia...";
                    this.showFullMessage = !1;
                    this.selectedHotel = hotel;
                    const {
                        checkIn,
                        checkOut
                    } = this.buildDateRange();
                    const payload = {
                        hotelID: hotel.ID,
                        paxPassport: "ID",
                        countryID: "ID",
                        cityID: String(this.search.cityID),
                        checkInDate: checkIn,
                        checkOutDate: checkOut,
                        roomRequest: this.buildRoomRequest()
                    };
                    try {
                        const res = await fetch('https://darma.siappgo.id/api/hotels/available-rooms', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        if (data.status === "SUCCESS") {
                            this.selectedHotel = data.hotelInfo;
                            this.roomList = data.hotelInfo.rooms || [];
                            this.stage = 'detail'
                        } else {
                            this.showToast(data.respMessage || "Kamar tidak tersedia.")
                        }
                    } catch (e) {
                        this.showToast("Detail hotel gagal dimuat.")
                    } finally {
                        this.loading = !1;
                        this.loadingText = '';
                        this.refreshIcons()
                    }
                },
                openBookingPage(room) {
                    this.selectedRoom = room;
                    this.bookingData.paxes = Array.from({
                        length: this.search.adultCount
                    }, () => ({
                        title: 'Mr.',
                        firstName: '',
                        lastName: ''
                    }));
                    this.stage = 'booking';
                    this.refreshIcons()
                },
                async submitBooking() {
                    if (!this.bookingData.contactEmail || !this.bookingData.contactPhone) {
                        this.showToast("Isi Email & No WA terlebih dahulu!");
                        return
                    }
                    if (this.bookingData.paxes.some(p => !p.firstName || !p.lastName)) {
                        this.showToast("Lengkapi nama semua tamu!");
                        return
                    }
                    this.totalBayarJagel = Math.round(this.selectedRoom.totalPrice) + this.biayaAdminJagel;
                    this.isSaldoCukup = !0;
                    this.showConfirmModal = !0;
                    setTimeout(() => typeof lucide !== 'undefined' && lucide.createIcons(), 100)
                },
                async executeFinalBooking() {
                    this.loading = !0;
                    this.loadingText = "Menyiapkan data harga terbaru...";
                    try {
                        const {
                            checkIn,
                            checkOut
                        } = this.buildDateRange();
                        const resPrice = await fetch('https://darma.siappgo.id/api/hotels/price-info', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                cityID: String(this.search.cityID),
                                checkInDate: checkIn,
                                checkOutDate: checkOut,
                                roomRequest: this.buildRoomRequest(!1),
                                internalCode: this.selectedHotel.internalCode,
                                hotelID: this.selectedHotel.ID,
                                breakfast: this.selectedRoom.breakfast,
                                roomID: this.selectedRoom.ID
                            })
                        });
                        const priceData = await resPrice.json();
                        if (priceData.status !== "SUCCESS" || !priceData.isEnableBooking) {
                            throw new Error(priceData.respMessage || "Kamar sudah tidak tersedia.")
                        }
                        const totalWajibBayar = Math.round(priceData.totalPrice) + this.biayaAdminJagel;
                        this.loadingText = "Memproses voucher hotel...";
                        const resBooking = await fetch('https://darma.siappgo.id/api/hotels/booking', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                paxPassport: "ID",
                                countryID: "ID",
                                cityID: String(this.search.cityID),
                                checkInDate: checkIn,
                                checkOutDate: checkOut,
                                roomRequest: this.buildRoomRequest(!0),
                                internalCode: this.selectedHotel.internalCode,
                                hotelID: this.selectedHotel.ID,
                                breakfast: this.selectedRoom.breakfast,
                                roomID: this.selectedRoom.ID,
                                bedType: {
                                    ID: "",
                                    bed: ""
                                },
                                agentOsRef: "LC-" + Date.now(),
                                commission: priceData.commission,
                                username: "{username}"
                            })
                        });
                        const r = await resBooking.json();
                        if (r.status === "SUCCESS" && r.internalStatus === "Accept") {
                            this.showConfirmModal = !1;
                            r.totalPrice = totalWajibBayar;
                            this.bookingResult = r;
                            this.loadingText = "Booking Berhasil!";
                            setTimeout(() => {
                                this.stage = 'success_page';
                                this.loading = !1;
                                window.scrollTo(0, 0)
                            }, 1000)
                        } else if (r.internalStatus === "Processed") {
                            this.showConfirmModal = !1;
                            this.loading = !1;
                            this.showToast("Pesanan sedang diproses. Silakan cek menu Riwayat secara berkala.", "warning");

                        } else {
                            throw new Error(r.respMessage || "Booking gagal dikonfirmasi.")
                        }
                    } catch (e) {
                        console.error("Booking Error:", e);
                        this.showToast(e.message, "error");
                        this.loading = !1
                    }
                }, async  showToastProcessed(message) {
                    const existingToast = document.getElementById('toast-processed');
                    if (existingToast) existingToast.remove(); const toast = document.createElement('div');
                    toast.id = 'toast-processed';
                    toast.innerHTML = `
        <div style="
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(245,158,11,0.4);
            font-size: 14px;
            font-weight: 500;
            max-width: 420px;
            width: 90%;
            text-align: center;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUpFade 0.4s ease;
        ">
            <span style="font-size: 20px;">⏳</span> <div>
                <div style="font-weight: 700; margin-bottom: 4px;">Pesanan Sedang Diproses</div>
                <div style="opacity: 0.9; font-size: 13px;">${message}</div>
                <div style="opacity: 0.8; font-size: 12px; margin-top: 6px;">Mengalihkan ke riwayat booking...</div>
            </div>
        </div>
    `;
                    if (!document.getElementById('toast-style')) {
                        const style = document.createElement('style');
                        style.id = 'toast-style';
                        style.textContent = `
            @keyframes slideUpFade {
                from { opacity: 0; transform: translateX(-50%) translateY(20px); }
                to   { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
        `; document.head.appendChild(style);
                    } document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 4000);
                }
            };
        } 
    </script>
</body>

</html>
