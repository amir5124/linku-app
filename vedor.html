<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Vendor Dashboard — Bus & Travel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <style>
        :root {
            --p: #24b3ae;
            --p-dark: #1a8a86;
            --p-light: #e3f6f5;
            --s: #e03f7d;
            --bg: #eef1f8;
            --tx: #2d2f36;
            --mt: #8a8f9c;
            --ln: #dfe3ee;
            --ok: #1f9d55;
            --ok-light: #e4f7ec;
            --warn: #e8710a;
            --warn-light: #ffeadb;
            --err: #e5484d;
            --err-light: #fde2e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Poppins, sans-serif;
            -webkit-tap-highlight-color: transparent
        }

        body {
            background: var(--bg);
            color: var(--tx);
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh
        }

        #app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f6f8fc;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 0, 0, .04)
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: 0
        }

        input,
        select,
        textarea {
            font-family: inherit;
            width: 100%;
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            outline: none;
            background: #fff;
            color: var(--tx)
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--p)
        }

        textarea {
            min-height: 80px;
            resize: vertical
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--mt);
            margin-bottom: 6px;
            font-weight: 500
        }

        .field {
            margin-bottom: 14px
        }

        .hdr {
            background: linear-gradient(120deg, var(--p-dark), var(--p));
            color: #fff;
            padding: 18px 18px 22px;
            border-radius: 0 0 22px 22px;
            box-shadow: 0 4px 16px rgba(36, 179, 174, .25)
        }

        .hdr-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #fff;
            color: var(--p-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, .6)
        }

        .hdr-top b {
            font-size: 16px;
            display: block
        }

        .hdr-top span {
            font-size: 12px;
            opacity: .85
        }

        .hdr-badge {
            margin-left: auto;
            background: rgba(255, 255, 255, .18);
            border: 1px solid rgba(255, 255, 255, .35);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600
        }

        .hdr-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: rgba(255, 255, 255, .12);
            border-radius: 12px;
            padding: 12px
        }

        .hdr-stats>div {
            text-align: center
        }

        .hdr-stats b {
            display: block;
            font-size: 18px;
            font-weight: 700
        }

        .hdr-stats span {
            font-size: 11px;
            opacity: .85
        }

        .tabs {
            display: flex;
            background: #fff;
            margin: 14px 14px 0;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            position: sticky;
            top: 8px;
            z-index: 10;
            overflow-x: auto
        }

        .tabs button {
            flex: 1;
            min-width: 68px;
            background: transparent;
            color: var(--mt);
            padding: 10px 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap
        }

        .tabs button.on {
            background: var(--p-light);
            color: var(--p-dark)
        }

        .content {
            flex: 1;
            padding: 14px
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06)
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .card-title iconify-icon {
            color: var(--p);
            font-size: 22px
        }

        .card-sub {
            font-size: 12px;
            color: var(--mt);
            margin-bottom: 14px
        }

        .btn {
            width: 100%;
            background: var(--p);
            color: #fff;
            font-weight: 600;
            padding: 13px;
            border-radius: 8px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px
        }

        .btn:hover {
            background: var(--p-dark)
        }

        .btn:disabled {
            background: #c9cfdb;
            cursor: not-allowed
        }

        .btn-outline {
            background: #fff;
            color: var(--p);
            border: 1.5px solid var(--p)
        }

        .btn-outline:hover {
            background: var(--p-light)
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 13px;
            width: auto
        }

        .btn-ok {
            background: var(--ok);
            color: #fff
        }

        .btn-warn {
            background: var(--warn);
            color: #fff
        }

        .btn-err {
            background: var(--err);
            color: #fff
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .sched {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            border-left: 4px solid var(--p)
        }

        .sched.draft {
            border-left-color: var(--warn)
        }

        .sched.published {
            border-left-color: var(--ok)
        }

        .sched.unpublished {
            border-left-color: var(--err)
        }

        .sched.template {
            border-left-color: #7b5ea7;
            background: linear-gradient(90deg, #f6f2ff, #fff 40%)
        }

        .sched-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px
        }

        .sched-head b {
            font-size: 14px
        }

        .sched-head .mt {
            font-size: 12px;
            color: var(--mt)
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600
        }

        .badge.ok {
            background: var(--ok-light);
            color: var(--ok)
        }

        .badge.warn {
            background: var(--warn-light);
            color: var(--warn)
        }

        .badge.err {
            background: var(--err-light);
            color: var(--err)
        }

        .badge.mt {
            background: var(--bg);
            color: var(--mt)
        }

        .badge.info {
            background: var(--p-light);
            color: var(--p-dark)
        }

        .badge.template {
            background: #ede7f6;
            color: #7b5ea7
        }

        .sched-route {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            padding: 10px;
            background: var(--bg);
            border-radius: 8px
        }

        .sched-route .city {
            font-size: 14px;
            font-weight: 600
        }

        .sched-route .time {
            font-size: 12px;
            color: var(--mt)
        }

        .sched-route iconify-icon {
            color: var(--p);
            font-size: 20px
        }

        .sched-info {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: var(--mt);
            margin-top: 8px;
            flex-wrap: wrap
        }

        .sched-info span {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .sched-actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--ln);
            flex-wrap: wrap
        }

        .sched-actions button {
            flex: 1;
            min-width: 70px;
            padding: 8px 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            background: var(--bg);
            color: var(--tx);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px
        }

        .sched-actions button.publish {
            background: var(--ok-light);
            color: var(--ok)
        }

        .sched-actions button.edit {
            background: var(--p-light);
            color: var(--p-dark)
        }

        .sched-actions button.clone {
            background: #fff3cd;
            color: #8a6d00
        }

        .sched-actions button.delete {
            background: var(--err-light);
            color: var(--err)
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            z-index: 50;
            display: flex;
            align-items: flex-end;
            justify-content: center
        }

        .sheet {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 22px 22px 0 0;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            animation: up .3s
        }

        @keyframes up {
            from {
                transform: translateY(60px);
                opacity: .5
            }
        }

        .sheet-head {
            padding: 14px 20px 12px;
            border-bottom: 1px solid var(--ln);
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .sheet-head h2 {
            font-size: 17px;
            font-weight: 700
        }

        .sheet-head button {
            background: transparent;
            color: var(--mt);
            font-size: 24px;
            display: flex
        }

        .sheet-body {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1
        }

        .sheet-foot {
            padding: 12px 20px 18px;
            border-top: 1px solid var(--ln);
            display: flex;
            gap: 10px
        }

        .grab {
            width: 40px;
            height: 5px;
            border-radius: 3px;
            background: #c4c8d3;
            margin: 0 auto 10px
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--mt)
        }

        .empty iconify-icon {
            font-size: 56px;
            opacity: .4;
            margin-bottom: 10px;
            display: block
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translateX(-50%);
            background: #2d2f36;
            color: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            z-index: 99;
            max-width: 90%;
            font-size: 13px;
            text-align: center
        }

        .nav-foot {
            display: flex;
            background: #fff;
            border-top: 1px solid var(--ln);
            position: sticky;
            bottom: 0;
            z-index: 5
        }

        .nav-foot button {
            flex: 1;
            background: transparent;
            padding: 12px 4px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--mt);
            font-size: 10px;
            font-weight: 600
        }

        .nav-foot button.on {
            color: var(--p)
        }

        .nav-foot button iconify-icon {
            font-size: 22px
        }

        .status-page {
            text-align: center;
            padding: 40px 24px
        }

        .status-icon {
            font-size: 72px;
            margin-bottom: 16px;
            display: inline-block
        }

        .status-icon.pending {
            color: var(--warn)
        }

        .status-icon.rejected {
            color: var(--err)
        }

        .status-icon.suspended {
            color: var(--err)
        }

        .status-icon.register {
            color: var(--p)
        }

        .status-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px
        }

        .status-desc {
            font-size: 13px;
            color: var(--mt);
            margin-bottom: 20px;
            line-height: 1.6
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--ln);
            font-size: 13px;
            text-align: left
        }

        .info-row:last-child {
            border-bottom: 0
        }

        .info-row span:first-child {
            color: var(--mt)
        }

        .info-row span:last-child {
            font-weight: 600;
            text-align: right
        }

        .sk {
            background: linear-gradient(90deg, #e6e9f2 25%, #f5f6fb 50%, #e6e9f2 75%);
            background-size: 200% 100%;
            animation: shm 1.2s infinite;
            border-radius: 8px;
            height: 16px
        }

        @keyframes shm {
            to {
                background-position: -200% 0
            }
        }

        .mt {
            color: var(--mt)
        }

        .grn {
            color: var(--ok)
        }

        .rd {
            color: var(--err)
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .mb-2 {
            margin-bottom: 8px
        }

        .mb-3 {
            margin-bottom: 14px
        }

        .facility-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid var(--ln);
            background: #fff;
            color: var(--tx)
        }

        .facility-chip.on {
            background: var(--p-light);
            border-color: var(--p);
            color: var(--p-dark)
        }

        .day-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            border: 1.5px solid var(--ln);
            background: #fff;
            color: var(--tx);
            font-weight: 600;
            font-size: 12px
        }

        .day-chip.on {
            background: var(--p);
            border-color: var(--p);
            color: #fff
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--ln)
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .photo-item .tag {
            position: absolute;
            top: 4px;
            left: 4px;
            background: var(--p);
            color: #fff;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600
        }

        .photo-item .tag.new {
            background: var(--warn)
        }

        .photo-item .btn-x {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: var(--err);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border: 0;
            cursor: pointer
        }

        .photo-item .btn-cover {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, .7);
            color: #fff;
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 4px;
            border: 0;
            cursor: pointer
        }

        .plan-option {
            display: flex;
            gap: 12px;
            padding: 14px;
            border: 2px solid var(--ln);
            border-radius: 10px;
            cursor: pointer;
            background: #fff;
            transition: all .2s;
            margin-bottom: 10px
        }

        .plan-option.on {
            border-color: var(--p);
            background: var(--p-light)
        }

        .plan-option input {
            width: 20px;
            height: 20px;
            accent-color: var(--p);
            margin-top: 2px;
            flex-shrink: 0
        }

        .plan-option b {
            display: block;
            margin-bottom: 4px
        }

        .plan-option .desc {
            font-size: 12px;
            color: var(--mt);
            line-height: 1.5
        }

        .seat-picker {
            display: grid;
            gap: 6px;
            padding: 12px;
            background: var(--bg);
            border-radius: 10px;
            margin-top: 6px
        }

        .seat-row {
            display: flex;
            gap: 6px;
            justify-content: center
        }

        .seat-cell {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600
        }

        .seat-cell.seat {
            background: #9be0dd;
            color: #0d6e6a;
            border: 1px solid var(--p)
        }

        .seat-cell.driver {
            background: #e5e8ef;
            color: #8a8f9c;
            font-size: 14px
        }

        .seat-cell.empty {
            background: transparent
        }
    </style>
</head>

        /* =====================================================================

            },

            vehicleForm: {

                vehicle_type: 'shuttle', plate_number: '',
                brand: '', model: '', year: new Date().getFullYear(),
                seat_arrangement: '', capacity: 8,

            },

            saving: false, registering: false, savingVehicle: false,
            savingRoute: false, savingBank: false, savingProfile: false,
            savingTopup: false, savingClone: false, savingTemplate: false,
        };

        const $ = s => document.querySelector(s);
        const ic = (n, z) => `<iconify-icon icon="${n}" style="font-size:${z || 20}px"></iconify-icon>`;
        const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const P = n => 'IDR ' + Number(n || 0).toLocaleString('id-ID');

        const DN = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
        const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const DAY_NAMES = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];

        function fmtDate(s) {
            if (!s) return '-';
            const d = new Date(String(s).replace(' ', 'T'));
            if (isNaN(d)) return s;
            return `${DN[d.getDay()]}, ${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()}`;
        }
        function fmtTime(s) {
            if (!s) return '-';
            return String(s).slice(11, 16) || String(s).slice(0, 5);
        }
        function fmtDateTime(s) {
            if (!s) return '-';
            return `${fmtDate(s)} • ${fmtTime(s)}`;
        }
        function toast(m) {
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = m;
            document.body.append(el);
            setTimeout(() => el.remove(), 2600);
        }
        function pad2(n) { return String(n).padStart(2, '0'); }

        /* =====================================================================
         * API LAYER
         * ===================================================================== */
        function userHeaders(extra = {}) {
            return {
                'Content-Type': 'application/json',
                'X-User-Id': USER.user_id,
                'X-Username': USER.username,
                'X-FullName': USER.fullname,
                'X-Phone': USER.phone || '',
                'X-Email': USER.email || '',
                ...extra
            };
        }

        async function authFetch(path, options = {}) {
            const headers = userHeaders(options.headers || {});
            let res, data;
            try {
                res = await fetch(API_BASE + path, { ...options, headers });
            } catch (e) {
                throw new Error('Tidak dapat terhubung ke server');
            }
            try { data = await res.json(); } catch (e) { data = null; }
            if (!res.ok || (data && data.success === false)) {
                const err = new Error((data && data.message) || `Error ${res.status}`);
                err.status = res.status;
                err.data = data;
                throw err;
            }
            return data;
        }

        const apiGet = (path) => authFetch(path, { method: 'GET' });
        const apiPost = (path, body) => authFetch(path, { method: 'POST', body: JSON.stringify(body) });
        const apiPut = (path, body) => authFetch(path, { method: 'PUT', body: JSON.stringify(body) });
        const apiPatch = (path, body) => authFetch(path, { method: 'PATCH', body: JSON.stringify(body) });
        const apiDelete = (path) => authFetch(path, { method: 'DELETE' });

        /* =====================================================================
         * LOAD INITIAL
         * ===================================================================== */
        async function loadInitial() {
            S.loading = true;
            render();

            try {
                const r = await fetch(`${API_BASE}/public/cities`);
                const d = await r.json();
                S.cities = d.data || [];
            } catch (e) { S.cities = []; }

            // Master template kursi (publik)
            try {
                const r = await fetch(`${API_BASE}/public/seat-templates`);
                const d = await r.json();
                S.seatTemplates = d.data || [];
            } catch (e) { S.seatTemplates = []; }

            try {
                const d = await apiGet('/auth/me');
                const vendors = d.data?.vendors || [];

                if (vendors.length === 0) {
                    S.vendorStatus = 'none';
                    S.vendorInfo = null;
                    S.registerForm.contact_phone = USER.phone || '';
                    S.registerForm.contact_email = USER.email || '';
                } else {
                    // ✅ Prioritas: active > pending > suspended > rejected
                    const PRIORITY = { active: 4, pending: 3, suspended: 2, rejected: 1 };
                    const v = vendors
                        .slice()
                        .sort((a, b) => (PRIORITY[b.status] || 0) - (PRIORITY[a.status] || 0))[0];

                    S.vendorInfo = v;
                    S.vendorStatus = v.status || 'none';

                    if (v.status === 'active') {
                        const vid = v.vendor_id;

                        try { const d = await apiGet(`/vendors/${vid}/routes`); S.routes = d.data || []; } catch (e) { S.routes = []; }
                        try { const d = await apiGet(`/vendors/${vid}/vehicles`); S.vehicles = d.data || []; } catch (e) { S.vehicles = []; }
                        try { const d = await apiGet(`/vendors/${vid}/schedules`); S.schedules = d.data || []; } catch (e) { S.schedules = []; }
                        try { const d = await apiGet(`/vendors/${vid}/schedule-templates`); S.templates = d.data || []; } catch (e) { S.templates = []; }
                        try { const d = await apiGet(`/vendors/${vid}/facilities`); S.facilities = d.data || []; } catch (e) { S.facilities = []; }
                        try { const d = await apiGet(`/vendors/${vid}/seat-layouts`); S.seatLayouts = d.data || []; } catch (e) { S.seatLayouts = []; }

                        try {
                            const d = await apiGet(`/vendors/${vid}`);
                            const vd = d.data || {};
                            S.vendorInfo = { ...S.vendorInfo, ...vd };
                            S.bankAccounts = vd.bank_accounts || [];
                            S.profileForm = {
                                name: vd.name || '',
                                legal_name: vd.legal_name || '',
                                npwp: vd.npwp || '',
                                nib: vd.nib || '',
                                contact_phone: vd.contact_phone || '',
                                contact_email: vd.contact_email || '',
                                address: vd.address || '',
                                logo_url: vd.logo_url || '',
                                description: vd.description || '',
                            };
                        } catch (e) { S.bankAccounts = []; }
                    }
                }
            } catch (e) {
                console.warn('[loadInitial]', e.message);
                S.vendorStatus = 'none';
            }

            S.loading = false;
            render();
        }

        /* =====================================================================
         * HELPERS — hitung jam tiba (client-side preview)
         * ===================================================================== */
        function computeArrivalPreview(depDate, depTime, durationMin) {
            if (!depDate || !depTime) return null;
            const dur = Number(durationMin) || 180;
            const dep = new Date(`${depDate}T${depTime}:00`);
            if (isNaN(dep)) return null;
            const arr = new Date(dep.getTime() + dur * 60000);
            return arr;
        }

        function fmtPreview(arr) {
            if (!arr) return 'Isi tanggal & jam dulu';
            const sameDay = new Date().toDateString() === arr.toDateString();
            return `Estimasi tiba: <b>${sameDay ? '' : pad2(arr.getDate()) + '/' + pad2(arr.getMonth() + 1) + ' '}${pad2(arr.getHours())}:${pad2(arr.getMinutes())}</b>`;
        }

        /* =====================================================================
         * SEAT CONFIG RESOLVER (dari state form)
         * ===================================================================== */
        function buildSeatConfigFromForm(f) {
            if (f.seat_source === 'template' && f.seat_template_id) {
                return { type: 'template', template_id: Number(f.seat_template_id) };
            }
            if (f.seat_source === 'custom' && f.seat_custom) {
                const seats = f.seat_custom.split(/[,\s]+/).map(x => x.trim()).filter(Boolean);
                if (seats.length) return { type: 'custom', seats };
            }
            return null;   // vehicle default
        }

        let topupPollTimer = null;
        function startTopupPolling() {
            stopTopupPolling();
            topupPollTimer = setInterval(async () => {
                if (!S.topupInfo?.topup_id) { stopTopupPolling(); return; }
                try {
                    const vid = S.vendorInfo.vendor_id;
                    const d = await apiGet(`/vendors/${vid}/topup/history`);
                    const list = d.data || [];
                    const current = list.find(t => t.id === S.topupInfo.topup_id);
                    if (current && current.status === 'paid') {
                        stopTopupPolling();
                        toast('✅ Topup berhasil! Vendor aktif kembali.');
                        closeModal();
                        loadInitial();
                    }
                } catch (e) { /* silent */ }
            }, 5000);
        }
        function stopTopupPolling() {
            if (topupPollTimer) { clearInterval(topupPollTimer); topupPollTimer = null; }
        }

        async function saveVehicle() {
            const f = S.vehicleForm;
            if (!f.name || f.name.trim().length < 2) return toast('Nama armada minimal 2 karakter');
            if (!f.class_name || f.class_name.trim().length < 2) return toast('Kelas armada wajib');
            if (!f.vehicle_type) return toast('Pilih tipe armada');
            if (!f.capacity || Number(f.capacity) < 1) return toast('Kapasitas minimal 1');
            if (!f.seat_layout_id) return toast('Pilih denah kursi');

            S.savingVehicle = true;
            render();

            const vid = S.vendorInfo.vendor_id;

            try {
                const fd = new FormData();
                fd.append('name', f.name.trim());
                fd.append('class_name', f.class_name.trim());
                fd.append('vehicle_type', f.vehicle_type);
                fd.append('plate_number', f.plate_number?.trim() || '');
                fd.append('brand', f.brand?.trim() || '');
                fd.append('model', f.model?.trim() || '');
                fd.append('year', f.year || '');
                fd.append('seat_arrangement', f.seat_arrangement?.trim() || '');
                fd.append('capacity', f.capacity);
                fd.append('seat_layout_id', f.seat_layout_id);
                fd.append('is_active', f.is_active ? '1' : '0');

                (f.facility_ids || []).forEach(id => fd.append('facility_ids[]', id));
                (f.photos || []).forEach(p => fd.append('photos', p));

                const url = f.id
                    ? `${API_BASE}/vendors/${vid}/vehicles/${f.id}`
                    : `${API_BASE}/vendors/${vid}/vehicles`;
                const method = f.id ? 'PATCH' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: {
                        'X-User-Id': USER.user_id,
                        'X-Username': USER.username,
                        'X-FullName': USER.fullname,
                        'X-Phone': USER.phone || '',
                        'X-Email': USER.email || '',
                    },
                    body: fd,
                });
                const data = await res.json();
                if (!res.ok || data.success === false) throw new Error(data.message || 'Gagal simpan');

                toast(f.id ? 'Armada diperbarui' : 'Armada ditambahkan');
                const list = await apiGet(`/vendors/${vid}/vehicles`);
                S.vehicles = list.data || S.vehicles;
                closeModal();
            } catch (e) {
                toast('Gagal: ' + e.message);
            } finally {
                S.savingVehicle = false;
                render();
            }
        }

        async function saveRoute() {
            const f = S.routeForm;
            if (!f.origin_city_id) return toast('Pilih kota asal');
            if (!f.destination_city_id) return toast('Pilih kota tujuan');
            if (f.origin_city_id === f.destination_city_id) return toast('Kota asal dan tujuan tidak boleh sama');

            S.savingRoute = true;
            render();

            const vid = S.vendorInfo.vendor_id;
            const payload = {
                origin_city_id: Number(f.origin_city_id),
                destination_city_id: Number(f.destination_city_id),
                name: f.name?.trim() || null,
            };

            try {
                if (f.id) {
                    await apiPut(`/vendors/${vid}/routes/${f.id}`, payload);
                    toast('Rute diperbarui');
                } else {
                    await apiPost(`/vendors/${vid}/routes`, payload);
                    toast('Rute ditambahkan');
                }
                const list = await apiGet(`/vendors/${vid}/routes`);
                S.routes = list.data || S.routes;
                closeModal();
            } catch (e) {
                toast('Gagal: ' + e.message);
            } finally {
                S.savingRoute = false;
                render();
            }
        }

        /* =====================================================================
         * STOPS
         * ===================================================================== */
        async function loadStopsForRoute(routeId, resetSelection) {
            if (resetSelection) {
                S.form.pickup_stop_id = '';
                S.form.dropoff_stop_id = '';
            }
            S.pickupStops = [];
            S.dropoffStops = [];

            if (!routeId) { render(); return; }

            const route = S.routes.find(r => String(r.id) === String(routeId));
            if (!route) { render(); return; }

            render();

            const vid = S.vendorInfo.vendor_id;
            try {
                const [pu, dr] = await Promise.all([
                    apiGet(`/vendors/${vid}/stops?city_id=${route.origin_city_id}`),
                    apiGet(`/vendors/${vid}/stops?city_id=${route.destination_city_id}`),
                ]);
                S.pickupStops = pu.data || [];
                S.dropoffStops = dr.data || [];
            } catch (e) {
                toast('Gagal ambil titik naik/turun: ' + e.message);
            }
            render();
        }

        function onRouteChange(routeId) {
            S.form.route_id = routeId;
            loadStopsForRoute(routeId, true);
        }

        /* =====================================================================
         * MODAL HANDLERS
         * ===================================================================== */
        function openForm(schedule = null) {
            if (!schedule) {
                if (S.routes.length === 0 && S.vehicles.length === 0) {
                    toast('Tambah rute dan armada terlebih dahulu sebelum membuat jadwal');
                    return;
                }
                if (S.routes.length === 0) { toast('Tambah rute terlebih dahulu'); return; }
                if (S.vehicles.length === 0) { toast('Tambah armada terlebih dahulu'); return; }
            }

            if (schedule) {
                const depAt = String(schedule.departure_at || '');
                S.form = {
                    id: schedule.id,
                    route_id: String(schedule.route_id || ''),
                    vehicle_id: String(schedule.vehicle_id || ''),
                    pickup_stop_id: schedule.pickup_stop_id || '',
                    dropoff_stop_id: schedule.dropoff_stop_id || '',
                    departure_date: depAt.slice(0, 10),
                    departure_time: depAt.slice(11, 16),
                    duration_minutes: schedule.duration_minutes || 180,
                    price: schedule.price || '',
                    original_price: schedule.original_price || '',
                    discount_percent: schedule.discount_percent || 0,
                    insurance_available: !!schedule.insurance_available,
                    insurance_product_id: schedule.insurance_product_id || 1,
                    direction: schedule.direction || 'pergi',
                    is_popular: !!schedule.is_popular,
                    seat_source: 'vehicle',   // edit tidak override seat
                    seat_template_id: '',
                    seat_custom: '',
                };
            } else {
                S.form = {
                    id: null, route_id: '', vehicle_id: '',
                    pickup_stop_id: '', dropoff_stop_id: '',
                    departure_date: '', departure_time: '',
                    duration_minutes: 180,
                    price: '', original_price: '', discount_percent: 0,
                    insurance_available: false, insurance_product_id: 1,
                    direction: 'pergi', is_popular: false,
                    seat_source: 'vehicle',
                    seat_template_id: '',
                    seat_custom: '',

            S.modal = 'formSchedule';
            render();
            loadStopsForRoute(S.form.route_id, false);
        }

        function render() {
            $('#app').innerHTML = `

                ${S.vendorStatus === 'active' ? renderTabs() : ''}

        function renderHeader() {
            const initials = (USER.fullname || 'U').split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();

            const statusBadge = {
                pending: `<div class="hdr-badge">⏳ Pending</div>`,
                active: `<div class="hdr-badge">✓ Aktif</div>`,
                rejected: `<div class="hdr-badge">✕ Ditolak</div>`,
                suspended: `<div class="hdr-badge">⛔ Suspend</div>`,
                none: `<div class="hdr-badge">Belum Daftar</div>`,
            }[S.vendorStatus] || `<div class="hdr-badge">···</div>`;

            const statsHtml = S.vendorStatus === 'active' ? `
                <div class="hdr-stats">
                    <div><b>${S.schedules.length}</b><span>Jadwal</span></div>
                    <div><b>${S.templates.length}</b><span>Reguler</span></div>
                    <div><b>${S.vehicles.length}</b><span>Armada</span></div>
                </div>
            ` : '';

            return `
                <div class="hdr">
                    <div class="hdr-top">
                        <div class="avatar">${initials}</div>
                        <div style="flex:1">
                            <b>${esc(USER.fullname)}</b>
                            <span>@${esc(USER.username)}${S.vendorInfo ? ' · ' + esc(S.vendorInfo.name) : ''}</span>
                        </div>
                        ${statusBadge}
                    </div>
                    ${statsHtml}
                </div>
            `;
        }

        function renderTabs() {
            const t = [
                { k: 'schedules', l: 'Jadwal', i: 'mdi:calendar-clock' },
                { k: 'templates', l: 'Reguler', i: 'mdi:calendar-sync' },
                { k: 'routes', l: 'Rute', i: 'mdi:map-marker-path' },
                { k: 'vehicles', l: 'Armada', i: 'mdi:bus' },
                { k: 'profile', l: 'Profil', i: 'mdi:account-circle' }
            ];
            return `
                <div class="tabs">
                    ${t.map(x => `
                        <button class="${S.tab === x.k ? 'on' : ''}" onclick="tab('${x.k}')">
                            ${ic(x.i, 18)}
                            <span>${x.l}</span>
                        </button>
                    `).join('')}
                </div>
            `;
        }

            if (S.loading) return renderSkeleton();

            if (S.vendorStatus === 'suspended') return renderSuspendedPage();
            if (S.tab === 'schedules') return renderSchedules();
            if (S.tab === 'templates') return renderTemplates();
            if (S.tab === 'routes') return renderRoutes();
            if (S.tab === 'vehicles') return renderVehicles();
            if (S.tab === 'profile') return renderProfile();

        /* ============ SEAT PICKER (preview grid) ============ */
        function renderSeatPreview(seatSource, templateId, customText) {
            let grid = null;
            if (seatSource === 'template' && templateId) {
                const tpl = S.seatTemplates.find(t => String(t.id) === String(templateId));
                if (tpl && tpl.grid) {
                    grid = typeof tpl.grid === 'string' ? JSON.parse(tpl.grid) : tpl.grid;
                }
            }
            if (grid) {
                return `
                    <div class="seat-picker">
                        ${grid.map(row => `
                            <div class="seat-row">
                                ${(row.cells || []).map(cell => {
                    if (cell === 'driver') return `<div class="seat-cell driver">${ic('mdi:steering', 16)}</div>`;
                    if (cell === 'empty' || cell == null || cell === '') return `<div class="seat-cell empty"></div>`;
                    return `<div class="seat-cell seat">${esc(cell)}</div>`;
                }).join('')}
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            if (seatSource === 'custom' && customText) {
                const seats = customText.split(/[,\s]+/).map(x => x.trim()).filter(Boolean);
                return `
                    <div class="seat-picker" style="grid-template-columns:repeat(4,1fr)">
                        ${seats.map(s => `<div class="seat-cell seat">${esc(s)}</div>`).join('')}
                    </div>
                `;
            }
            return `<div class="mt" style="font-size:11px;margin-top:6px">Kursi akan diambil dari denah kendaraan yang dipilih.</div>`;
        }

                            </div>
                           <div class="field">
    <label>Denah Kursi *</label>
    <select onchange="S.vehicleForm.seat_layout_id=this.value">
        <option value="">-- Pilih Denah --</option>
        ${S.seatTemplates.map(t => `
            <option value="${t.id}" ${String(f.seat_layout_id) === String(t.id) ? 'selected' : ''}>
                ${esc(t.name)} • ${t.total_seats} kursi
            </option>
        `).join('')}
    </select>
    <div class="mt" style="font-size:11px;margin-top:4px">
        ${ic('mdi:information', 12)} Denah kursi standar sistem. Pilih sesuai tipe kendaraan.
    </div>
</div>
                            <div class="field">
                                <label>Nomor Plat</label>
                                <input type="text" placeholder="B 1234 XYZ"
                                       value="${esc(f.plate_number)}" oninput="S.vehicleForm.plate_number=this.value">
                            </div>
                            <div class="row-2">
                                <div class="field">
                                    <label>Merek</label>
                                    <input type="text" placeholder="Toyota" value="${esc(f.brand)}"
                                           oninput="S.vehicleForm.brand=this.value">
                                </div>
                                <div class="field">
                                    <label>Model</label>
                                    <input type="text" placeholder="Hiace Premio" value="${esc(f.model)}"
                                           oninput="S.vehicleForm.model=this.value">
                                </div>
                            </div>
                            <div class="row-2">
                                <div class="field">
                                    <label>Tahun</label>
                                    <input type="number" min="2000" max="2100" value="${esc(f.year)}"
                                           onchange="S.vehicleForm.year=this.value">
                                </div>
                                <div class="field">
                                    <label>Konfigurasi Kursi</label>
                                    <input type="text" placeholder="1-1 atau 2-2"
                                           value="${esc(f.seat_arrangement)}"
                                           oninput="S.vehicleForm.seat_arrangement=this.value">
                                </div>
                            </div>
                            <div class="field">
                                <label>Fasilitas</label>
                                <div style="display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--bg);border-radius:8px">
                                    ${S.facilities.length === 0
                    ? '<span class="mt">Belum ada fasilitas master</span>'
                    : S.facilities.map(fac => {
                        const checked = (f.facility_ids || []).includes(fac.id);
                        return `
                                                <label class="facility-chip ${checked ? 'on' : ''}">
                                                    <input type="checkbox" style="display:none" ${checked ? 'checked' : ''}
                                                           onchange="toggleFacility(${fac.id})">
                                                    ${checked ? ic('mdi:check', 12) : ''}
                                                    ${esc(fac.name)}
                                                </label>
                                            `;
                    }).join('')
                }
                                </div>
                            </div>

                            <div class="field">
                                <label>Foto Armada (Maks 10)</label>
                                ${(f.existingPhotos || []).length ? `
                                    <div style="margin-bottom:12px">
                                        <div class="mt" style="font-size:11px;margin-bottom:6px">
                                            Foto Tersimpan (${f.existingPhotos.length})
                                        </div>
                                        <div class="photo-grid">
                                            ${f.existingPhotos.map(p => `
                                                <div class="photo-item">
                                                    <img src="${esc(p.url)}" alt="foto">
                                                    ${p.is_cover ? `<span class="tag">Cover</span>` : ''}
                                                    <button type="button" class="btn-x"
                                                            onclick="removeExistingVehiclePhoto(${p.id})">✕</button>
                                                    ${!p.is_cover ? `
                                                        <button type="button" class="btn-cover"
                                                                onclick="setVehicleCoverPhoto(${p.id})">Set Cover</button>
                                                    ` : ''}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}

                                <input type="file" accept="image/*" multiple id="vehiclePhotoInput"
                                       onchange="onVehiclePhotosChange(this)"
                                       style="border:1px dashed var(--p);padding:14px;text-align:center;cursor:pointer;background:var(--p-light);border-radius:8px">

                                ${(f.photos || []).length ? `
                                    <div style="margin-top:12px">
                                        <div class="mt" style="font-size:11px;margin-bottom:6px">
                                            Foto Baru (${f.photos.length})
                                        </div>
                                        <div class="photo-grid">
                                            ${f.photos.map((file, idx) => `
                                                <div class="photo-item">
                                                    <img src="${URL.createObjectURL(file)}" alt="preview">
                                                    <span class="tag new">Baru</span>
                                                    <button type="button" class="btn-x"
                                                            onclick="removeNewPhoto(${idx})">✕</button>
                                                </div>
                                            `).join('')}
                                        </div>
                                        <button type="button" class="btn btn-outline btn-sm"
                                                style="width:100%;margin-top:8px"
                                                onclick="clearNewPhotos()">
                                            ${ic('mdi:close', 14)} Batalkan Semua Foto Baru
                                        </button>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="field" style="display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg);border-radius:8px">
                                <input type="checkbox" style="width:20px;height:20px;accent-color:var(--p)"
                                       ${f.is_active ? 'checked' : ''}
                                       onchange="S.vehicleForm.is_active=this.checked?1:0">
                                <label style="margin:0;flex:1">Armada aktif</label>
                            </div>
                        </div>
                        <div class="sheet-foot">
                            <button class="btn btn-outline" onclick="closeModal()">Batal</button>
                            <button class="btn" onclick="saveVehicle()" ${S.savingVehicle ? 'disabled' : ''}>
                                ${S.savingVehicle ? 'Menyimpan...' : ic('mdi:content-save', 18) + ' Simpan'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /* ============ FORM ROUTE ============ */
        function renderFormRoute() {
            const f = S.routeForm;
            return `
                <div class="ov" onclick="if(event.target===this) closeModal()">
                    <div class="sheet">
                        <div class="sheet-head">
                            <div><div class="grab"></div><h2>${f.id ? 'Edit Rute' : 'Tambah Rute'}</h2></div>
                            <button onclick="closeModal()">${ic('mdi:close', 24)}</button>
                        </div>
                        <div class="sheet-body">
                            <div class="field">
                                <label>Kota Asal *</label>
                                <button type="button" class="btn btn-outline btn-sm" style="width:100%"
                                        onclick="openCityPick2('origin_city_id')">
                                    ${f.origin_city_id ? esc(S.cities.find(c => c.id == f.origin_city_id)?.name || '-') : 'Pilih Kota Asal'}
                                </button>
                            </div>
                            <div class="field">
                                <label>Kota Tujuan *</label>
                                <button type="button" class="btn btn-outline btn-sm" style="width:100%"
                                        onclick="openCityPick2('destination_city_id')">
                                    ${f.destination_city_id ? esc(S.cities.find(c => c.id == f.destination_city_id)?.name || '-') : 'Pilih Kota Tujuan'}
                                </button>
                            </div>
                            <div class="field">
                                <label>Nama Rute (opsional)</label>
                                <input type="text" placeholder="Jakarta - Bandung"
                                       value="${esc(f.name)}" oninput="S.routeForm.name=this.value">
                            </div>
                        </div>
                        <div class="sheet-foot">
                            <button class="btn btn-outline" onclick="closeModal()">Batal</button>
                            <button class="btn" onclick="saveRoute()" ${S.savingRoute ? 'disabled' : ''}>
                                ${S.savingRoute ? 'Menyimpan...' : ic('mdi:content-save', 18) + ' Simpan'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /* ============ FORM BANK ============ */
        function renderFormBank() {
            const f = S.bankForm;
            return `
                <div class="ov" onclick="if(event.target===this) closeModal()">
                    <div class="sheet">
                        <div class="sheet-head">
                            <div><div class="grab"></div><h2>Tambah Rekening Bank</h2></div>
                            <button onclick="closeModal()">${ic('mdi:close', 24)}</button>
                        </div>
                        <div class="sheet-body">
                            <div class="field">
                                <label>Nama Bank *</label>
                                <input type="text" placeholder="BCA / Mandiri / BNI"
                                       value="${esc(f.bank_name)}" oninput="S.bankForm.bank_name=this.value">
                            </div>
                            <div class="field">
                                <label>Nomor Rekening *</label>
                                <input type="text" placeholder="1234567890"
                                       value="${esc(f.account_number)}" oninput="S.bankForm.account_number=this.value">
                            </div>
                            <div class="field">
                                <label>Nama Pemilik Rekening *</label>
                                <input type="text" placeholder="PT Cititrans Indonesia"
                                       value="${esc(f.account_holder)}" oninput="S.bankForm.account_holder=this.value">
                            </div>
                            <div class="field" style="display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg);border-radius:8px">
                                <input type="checkbox" style="width:20px;height:20px;accent-color:var(--p)"
                                       ${f.is_primary ? 'checked' : ''}
                                       onchange="S.bankForm.is_primary=this.checked?1:0">
                                <label style="margin:0;flex:1">Jadikan rekening utama</label>
                            </div>
                        </div>
                        <div class="sheet-foot">
                            <button class="btn btn-outline" onclick="closeModal()">Batal</button>
                            <button class="btn" onclick="saveBank()" ${S.savingBank ? 'disabled' : ''}>
                                ${S.savingBank ? 'Menyimpan...' : ic('mdi:content-save', 18) + ' Simpan'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /* ============ FORM PROFILE ============ */
        function renderFormProfile() {
            const f = S.profileForm;
            return `
                <div class="ov" onclick="if(event.target===this) closeModal()">
                    <div class="sheet">
                        <div class="sheet-head">
                            <div><div class="grab"></div><h2>Edit Profil Vendor</h2></div>
                            <button onclick="closeModal()">${ic('mdi:close', 24)}</button>
                        </div>
                        <div class="sheet-body">
                            <div class="field">
                                <label>Nama Vendor *</label>
                                <input type="text" value="${esc(f.name)}" oninput="S.profileForm.name=this.value">
                            </div>
                            <div class="field">
                                <label>Nama Legal</label>
                                <input type="text" value="${esc(f.legal_name)}" oninput="S.profileForm.legal_name=this.value">
                            </div>
                            <div class="row-2">
                                <div class="field">
                                    <label>NPWP</label>
                                    <input type="text" value="${esc(f.npwp)}" oninput="S.profileForm.npwp=this.value">
                                </div>
                                <div class="field">
                                    <label>NIB</label>
                                    <input type="text" value="${esc(f.nib)}" oninput="S.profileForm.nib=this.value">
                                </div>
                            </div>
                            <div class="row-2">
                                <div class="field">
                                    <label>No. HP</label>
                                    <input type="tel" value="${esc(f.contact_phone)}" oninput="S.profileForm.contact_phone=this.value">
                                </div>
                                <div class="field">
                                    <label>Email</label>
                                    <input type="email" value="${esc(f.contact_email)}" oninput="S.profileForm.contact_email=this.value">
                                </div>
                            </div>
                            <div class="field">
                                <label>Alamat</label>
                                <textarea oninput="S.profileForm.address=this.value">${esc(f.address)}</textarea>
                            </div>
                            <div class="field">
                                <label>URL Logo</label>
                                <input type="url" placeholder="https://..." value="${esc(f.logo_url)}"
                                       oninput="S.profileForm.logo_url=this.value">
                            </div>
                            <div class="field">
                                <label>Deskripsi</label>
                                <textarea oninput="S.profileForm.description=this.value">${esc(f.description)}</textarea>
                            </div>
                        </div>
                        <div class="sheet-foot">
                            <button class="btn btn-outline" onclick="closeModal()">Batal</button>
                            <button class="btn" onclick="saveProfile()" ${S.savingProfile ? 'disabled' : ''}>
                                ${S.savingProfile ? 'Menyimpan...' : ic('mdi:content-save', 18) + ' Simpan'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /* ============ PICK CITY ============ */
        function renderPickCity() { return renderPickCityGeneric('pickCity'); }
        function renderPickCity2() { return renderPickCityGeneric('pickCity2'); }

        function renderPickCityGeneric(mode) {
            const q = S.cityPickSearch.toLowerCase();
            const list = q ? S.cities.filter(c => c.name.toLowerCase().includes(q)) : S.cities;
            const pickFn = mode === 'pickCity' ? 'pickCity' : 'pickCity2';

            return `
                <div class="ov" onclick="if(event.target===this) closeModal()">
                    <div class="sheet" style="max-height:80vh">
                        <div class="sheet-head">
                            <div><div class="grab"></div><h2>Pilih Kota</h2></div>
                            <button onclick="closeModal()">${ic('mdi:close', 24)}</button>
                        </div>
                        <div class="sheet-body">
                            <div class="field">
                                <input id="citySearch" type="text" placeholder="Cari kota..."
                                       value="${esc(S.cityPickSearch)}"
                                       oninput="S.cityPickSearch=this.value; render(); setTimeout(()=>document.getElementById('citySearch').focus(), 30)">
                            </div>
                            ${list.length === 0
                    ? `<div class="empty">${ic('mdi:map-marker-off', 48)}<p>Kota tidak ditemukan</p></div>`
                    : list.map(c => `
                                    <div onclick="${pickFn}(${c.id})"
                                         style="padding:14px 4px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px;cursor:pointer">
                                        ${ic('mdi:map-marker', 20)}
                                        <div>
                                            <b>${esc(c.name)}</b>
                                            ${c.province ? `<div class="mt" style="font-size:12px">${esc(c.province)}</div>` : ''}
                                        </div>
                                    </div>
                                `).join('')
                }
                        </div>
                    </div>
                </div>
            `;
        }

        /* =====================================================================
         * INIT
         * ===================================================================== */
        render();
        loadInitial();
    </script>
</body>

</html>
