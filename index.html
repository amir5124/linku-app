<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang di LinkU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-2xl backdrop-blur-md mb-4 text-white">
                <i class="fa-solid fa-link text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">LinkU</h1>
            <p class="text-blue-100 mt-2 text-sm">Smart Payment Solution</p>
        </div>

        <div class="p-8 text-center">
            <h2 class="text-xl font-semibold text-slate-800 mb-2">Halo, Selamat Datang!</h2>
            <p class="text-slate-500 leading-relaxed mb-8">
                Terima kasih telah bergabung. LinkU siap membantu transaksi Anda menjadi lebih mudah, aman, dan efisien.
            </p>

            <div class="space-y-3">
                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition duration-300 shadow-lg shadow-blue-200">
                    Buka Dashboard
                </button>
                <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-6 rounded-xl transition duration-300">
                    Pelajari Fitur
                </button>
            </div>
        </div>

        <div class="border-t border-slate-50 p-6 bg-slate-50/50 text-center text-xs text-slate-400">
            &copy; 2026 LinkU System. Powered by TangerangFast.
        </div>
    </div>

</body>
</html>
